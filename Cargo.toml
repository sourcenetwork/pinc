[workspace]
resolver = "3"
members = ["crates/*", "tests", "benches"]
exclude = ["distributed"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/vinc"
publish = false

# Every dependency of every member is declared here, once; members only say `{ workspace = true }` and add features.
# Every VINC crate has the workspace version, and the entries below pin that same version.
[workspace.dependencies]
vinc-wire = { path = "crates/vinc-wire", version = "0.1.0" }
vinc-dag = { path = "crates/vinc-dag", version = "0.1.0" }
vinc-crypto = { path = "crates/vinc-crypto", version = "0.1.0" }
vinc-security = { path = "crates/vinc-security", version = "0.1.0" }
vinc-keystore = { path = "crates/vinc-keystore", version = "0.1.0" }
vinc-transport = { path = "crates/vinc-transport", version = "0.1.0" }
vinc-membership = { path = "crates/vinc-membership", version = "0.1.0" }
vinc-sim = { path = "crates/vinc-sim", version = "0.1.0" }
vinc-connect = { path = "crates/vinc-connect", version = "0.1.0" }
vinc-reconcile = { path = "crates/vinc-reconcile", version = "0.1.0" }
vinc-dtn = { path = "crates/vinc-dtn", version = "0.1.0" }
vinc-values = { path = "crates/vinc-values", version = "0.1.0" }
vinc-core = { path = "crates/vinc-core", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
sha2 = { version = "0.11.1", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
p256 = { version = "0.14.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false }
aes = { version = "0.9.4", default-features = false }
chacha20 = { version = "0.10.2", default-features = false }
cpufeatures = { version = "0.3.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
ml-kem = { version = "0.3.4", default-features = false }
ml-dsa = { version = "0.1.2", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
tpm2-protocol = { version = "1.2.3", default-features = false }

criterion = "0.7.0"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# The multi-GiB value tests hash gigabytes; keep the hash fast in the dev and test profiles.
[profile.dev.package.blake3]
opt-level = 3
