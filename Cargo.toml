[workspace]
resolver = "3"
members = ["crates/*", "tests", "benches"]
exclude = ["distributed"]

[workspace.package]
version = "0.1.0"
authors = ["Theo M. Bulut <theo@source.network>"]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/vinc"
publish = false

# Every dependency of every member is declared here, once; members only say `{ workspace = true }` and add features.
# Every VINC crate has the workspace version, and the entries below pin that same version.
[workspace.dependencies]
vinc-wire = { path = "crates/vinc-wire", version = "0.1.0" }
vinc-dag = { path = "crates/vinc-dag", version = "0.1.0" }
vinc-crypto = { path = "crates/vinc-crypto", version = "0.1.0" }
vinc-security = { path = "crates/vinc-security", version = "0.1.0" }
vinc-keystore = { path = "crates/vinc-keystore", version = "0.1.0" }
vinc-transport = { path = "crates/vinc-transport", version = "0.1.0" }
vinc-membership = { path = "crates/vinc-membership", version = "0.1.0" }
vinc-sim = { path = "crates/vinc-sim", version = "0.1.0" }
vinc-connect = { path = "crates/vinc-connect", version = "0.1.0" }
vinc-reconcile = { path = "crates/vinc-reconcile", version = "0.1.0" }
vinc-dtn = { path = "crates/vinc-dtn", version = "0.1.0" }
vinc-values = { path = "crates/vinc-values", version = "0.1.0" }
vinc-core = { path = "crates/vinc-core", version = "0.1.0" }
vinc-broadcast = { path = "crates/vinc-broadcast", version = "0.1.0" }
vinc = { path = "crates/vinc", version = "0.1.0" }
vinc-node = { path = "crates/vinc-node", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
sha2 = { version = "0.11.1", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
p256 = { version = "0.14.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false }
aes = { version = "0.9.4", default-features = false }
chacha20 = { version = "0.10.2", default-features = false }
cpufeatures = { version = "0.3.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
ml-kem = { version = "0.3.4", default-features = false }
ml-dsa = { version = "0.1.2", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
tpm2-protocol = { version = "1.2.3", default-features = false }
rapidhash = "4.5.1"

nuclei = "0.5.8"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }
smol = "2.0.2"

criterion = "0.7.0"

# The comparison harness only (`vinc-benches`): the libraries VINC is measured against and the runtime they need.
iroh = "1.4.1"
libp2p = { version = "0.57.1", default-features = false }
libp2p-stream = "0.5.0-alpha"
futures = { version = "0.3.34", default-features = false }
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# Tests hash gigabytes, sign thousands of messages and run real endpoints for minutes of virtual time, which the
# unoptimised build of the dependencies and of the hot crates makes an order of magnitude too slow. Debug assertions
# and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.vinc-wire]
opt-level = 3

[profile.dev.package.vinc-crypto]
opt-level = 3

[profile.dev.package.vinc-security]
opt-level = 3

[profile.dev.package.vinc-transport]
opt-level = 3

[profile.dev.package.vinc-core]
opt-level = 3

# The facade builds the endpoint's slot table on the heap, one slot at a time; unoptimised code would keep several
# copies of a slot and of a stream table (hundreds of kilobytes each) on the stack while it does.
[profile.dev.package.vinc]
opt-level = 3

[profile.dev.package.vinc-sim]
opt-level = 3
