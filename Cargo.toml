[workspace]
resolver = "3"
members = ["crates/*", "tests", "benches"]
exclude = ["distributed"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/vinc"
publish = false

# Every dependency of every member is declared here, once; members only say `{ workspace = true }` and add features.
# Every VINC crate has the workspace version, and the entries below pin that same version.
[workspace.dependencies]
vinc-wire = { path = "crates/vinc-wire", version = "0.1.0" }
vinc-dag = { path = "crates/vinc-dag", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

criterion = "0.8.2"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
