[workspace]
resolver = "3"
members = ["crates/*", "tests", "tests/noalloc"]
# The benchmarks and the distributed harness are workspaces of their own: the libraries they measure PINC against, their
# runtimes and their C code stay out of the library's graph and lockfile.
exclude = ["benches", "distributed"]

[workspace.package]
version = "0.1.0"
authors = ["Theo M. Bulut <theo@source.network>"]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/pinc"
publish = false

# Every dependency of every member is declared here, once; members only say `{ workspace = true }` and add features.
# Every PINC crate has the workspace version, and the entries below pin that same version.
[workspace.dependencies]
pinc-wire = { path = "crates/pinc-wire", version = "0.1.0" }
pinc-dag = { path = "crates/pinc-dag", version = "0.1.0" }
pinc-crypto = { path = "crates/pinc-crypto", version = "0.1.0" }
pinc-security = { path = "crates/pinc-security", version = "0.1.0" }
pinc-keystore = { path = "crates/pinc-keystore", version = "0.1.0" }
pinc-transport = { path = "crates/pinc-transport", version = "0.1.0" }
pinc-membership = { path = "crates/pinc-membership", version = "0.1.0" }
pinc-sim = { path = "crates/pinc-sim", version = "0.1.0" }
pinc-connect = { path = "crates/pinc-connect", version = "0.1.0" }
pinc-portmap = { path = "crates/pinc-portmap", version = "0.1.0" }
pinc-reconcile = { path = "crates/pinc-reconcile", version = "0.1.0" }
pinc-dtn = { path = "crates/pinc-dtn", version = "0.1.0" }
pinc-values = { path = "crates/pinc-values", version = "0.1.0" }
pinc-core = { path = "crates/pinc-core", version = "0.1.0" }
pinc-broadcast = { path = "crates/pinc-broadcast", version = "0.1.0" }
pinc = { path = "crates/pinc", version = "0.1.0" }
pinc-node = { path = "crates/pinc-node", version = "0.1.0" }
pinc-table = { path = "crates/pinc-table", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
sha2 = { version = "0.11.1", default-features = false }
blake2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false }
p256 = { version = "0.14.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
aes-gcm = { version = "0.11.1", default-features = false }
aes = { version = "0.9.4", default-features = false }
chacha20 = { version = "0.10.2", default-features = false }
cpufeatures = { version = "0.3.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }
ml-kem = { version = "0.3.4", default-features = false }
ml-dsa = { version = "0.1.2", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
tpm2-protocol = { version = "1.2.3", default-features = false }
once_cell = { version = "1.21.4", default-features = false, features = ["race", "alloc"] }
hashbrown = { version = "0.17.1", default-features = false }
rapidhash = { version = "4.5.1", default-features = false }

nuclei = "0.5.8"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }
smol = "2.0.2"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# An application's debug build: every crate at opt-level 0, with none of the dev profile's per-package optimisation
# below (a profile that inherits `dev` would keep it). `just unoptimised` runs the stack tests in it.
[profile.unoptimised]
inherits = "release"
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 256
incremental = true
panic = "unwind"

# Tests hash gigabytes, sign thousands of messages and run real endpoints for minutes of virtual time, which the
# unoptimised build of the dependencies and of the hot crates makes an order of magnitude too slow. Debug assertions
# and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.pinc-wire]
opt-level = 3

[profile.dev.package.pinc-crypto]
opt-level = 3

[profile.dev.package.pinc-security]
opt-level = 3

[profile.dev.package.pinc-transport]
opt-level = 3

[profile.dev.package.pinc-core]
opt-level = 3

# The facade builds the endpoint's slot table on the heap, one slot at a time; unoptimised code would keep several
# copies of a slot and of a stream table (hundreds of kilobytes each) on the stack while it does.
[profile.dev.package.pinc]
opt-level = 3

# The node composes the connectivity layer, membership and broadcast, which hold their buffers inline; built unoptimised
# they keep several copies of the node on the stack while the facade builds it on the heap.
[profile.dev.package.pinc-node]
opt-level = 3

[profile.dev.package.pinc-connect]
opt-level = 3

[profile.dev.package.pinc-membership]
opt-level = 3

[profile.dev.package.pinc-broadcast]
opt-level = 3

[profile.dev.package.pinc-sim]
opt-level = 3

[profile.dev.package.pinc-dag]
opt-level = 3

[profile.dev.package.pinc-values]
opt-level = 3

[profile.dev.package.pinc-reconcile]
opt-level = 3
