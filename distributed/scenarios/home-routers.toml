name = "home-routers"
about = "Two nodes each behind a home router (one port-restricted, one symmetric) with a public site between them; the transport tests dial from behind the address translation to the public node."
stacks = ["pinc", "iroh", "libp2p"]
repetitions = 3

[[sites]]
name = "home1"
nat = "port-restricted"

[[sites]]
name = "home2"
nat = "symmetric"

[[sites]]
name = "public"

[[nodes]]
name = "n1"
site = "home1"

[[nodes]]
name = "n2"
site = "home2"

[[nodes]]
name = "rv"
site = "public"
role = "relay"

[[links]]
a = "home1"
b = "public"
shape = { delay_ms = 10, rate_mbit = 50 }
reverse = { rate_mbit = 200 }

[[links]]
a = "home2"
b = "public"
shape = { delay_ms = 15, rate_mbit = 20 }
reverse = { rate_mbit = 100 }

[workload]
kind = "transport"
timeout_s = 180
pairs = [{ client = "n1", server = "rv" }, { client = "n2", server = "rv" }]

[[workload.tests]]
test = "setup"
count = 200

[[workload.tests]]
test = "resume"
count = 200

[[workload.tests]]
test = "throughput"
bytes = 16777216
streams = 1
