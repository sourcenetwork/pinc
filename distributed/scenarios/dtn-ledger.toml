name = "dtn-ledger"
about = "The store ledger and bundle lifetime: three 30-second updates for a phone that never comes into contact before they expire. The cloud carrier's budget holds two bundles, so it refuses the third for lack of room rather than evict live custody, never holds more than its budget, and every holder ends the bundles at their lifetime. VINC only: iroh and libp2p keep no bounded bundle store."
stacks = ["vinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1024, 65536, 1048576]
duration_s = 55

[[workload.nodes]]
name = "cloud"
budget_bundles = 2.5

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
count = 3
copies = 2
lifetime_s = 30

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 1
to_s = 40

[[workload.checks]]
rule = "refused"
at = "cloud"
reason = "no-room"

[[workload.checks]]
rule = "within-budget"
at = "cloud"

[[workload.checks]]
rule = "expired"
at = ["laptop", "cloud"]

[[workload.checks]]
rule = "not-delivered"
to = "phone"
