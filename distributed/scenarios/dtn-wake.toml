name = "dtn-wake"
about = "A device that sleeps and wakes with no contact schedule, the real DefraDB case. The phone is paused when the update is sent and resumed later; the laptop hands the update and custody to the cloud carrier and then sleeps itself. The carrier holds custody, dials the phone while it sleeps and backs off, and delivers on its first dial after the wake, within the longest dial backoff. The send-to-delivery time is reported. PINC only."
stacks = ["pinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1024, 65536]
duration_s = 90

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 2
lifetime_s = 200

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "cloud" }]

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "cloud"
after_s = 20

[[faults]]
at_s = 0
action = { do = "pause", node = "phone" }

[[faults]]
at_s = 12
action = { do = "pause", node = "laptop" }

[[faults]]
at_s = 20
action = { do = "resume", node = "phone" }
