name = "lan-per-core"
about = "Two nodes on one switched LAN: 0.2 ms round trip, 1 Gbit/s each way. In the many test VINC runs one endpoint on each of a node's two CPUs and the other libraries run their runtime over both."
stacks = ["vinc", "iroh", "libp2p"]
repetitions = 3
vinc_endpoints = "per-core"

[resources]
cpus = 2
memory_mib = 2048

[[sites]]
name = "office"
lan = { delay_ms = 0.05, rate_mbit = 1000 }

[[nodes]]
name = "n1"
site = "office"

[[nodes]]
name = "n2"
site = "office"

[workload]
kind = "transport"
timeout_s = 300
pairs = [{ client = "n1", server = "n2" }]

[[workload.tests]]
test = "throughput"
bytes = 268435456
streams = 1

[[workload.tests]]
test = "throughput"
bytes = 268435456
streams = 16

[[workload.tests]]
test = "many"
connections = 500
bytes_each = 65536

[[workload.tests]]
test = "many"
connections = 500
bytes_each = 65536
reading = "driven"
