name = "lossy-8mib"
about = "The lossy path (200 ms round trip, 30 ms jitter each way, 5% loss per packet each way, 10 Mbit/s) moving 8 MiB on one stream, with the congestion window sampled every 100 ms where the stack exposes it."
stacks = ["pinc", "iroh", "libp2p"]
repetitions = 3

[[sites]]
name = "near"

[[sites]]
name = "far"

[[nodes]]
name = "n1"
site = "near"

[[nodes]]
name = "n2"
site = "far"

[[links]]
a = "near"
b = "far"
shape = { delay_ms = 100, jitter_ms = 30, loss_pct = 5, rate_mbit = 10 }

[workload]
kind = "transport"
timeout_s = 900
pairs = [{ client = "n1", server = "n2" }]

[[workload.tests]]
test = "throughput"
bytes = 8388608
streams = 1
trace_ms = 100
