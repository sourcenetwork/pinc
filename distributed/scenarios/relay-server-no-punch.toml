name = "relay-server-no-punch"
about = "S5's no-punch case on real sockets: a consumer and a provider each behind a symmetric NAT, so no hole punch can work, fetch through a pinc_relay server (role relay-server, the binary in PINC_RELAY_BIN); the relay is also the hub. The relay forwards every packet."
stacks = ["pinc"]
repetitions = 3

[[sites]]
name = "home1"
nat = "symmetric"

[[sites]]
name = "home2"
nat = "symmetric"

[[sites]]
name = "public"

[[nodes]]
name = "consumer"
site = "home1"

[[nodes]]
name = "provider"
site = "home2"

[[nodes]]
name = "relay"
site = "public"
role = "relay-server"

[[links]]
a = "home1"
b = "public"
shape = { delay_ms = 10, rate_mbit = 50 }
reverse = { rate_mbit = 200 }

[[links]]
a = "home2"
b = "public"
shape = { delay_ms = 15, rate_mbit = 20 }
reverse = { rate_mbit = 100 }

[workload]
kind = "sync"
providers = ["provider"]
consumers = ["consumer"]
sizes = [1048576, 8388608]
timeout_s = 180
warmup_s = 8
