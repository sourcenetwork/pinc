name = "dtn-parity"
about = "A data slice with no live holder is rebuilt from parity: the laptop hands its bundle to the cloud and leaves contact for good; the cloud's store corrupts the first data slice of what it keeps, so the cloud is the only holder left and cannot prove that slice. The phone asks the cloud for data, the corrupt slice fails its proof, and the phone asks for one parity symbol of that erasure block in its place; finish rebuilds the slice from any k of the block's symbols and the phone opens the bundle intact. Before, the phone asked only for data and refused the bundle as a bad proof, so it was never delivered. VINC only."
stacks = ["vinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [65536, 1048576]
duration_s = 45

[[workload.nodes]]
name = "cloud"
tamper_one_slice = true

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 2
lifetime_s = 200
slice_log = 2

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 1
to_s = 10

[[workload.contacts]]
a = "cloud"
b = "phone"
from_s = 12
to_s = 45

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "cloud"
after_s = 12

[[workload.checks]]
rule = "parity"
at = "phone"
min = 1

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "cloud" }]
