name = "defra-pushlog-10"
about = "DefraDB's pushlog fan-out: one writer pushes 3000 updates of 1 KiB at 100 a second to 10 replicators across a WAN (20 ms round trip, 100 Mbit/s each way)."
stacks = ["pinc", "iroh", "libp2p"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 512

[[sites]]
name = "writer"
pos = [120, 200]

[[sites]]
name = "replicas"
pos = [520, 200]

[[nodes]]
name = "hub"
site = "writer"
role = "hub"

[[nodes]]
name = "w"
site = "writer"

[[nodes]]
name = "r"
site = "replicas"
count = 10

[[links]]
a = "writer"
b = "replicas"
shape = { delay_ms = 10, rate_mbit = 100 }

[workload]
kind = "pubsub"
publishers = ["w"]
messages = 3000
size = 1024
rate_hz = 100
warmup_s = 8
drain_s = 8
