name = "dtn-copies"
about = "Copy-limited spray and wait: the laptop (4 copies) fans its update out over contacts up only in windows. It hands two copies and custody to the office carrier, keeps two, and later meets the distractor peers c1 and cloud that take copies too; the office, in standing contact with the phone, delivers. No more holders than the 4-copy budget, and every node hands on fewer copies than it received. VINC only: iroh and libp2p have no copy-limited forwarding."
stacks = ["vinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "office"
site = "home"

[[nodes]]
name = "c1"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1024, 65536, 1048576]
duration_s = 60

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 4
lifetime_s = 300

[[workload.contacts]]
a = "laptop"
b = "office"
from_s = 3
to_s = 14

[[workload.contacts]]
a = "laptop"
b = "c1"
from_s = 18
to_s = 28

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 32
to_s = 42

[[workload.contacts]]
a = "office"
b = "phone"
from_s = 3
to_s = 60

[[workload.checks]]
rule = "copies"

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "office" }]

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "office"
