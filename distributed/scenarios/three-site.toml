name = "three-site"
about = "Three sites of eleven nodes (a hub and ten peers each) with 20, 80 and 150 ms round trips between them, 200 Mbit/s each way; the transport tests run across the 150 ms path."
stacks = ["vinc", "iroh", "libp2p"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "site-a"
pos = [120, 120]

[[sites]]
name = "site-b"
pos = [480, 120]

[[sites]]
name = "site-c"
pos = [300, 400]

[[nodes]]
name = "a-hub"
site = "site-a"
role = "hub"

[[nodes]]
name = "a"
site = "site-a"
count = 10

[[nodes]]
name = "b-hub"
site = "site-b"
role = "hub"

[[nodes]]
name = "b"
site = "site-b"
count = 10

[[nodes]]
name = "c-hub"
site = "site-c"
role = "hub"

[[nodes]]
name = "c"
site = "site-c"
count = 10

[[links]]
a = "site-a"
b = "site-b"
shape = { delay_ms = 10, rate_mbit = 200 }

[[links]]
a = "site-b"
b = "site-c"
shape = { delay_ms = 40, rate_mbit = 200 }

[[links]]
a = "site-a"
b = "site-c"
shape = { delay_ms = 75, rate_mbit = 200 }

[workload]
kind = "transport"
timeout_s = 240
pairs = [{ client = "a-1", server = "c-1" }]

[[workload.tests]]
test = "setup"
count = 100

[[workload.tests]]
test = "resume"
count = 100

[[workload.tests]]
test = "latency"
size = 64
round_trips = 50

[[workload.tests]]
test = "throughput"
bytes = 33554432
streams = 1

[[workload.tests]]
test = "throughput"
bytes = 33554432
streams = 16
