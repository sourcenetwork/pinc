name = "dtn-fragment"
about = "Fine-sliced bundles of 1 MiB and 4 MiB are received whole: cut into 4 KiB slices (slice_log 2) they make 65 and 258 erasure blocks, and a data-only reception holds one disjoint run per block. The reception counts held symbols per block, with no cap on runs, so the carrier receives both, takes custody and delivers to the phone, asking for no parity since nothing is lost. Before (an interval cap of 256 runs) the 4 MiB bundle overflowed and was refused as fragmented. VINC only."
stacks = ["vinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1048576, 4194304]
duration_s = 55

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 2
lifetime_s = 200
slice_log = 2

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 1
to_s = 12

[[workload.contacts]]
a = "cloud"
b = "phone"
from_s = 3
to_s = 55

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "cloud"

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "cloud" }]

[[workload.checks]]
rule = "parity"
at = "cloud"
max = 0

[[workload.checks]]
rule = "parity"
at = "phone"
max = 0
