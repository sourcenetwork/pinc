name = "dtn-fragment"
about = "A fine-sliced 1 MiB bundle is received after the reception cap is raised: cut into 4 KiB slices (slice_log 2) it makes 65 erasure blocks, so 65 disjoint verified ranges. With the reception's interval cap at 256 (raised from 64), the carrier receives it, takes custody and delivers to the phone; on master (cap 64) it overflows and is refused (see the dtn-fragment known-gap form in the base branch). VINC only."
stacks = ["vinc"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1048576]
duration_s = 55

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 2
lifetime_s = 200
slice_log = 2

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 1
to_s = 12

[[workload.contacts]]
a = "cloud"
b = "phone"
from_s = 3
to_s = 55

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "cloud"

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "cloud" }]
