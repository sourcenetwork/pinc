name = "dtn-store-forward"
about = "Store and forward: a DefraDB document update for a phone that is unreachable when it is sent. The laptop reaches only the cloud carrier, hands it a copy and custody, and the carrier delivers when the phone comes into contact later. PINC carries the update across the gap; iroh and libp2p run the same send as one pubsub publication, with no store and forward, while the phone is paused and resumed."
stacks = ["pinc", "iroh", "libp2p"]
repetitions = 3

[resources]
cpus = 1
memory_mib = 1024

[[sites]]
name = "home"

[[nodes]]
name = "hub"
site = "home"
role = "hub"

[[nodes]]
name = "laptop"
site = "home"

[[nodes]]
name = "cloud"
site = "home"

[[nodes]]
name = "phone"
site = "home"

[workload]
kind = "dtn"
sizes = [1024, 65536, 1048576]
duration_s = 55
baseline = true

[[workload.sends]]
at_s = 2
from = "laptop"
to = "phone"
copies = 2

[[workload.contacts]]
a = "laptop"
b = "cloud"
from_s = 1
to_s = 10

[[workload.contacts]]
a = "cloud"
b = "phone"
from_s = 20
to_s = 55

[[workload.checks]]
rule = "delivered"
to = "phone"
via = "cloud"
after_s = 20

[[workload.checks]]
rule = "custody"
moves = [{ from = "laptop", to = "cloud" }]

[[workload.checks]]
rule = "copies"

[[faults]]
at_s = 0
action = { do = "pause", node = "phone" }

[[faults]]
at_s = 20
action = { do = "resume", node = "phone" }
