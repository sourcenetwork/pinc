name = "low-bandwidth"
about = "A 2G or NB-IoT class link, emulated (its delay, loss and rate, not the radio): 1 s round trip (500 ms each way), 2% loss per packet each way, 0.05 Mbit/s each way; typical is 10 to 100 kbit/s, round trips of 600 ms to 2 s and 1 to 5% loss."
stacks = ["vinc", "iroh", "libp2p"]
repetitions = 3

[[sites]]
name = "field"

[[sites]]
name = "cloud"

[[nodes]]
name = "n1"
site = "field"

[[nodes]]
name = "n2"
site = "cloud"

[[links]]
a = "field"
b = "cloud"
shape = { delay_ms = 500, loss_pct = 2, rate_mbit = 0.05 }

[workload]
kind = "transport"
timeout_s = 900
pairs = [{ client = "n1", server = "n2" }]

[[workload.tests]]
test = "setup"
count = 6

[[workload.tests]]
test = "resume"
count = 3

[[workload.tests]]
test = "latency"
size = 64
round_trips = 8

[[workload.tests]]
test = "throughput"
bytes = 131072
streams = 1

[[workload.tests]]
test = "throughput"
bytes = 131072
streams = 16
