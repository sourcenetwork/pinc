name = "lan"
about = "Two nodes on one switched LAN: 0.2 ms round trip, 1 Gbit/s each way."
stacks = ["vinc", "iroh", "libp2p"]
repetitions = 3

[resources]
cpus = 2
memory_mib = 2048

[[sites]]
name = "office"
lan = { delay_ms = 0.05, rate_mbit = 1000 }

[[nodes]]
name = "n1"
site = "office"

[[nodes]]
name = "n2"
site = "office"

[workload]
kind = "transport"
timeout_s = 300
pairs = [{ client = "n1", server = "n2" }]

[[workload.tests]]
test = "setup"
count = 100

[[workload.tests]]
test = "resume"
count = 100

[[workload.tests]]
test = "latency"
size = 64
round_trips = 10000

[[workload.tests]]
test = "latency"
size = 1024
round_trips = 10000

[[workload.tests]]
test = "throughput"
bytes = 268435456
streams = 1

[[workload.tests]]
test = "throughput"
bytes = 268435456
streams = 16

[[workload.tests]]
test = "many"
connections = 500
bytes_each = 65536
