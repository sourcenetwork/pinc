name = "lossy"
about = "A slow lossy path: 200 ms round trip, 30 ms jitter each way (which reorders packets), 5% loss per packet each way, 10 Mbit/s."
stacks = ["vinc", "iroh", "libp2p"]
repetitions = 3

[[sites]]
name = "near"

[[sites]]
name = "far"

[[nodes]]
name = "n1"
site = "near"

[[nodes]]
name = "n2"
site = "far"

[[links]]
a = "near"
b = "far"
shape = { delay_ms = 100, jitter_ms = 30, loss_pct = 5, rate_mbit = 10 }

[workload]
kind = "transport"
timeout_s = 180
pairs = [{ client = "n1", server = "n2" }]

[[workload.tests]]
test = "setup"
count = 10

[[workload.tests]]
test = "resume"
count = 10

[[workload.tests]]
test = "latency"
size = 64
round_trips = 50

[[workload.tests]]
test = "throughput"
bytes = 1048576
streams = 1
