# The distributed test harness: one binary that builds an emulated or real network, runs PINC, iroh and rust-libp2p
# nodes on it, injects faults, measures, and serves a dashboard. A workspace of its own, outside the library's, so the
# comparators, their runtime (tokio) and their C code (ring, aws-lc-sys) never enter the library's dependency graph or
# lockfile. The PINC crates come in by path; every dependency is declared once, below.
[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Theo M. Bulut <theo@source.network>"]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/pinc"
publish = false

[workspace.dependencies]
pinc = { path = "../crates/pinc", version = "0.1.0" }
pinc-keystore = { path = "../crates/pinc-keystore", version = "0.1.0" }
# The layers the PINC node program composes; each is the library's own crate, by path.
pinc-node = { path = "../crates/pinc-node", version = "0.1.0" }
pinc-core = { path = "../crates/pinc-core", version = "0.1.0" }
pinc-crypto = { path = "../crates/pinc-crypto", version = "0.1.0" }
pinc-security = { path = "../crates/pinc-security", version = "0.1.0" }
pinc-connect = { path = "../crates/pinc-connect", version = "0.1.0" }
pinc-portmap = { path = "../crates/pinc-portmap", version = "0.1.0" }
pinc-membership = { path = "../crates/pinc-membership", version = "0.1.0" }
pinc-broadcast = { path = "../crates/pinc-broadcast", version = "0.1.0" }
pinc-values = { path = "../crates/pinc-values", version = "0.1.0" }
pinc-reconcile = { path = "../crates/pinc-reconcile", version = "0.1.0" }
pinc-dag = { path = "../crates/pinc-dag", version = "0.1.0" }
pinc-transport = { path = "../crates/pinc-transport", version = "0.1.0" }
pinc-dtn = { path = "../crates/pinc-dtn", version = "0.1.0" }

nuclei = "0.5.8"
tokio = { version = "1.54.1", default-features = false }
futures = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
# The dashboard's HTTP server.
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http-body-util = "0.1.5"
bytes = "1.12.1"
# The libraries PINC is measured against.
iroh = "1.4.1"
iroh-gossip = { version = "0.102.0", default-features = false, features = ["net"] }
iroh-blobs = { version = "0.104.1", default-features = false }
blake3 = "1.8.7"
libp2p = { version = "0.57.1", default-features = false }
libp2p-stream = "0.5.0-alpha"
# What the comparison reads of the libraries' handshakes: iroh's handshake data (noq's type), and libp2p-tls's configs
# in one handshake in memory. The versions and features are the ones the libraries already use.
noq = { version = "1.4.0", default-features = false, features = ["rustls"] }
libp2p-tls = "0.7.0"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# Segmented UDP sends and coalesced receives for the PINC host, the calls the compared libraries use.
quinn-udp = "0.5.16"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# The tests run the node programs for real, with the stacks' cryptography: unoptimised dependencies are an order of
# magnitude too slow for them. Debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 3

# The node programs are measured: the same optimisation as the library's own benchmarks.
[profile.release]
lto = "fat"
codegen-units = 1

[package]
name = "pinc-distributed"
description = "The distributed test harness: PINC, iroh and rust-libp2p nodes on an emulated or real network, with faults, kernel metrics and a live dashboard"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pinc = { workspace = true }
pinc-keystore = { workspace = true, features = ["std"] }
pinc-node = { workspace = true }
pinc-core = { workspace = true, features = ["alloc"] }
pinc-crypto = { workspace = true }
pinc-security = { workspace = true }
pinc-connect = { workspace = true }
pinc-portmap = { workspace = true }
pinc-membership = { workspace = true, features = ["alloc"] }
pinc-broadcast = { workspace = true, features = ["alloc"] }
pinc-values = { workspace = true }
pinc-reconcile = { workspace = true, features = ["alloc"] }
pinc-dag = { workspace = true, features = ["alloc"] }
pinc-transport = { workspace = true, features = ["alloc"] }
pinc-dtn = { workspace = true }
nuclei = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "process", "signal", "fs"] }
futures = { workspace = true, features = ["std", "async-await"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "ansi"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
iroh = { workspace = true }
iroh-gossip = { workspace = true }
iroh-blobs = { workspace = true }
blake3 = { workspace = true }
libp2p = { workspace = true, features = ["tokio", "quic", "tcp", "noise", "yamux", "macros", "gossipsub", "request-response"] }
libp2p-stream = { workspace = true }
noq = { workspace = true }
libp2p-tls = { workspace = true }
rustls = { workspace = true }
quinn-udp = { workspace = true }

[lints]
workspace = true
