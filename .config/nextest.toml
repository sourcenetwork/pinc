[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"

# Heavy tests: a loaded machine needs the bound explicit and generous, 15 periods of 60 s, never a skip.
[[profile.ci.overrides]]
filter = 'test(/^bulk_64_mib_/) | test(every_bit_flip_is_rejected_and_releases_nothing_bad) | binary(transport_wide)'
slow-timeout = { period = "60s", terminate-after = 15 }

# A thousand sessions in one process: alone on the machine, as a starved server lets its peers time out.
[[profile.ci.overrides]]
filter = 'binary(pinc_scale) & test(a_thousand_sessions_in_one_process_all_move_data)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 15 }

# The scenario targets run real endpoints for hundreds of seconds of virtual time; the full 96-seed runs
# (PINC_SUITE_FULL=1) and the reports need a generous, explicit bound.
[[profile.ci.overrides]]
filter = 'binary(/^scenario_(s1|internet|lowband|mobile|hostile|adversarial|churn|large|determinism)$/)'
slow-timeout = { period = "60s", terminate-after = 90 }
