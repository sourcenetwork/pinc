[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"

# Heavy tests: a loaded machine needs the bound explicit and generous, 15 periods of 60 s, never a skip.
[[profile.ci.overrides]]
filter = 'test(/^bulk_64_mib_/) | test(every_bit_flip_is_rejected_and_releases_nothing_bad) | binary(transport_wide) | binary(vinc_scale)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The scenario targets run real endpoints for hundreds of seconds of virtual time; the full 96-seed runs
# (VINC_SUITE_FULL=1) and the reports need a generous, explicit bound.
[[profile.ci.overrides]]
filter = 'binary(/^scenario_(s1|internet|mobile|hostile|adversarial|churn|large|determinism)$/)'
slow-timeout = { period = "60s", terminate-after = 15 }
