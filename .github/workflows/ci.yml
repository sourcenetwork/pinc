# CI runs the gate (`just gate`) through the same justfile recipes as a local run, split into jobs that run side by
# side: the static checks, the tests, the stack and harness tests, and the quick proofs. A pull request runs the
# first three, and the property tests (`just pbt`, a workspace of its own that is not part of the gate). The quick
# proofs take about two hours on a two-core runner, so they run on every push to master, every night and by hand, not
# on a pull request: a broken proof shows after it lands. `just proofs-deep` (every model over its full bounds, hours
# of processor time) is not part of the gate and does not run here.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a pull request's run: its group is its branch (`github.ref` would name master once the pull
# request is merged, and its last run would then cancel master's). Every other run (a push to master, the nightly
# one, one started by hand) is a group of its own, so it is never cancelled or left waiting by the next.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The workspace links several hundred test binaries; with debug information they fill a hosted runner's disk and
  # the linker dies. A panic still names its file and line without it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just setup
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just checks

  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just setup
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just test
      - run: just doctest

  stack:
    name: unoptimised stack and harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            distributed -> ../target-harness
      - run: just setup
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just unoptimised
      - run: just test-distributed

  pbt:
    name: property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pbt
      - run: just _rust
      - run: just pbt

  proofs:
    name: quick proofs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: proofs/lean/.lake
          key: lean-${{ hashFiles('proofs/lean/lean-toolchain', 'proofs/lean/lake-manifest.json', 'proofs/lean/**/*.lean') }}
          restore-keys: lean-
      - run: just setup
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just proofs
