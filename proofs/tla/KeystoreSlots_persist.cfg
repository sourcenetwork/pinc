\* Persistent keys (KeystoreSlots.tla): three slots, one held by another user of the TPM (Foreign 1), so one key at a
\* time fits beside the primary; load_persistent and persist besides the other operations; a flush may be refused
\* or its answer lost (persist's flush of the transient copy included: it is remembered on the stale list).
\* Small by construction; not measured.
