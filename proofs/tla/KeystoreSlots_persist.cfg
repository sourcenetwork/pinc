\* Persistent keys (KeystoreSlots.tla): three slots, one held by another user of the TPM (Foreign 1), so one key at a
\* time fits beside the primary; load_persistent and persist besides the other operations; a flush may be refused,
\* never answered after it ran (FlushLost FALSE: the lost answer of persist's flush is not modelled, see the header).
\* Small by construction; not measured.
SPECIFICATION Spec
CONSTANTS Slots = 3 NK = 2 Foreign = 1 NP = 4 FlushRefused = TRUE FlushLost = FALSE PERSIST = TRUE
INVARIANTS TypeOK Agree StaleNotLive LeakedOnStale NoFalseFull Usable Bounded NoLeakOnDrop
