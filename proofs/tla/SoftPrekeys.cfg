\* SoftPrekeys at a small policy: lifetime 2, 2 uses, acquires at times 0 to 3 (so a rotation by age, by uses, by
\* both, and an acquire before the creation of the current prekey), generations 0 to 4 (GENS = 100: no wrap).
\* About 300 states.
SPECIFICATION Spec
CONSTANTS LIFE = 2 USES = 2 TS = {0, 1, 2, 3} GENS = 100 GMAX = 4
CONSTRAINT Bound
INVARIANTS TypeOK HeldOne ServesAtMost FreshEnough RotatedOutRefused
PROPERTY GenerationsIncrease
CHECK_DEADLOCK FALSE
