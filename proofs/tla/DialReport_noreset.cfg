\* RED: a reject does not start the count again. The restarted peer answered, yet the flights before the reject
\* still count and its full handshake is cut short, so ReachLive must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = FALSE
    EarlyOnThin = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS ReachLive
CHECK_DEADLOCK FALSE
