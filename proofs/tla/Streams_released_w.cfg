\* RED: the earlier statement of the peer stream counter (CountersEveryLive: every live peer slot counts against the
\* limit). A peer stream carries one request and our answer: its data is whole and read, the end of the answer leaves
\* (SendOut) and the stream stops counting while its slot is held until the answer is acknowledged. TLC must find
\* CountersEveryLive violated.
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS CountersEveryLive
CHECK_DEADLOCK FALSE
