\* NodeSets_cancel.cfg: CancelledDoc holds: a round of a revoked peer or a leaving node ends Cancelled: a round waiting for the peer by the failed dial (fix A1) as by the shed one (fix N1), a round active on a session of the peer by that session's close (fix A1b); before them, finding F2: it ended Exhausted.
\* One peer that runs rounds (1) and one filler peer (2) whose incoming sessions take room in the layer table as
\* another layer's would; 3 endpoint session ids (so a dial, a filler and one more fit, and the endpoint refuses a dial
\* with none free); a layer table of 1 session (TABLE_MAX, 4096, in the code) and lconn of 1 (TABLE_MAX); 1 round at a
\* time (ROUNDS 8) and 2 rounds started in all, 1 answered stream (RESPONDERS 16), 2 attempts (ATTEMPTS 4); times 0
\* and 1, the maximum, with OPEN_RETRY 1, so a retry set at the maximum saturates.
SPECIFICATION Spec
CONSTANTS PEERS = {1} FILLERS = {2} SIDS = {1, 2, 3} LCAP = 1 LCONN = 1 ROUNDS = 1 RESPONDERS = 1 ATTEMPTS = 2 NSTARTS = 2 TMAX = 1 OR = 1
INVARIANT CancelledDoc
CHECK_DEADLOCK FALSE
