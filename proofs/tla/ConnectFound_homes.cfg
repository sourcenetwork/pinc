\* ConnectFound_homes.cfg: as ConnectFound.cfg with two homes and the clock held at 0, so an answer of an equal
\* sequence that changes only the home shows whether it replaced the entry.
SPECIFICATION Spec
CONSTANTS N = 2 PEERS = {1, 2, 3} SEQS = {1, 2} HOMES = {1, 2} TTL = 1 TMAX = 0 OLD = FALSE NOFREE = FALSE
INVARIANT TypeOK OneSlot Newest FreshTTL
PROPERTY LowerKeeps HeldNoEvict NoEvictWhileFree EvictAtNext NextOnlyWhenFull
CHECK_DEADLOCK FALSE
