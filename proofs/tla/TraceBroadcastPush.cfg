\* One hub, subscribers 1 and 2, a log of three messages (its bytes set to three messages of one size), a stream
\* of two frames, at most 40 messages; no session swap or end. Everything else is the code's configuration.
SPECIFICATION TraceSpec
CONSTANTS Subs = {1, 2} N = 40 LogCap = 3 StreamCap = 2 Swaps = 0 Cursor = TRUE Guard = TRUE Tell = TRUE Resume = TRUE
          Ends = 0 Owe = TRUE Notice = {"sub", "forgot", "get"}
INVARIANT Inv
