\* TableBytes is at least N * (RecBase + N - 1) here (CanOverflow FALSE): the table is never full, no record is refused
\* or charged against the bound; the full table is BroadcastReach_table.cfg and the witnesses _bytes, _evict, _full,
\* _reopen, _reopened and _silent.
\* Expiry leaves tombstones (charged RecBase - SigUnits), and an older frame of a member still in flight is taken over
\* its tombstone: NoRollback meets both.
SPECIFICATION Spec
CONSTANTS N = 3 HubCount = 1 Liars = {} MaxChanges = 1 MaxLoss = 0 MaxExpire = 2 TableBytes = 12 RecBase = 2 SigUnits = 1 MaxLeave = 0
    Closed = TRUE EvictAny = FALSE Mutual = TRUE Rebuild = TRUE Tomb = TRUE ScopedRepair = TRUE
    Batch = TRUE Told = TRUE Waits = TRUE Charge = TRUE
INVARIANTS DeliverySound EdgesGood LabelsFresh Bounds BoundedReports ClosedTold
PROPERTIES Converges NoRollback
CHECK_DEADLOCK FALSE
