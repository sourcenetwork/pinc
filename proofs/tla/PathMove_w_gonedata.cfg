\* Reach witness for PathMove_follow_gone (TLC must violate NoGoneData): a data packet with the highest number
\* arrives on a held gone path that is not the active one, so FollowsPeer's gone exception is exercised there. Same
\* bounds as PathMove_follow_gone.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "lost", "data"}
CONSTRAINT Bound
INVARIANT NoGoneData
