\* Two relays, only the first with a UDP address (no notice is ever owed to the second), the first the home; links
\* open or down; no beacons. Clocks 1 and 9, where 9 stands for u64::MAX (a call may jump to it and back), a retry
\* period of 2 and a republish period of 4 (saturating at 9). Every interleaving, no bound on the number of calls (the
\* state is finite); one suspension at a time (a second suspend while one is under way is ConnectSleep_twice).
SPECIFICATION Spec
CONSTANTS Relays = {1, 2} Udp = {1} Home = 1 Times = {1, 9} TMax = 9 Retry = 2 Repub = 4 Beacons = FALSE Twice = FALSE LinkStates <- LinksOpenDown
INVARIANTS CloseAfterNotices PriorityOrder NoticesNotIdle NoWallNoSign RefusedNotSent SleepNotRetried RecordRetry NoticeTwice CloseOnlySuspended
CHECK_DEADLOCK FALSE
