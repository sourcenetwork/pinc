\* NodeValuesNet.cfg: every invariant and step property.
\* A provider table of 2 slots and a stream table of 2 (TABLE_MAX, 4096, for both in the code; the trace runs the
\* code with all but 2 of each filled), 3 peers so that a third finds the table full, fetch ids 1 and 2 with lists of
\* 1 or 2 peers (a peer may be listed twice, as the code allows), at most 3 streams added in a behaviour (CONSTRAINT
\* Bound), next_fetch_id over two limbs of 3 values (9 ids, wrapping).
SPECIFICATION Spec
CONSTANTS CAP = 2 SCAP = 2 PEERS = {1, 2, 3} FIDS = {1, 2} LISTMAX = 2 NMAX = 3 LIMB = 3
CONSTRAINT Bound
INVARIANT Inv
PROPERTY StepProps
