\* WireCursor.cfg: the reader on every input of 0 to 3 bytes over {0, 1, 128, 255} and eight inputs of 8 to 10
\* bytes, from every position, with every call (peek_u8; read_bytes of 0..4, 8, 9, 10 and usize::MAX bytes; read_u8,
\* read_u16, read_u32, read_u64; read_varint); the writer on every buffer of 0 to 10 bytes, from every position, with
\* every call (put_slice of 0..3, 9, 10, 11 bytes; put_u8, put_u16, put_u32, put_u64 of 0x0102030405060708 and
\* u64::MAX; put_varint of 0, 127, 128, 2^63 - 1, 2^63, u64::MAX; ensure of 0, 1, 10, 11, usize::MAX).
\* About 7500 states (5880 reader cases, 1518 writer cases).
