\* RED: the start of a burst is never recorded, so the elapsed time counts from 0 and a fast burst passes for slow: BurstStarts breaks.
SPECIFICATION PacerSpec
CONSTANTS MS = 1 SEC = 100 TOP = 100000 MAXC = 24 MINC = 4 INITC = 8 BETALIM = 10 MINMSS = 2 MAXMSS = 6 MINSAMP = 2 EXITCW = 8 GFAST = 3 GMID = 5 U32MAX = 5 IRTT = 8 BURST = 3 KMAX = 6 PMTU = 4 PSRTT = 20 PCW = 8
    RULE = "nostart"
    LIMS = {FALSE}
    DELAYS = {0, 30}
    SIZES = {4}
    EAGERS = {FALSE}
CONSTRAINT Bound
INVARIANT BurstStarts
CHECK_DEADLOCK FALSE
