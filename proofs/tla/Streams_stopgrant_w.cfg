CONSTANT PERSTREAM = TRUE
\* Witness: a stop that does not discard keeps granting credit. The violating behaviour: a byte arrives, the application
\* stops the half, then reads the byte (Consume): the read position moves, the window is due to move, and the limit of
\* the stopped half rises from 2 to 3, so StoppedNoGrant fails at the consume step; with DISCARD = TRUE the half
\* has no readable byte and no grant is due.
\* Smallest constants at which the property is violated: one bidirectional peer stream, one slot, a window of two
\* bytes of one-byte chunks, one byte in flight (HOR = 1), the stop requests on, no release, no clock (DT = 0).
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT DISCARD = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 1 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
PROPERTIES StoppedNoGrant
CHECK_DEADLOCK FALSE
