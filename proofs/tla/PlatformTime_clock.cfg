\* The endpoint's clock over time: BITS = 4 (u64 scaled to 0..15), T0 = 5, every start, and a platform clock that
\* may go anywhere (BACK = TRUE: a host that breaks the contract), so NowExact holds whatever the clock does and
\* NowMono holds on every step the clock did not go back. At most 16 * 16 * 16 = 4,096 states; not measured.
SPECIFICATION ClockSpec
CONSTANTS BITS = 4 NPS = 4 T0N = 5 SB = 4 IMSN = 9 BACK = TRUE
INVARIANT NowExact NowMono
