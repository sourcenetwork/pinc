\* Reachability witness (TLC must violate NoCheck): a dial that is not answered reaches its third try and checks the
\* carriers it could ride. A dial that is not direct-first, up to 2 resends, drive at 1 s and 1.3 s.
SPECIFICATION Spec
CONSTANTS Directs <- OnlyFalse MaxRetx = 2 Arms <- NoArms PVs <- PVsIdle Routes <- OnlyFalse Ptos <- OnlyFalse Times = {1000000, 1300000}
INVARIANT NoCheck
CHECK_DEADLOCK FALSE
