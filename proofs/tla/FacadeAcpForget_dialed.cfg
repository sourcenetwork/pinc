\* The code as built on a node that dials a protocol it does not list (b) beside one it lists (a): the questions of its
\* sessions and dials are asked about with the listed ones, so no refusal stands against a session or a dial of b the
\* hook allows, and none closes one.
CONSTANTS
    Peers = {p1}
    Listed = {a}
    Dialed = {b}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
    AskHeld = TRUE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DecideFresh CacheSound KnownSound NoDialRevoked NoCrossAllow NoCrossDeny NoCut
