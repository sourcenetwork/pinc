\* GREEN: every guard on, streams that hold two frames. One hub, three members (member 1 takes hints, one at most), lists
\* of up to two ids in pieces of one id: every list fits the stream, so a stale recipient is sent both pieces in one step
\* when its stream has room for both and nothing when it has not. One restart, every run of 8 steps. ViewIsHubSet,
\* PartIsPrefix, FitPlaceZero (no recipient of a list that fits is owed it from the middle) and PlaceKept hold.
CONSTANTS Hubs = {"A"} Members = {1, 2, 3} Max = 2 StreamCap = 2 MaxSteps = 8 MaxLives = 2 Hinted = {1} HintMax = 1 Piece = 1
          GapRule = TRUE FromCheck = TRUE CapDelta = TRUE HintGuard = TRUE ChainCheck = TRUE WholeOnly = TRUE KeepPlace = TRUE FitWhole = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK ToldIsList ViewIsHubSet Synced StaleAreRecipients HintsApart PartIsPrefix FitPlaceZero
PROPERTY PlaceKept
CHECK_DEADLOCK FALSE
