\* A home carrier with a 20 s lease; the 16 s step of StepsD gives a check gap in [15 s, 20 s), so the lease is
\* learned lower and FloorOk meets a change.
SPECIFICATION Spec
CONSTANTS C <- CHome S0 <- S0Lease L0 <- LDown Steps <- StepsD Horizon = 75000000
INVARIANTS RetryOk DeadlineOk FutureOk DownBound DialBound OpenBound Progress
PROPERTIES OpenByOpened LeaseMono KivBound FloorOk
CHECK_DEADLOCK FALSE
