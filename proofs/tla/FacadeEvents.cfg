\* topics.rs event queue with CAP = 2 places (EVENTS = 1024 scaled), the u32 count saturating at TOP = 1000 (never
\* reached here: that is FacadeEvents_sat), node losses of 1 or 2 events, at most MAXSTEPS = 6 calls (pushes, node
\* losses, polls, a stop), so the queue fills, drops and drains. Estimated under 2,000 states; not measured.
SPECIFICATION Spec
CONSTANTS CAP = 2 TOP = 1000 MAXSTEPS = 6 NODELOST = {1, 2}
INVARIANT Bounded InOrder Conserved CountExact EndOnlyStopped
PROPERTY NewestDropped GapFirst
CHECK_DEADLOCK FALSE
