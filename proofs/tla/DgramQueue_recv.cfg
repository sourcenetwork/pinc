\* The receive queue of stream/datagram.rs at the bounds of DgramQueue_send.cfg (QN = 3, C = 2, CS = 2, P = 2, lengths
\* 0..3, a datagram longer than a chunk not stored and counted), counters as their docs say (DOC = TRUE), at most 2
