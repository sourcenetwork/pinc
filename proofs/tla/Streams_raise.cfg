CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
\* Streams_raise.cfg: the stream credit where an eighth of it is 2, so the eighth rule before 0d36b306 could hold a
\* raise back (every other config has MAXREM <= 2, where its step is 1 and nothing is ever held). A remote limit of 16
\* (MAXREM), 32 slots so the live cap (half the slots) is 16 as well, and a pool of 32 chunks of 1, so the handshake
\* credit is 16; one peer unidirectional stream (id 2) that ends and is read, which frees its place: the room becomes
\* 17, one more than advertised. RaiseNotHeld with the credit invariants; Streams_raise_w.cfg is the old rule.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 32 MAXREM = 16 B = 32 SWC = 1 MSWC = 1 PM = 0 MAXOFF = 1 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure ImplicitOpens NoHeldWithinCredit LedgerOnAdmit CreditInLimit RaiseNotHeld
PROPERTIES CreditMonotone LedgerOnGrant ReleaseWhenFlushed ReleaseIsFinal
CHECK_DEADLOCK FALSE
