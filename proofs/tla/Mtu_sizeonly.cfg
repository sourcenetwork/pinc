\* RED: the one rule this config drops is the packet-number match. A probe is taken as the one in flight when its size
\* alone matches, so the acknowledgement of a probe of a path that is gone is applied to the new path that took its slot
\* and sent a probe of the same size; the probe's own path, the in-flight check and the echo's bound stay. TLC must find
\* AppliedOwnToken violated.
SPECIFICATION Spec
CONSTANTS TOP = 100000 MINMTU = 1200 PROBEMTU = 1452 JFLOOR = 2904 JMTU = 8952 REPROBE = 10 KMAX = 5 ROUTE = "probe" BOUND = TRUE MATCH = "size"
CONSTRAINT Bound
INVARIANT AppliedOwnToken
