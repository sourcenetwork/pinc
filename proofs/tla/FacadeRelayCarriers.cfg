\* The carriers of a node with the relay role: every documented property, with late completions and a stop,
\* in one run (no end of a run before the next poll).
\* Bounds: a handshake table of 1, a carrier table of 1, 2 member nodes, a backlog of 2 frames, handshake 2 and
\* idle 3 time units, accept pause and check 1 unit, TCP and WebSocket streams, 3 streams accepted, clock 0..3.
SPECIFICATION Spec
CONSTANTS HS = 1 CAP = 1 BL = 2 HSD = 2 IDL = 3 PAUSE = 1 CHK = 1 NODES = {1, 2} KINDS = {"tcp", "ws"} MAXH = 3 TMAX = 3 MAXEND = 0 LATE = TRUE STOP = TRUE
INVARIANT TypeOK OwnedOps AcceptMatch ClosedOnce LiveOpen HsCount CapBound BacklogBound ByNode HandshakeBound HsFullHonest
CHECK_DEADLOCK FALSE
