\* An optimistic dial: early opens on from the start with a limit of 0 on what we may open, two slots and no peer stream
\* (the peer may open none, so both slots take our own streams), the peer's frames on our first stream, the release on
\* (so stream frames leave), and the establishment raising the limit to 0, 1 or 2 before or after any other call, then
\* MAX_STREAMS raises; at most three opens in all (the constraint OpenBound).
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = TRUE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 0 B = 4 SWC = 1 MSWC = 1 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {} LocIds = {1}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure ImplicitOpens NoHeldWithinCredit LedgerOnAdmit CreditInLimit NothingAboveMark OpenerInsideOrEarly Ordinals SendOnlyInLimit GatePrefix
PROPERTIES CreditMonotone ReleaseWhenFlushed ReleaseIsFinal OpenPastOnlyEarly GateMonotone
CONSTRAINT OpenBound
CHECK_DEADLOCK FALSE
