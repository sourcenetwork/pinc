\* RelayValid (path.rs module doc: a relayed path is valid from the moment it is tracked), holding with fix T7:
\* add_path on a held, unvalidated direct path with relayed info validates it (take_info). Before T7 it stayed
\* unvalidated and TLC found RelayValid violated. Two slots, ids 1 and 2.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d", "r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add"}
CONSTRAINT Bound
INVARIANT RelayValid
