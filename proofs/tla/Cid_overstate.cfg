\* Found: index 7 has the id of index 1 and index 9 that of index 8, at the code's 8 slots. A packet to index 8 reaches
\* the entry that also stands for index 9, so the highest index seen becomes 9 while the sender may still use index 7,
\* whose entry then makes room. TrueWindow must fail.
SPECIFICATION Spec
CONSTANTS SLOTS = 8 LOOK = 2 FIXED = TRUE SKIP = TRUE BUMP = TRUE KMAX = 9 IDXMAX = 9 SENDER = TRUE COLL <- CollOver
CONSTRAINT Bound
INVARIANT TrueWindow
