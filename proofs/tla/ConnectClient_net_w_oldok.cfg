\* Witness: failover takes a relay with no miss as answered since it last failed. A relay answers, fails, then its
\* carrier opens (the misses clear) while the home is unhealthy: it is chosen with no answer since the failure and NetOK
\* fails.
SPECIFICATION Spec
CONSTANTS Mode = "net" Times = {0, 70000} Peers = {1} Sess = {0} BUG = "oldok"
INVARIANTS NetOK
CONSTRAINT Bounded
