\* Witness: B's reset key does not survive a restart (a key from the incarnation, not the identity). The new B's
\* token does not match the one A holds, so the dead session stays up and ResetCloses must fail.
CONSTANTS
    MaxInc = 2
    MaxForge = 1
    CheckToken = TRUE
    KeySurvives = FALSE
    QuietGuard = TRUE
    SizeBound = TRUE
SPECIFICATION Spec
INVARIANTS ResetCloses
CHECK_DEADLOCK FALSE
