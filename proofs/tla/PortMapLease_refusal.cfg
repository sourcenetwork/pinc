\* RED NoRefusalDrop: a refused renewal whose epoch shows the gateway restarted goes through fail, which keeps the
\* mapping it was renewing (the code before the fix this model found).
\* The bug: the gateway restarts and loses the mapping, refuses the renewal with its new epoch, and the client goes
\* back to holding and keeps publishing the dead mapping. TLC finds HeldByGateway violated.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = TRUE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = FALSE AnnounceDrops = FALSE Floor = 2 FloorOn = TRUE KeepFloor = TRUE Spoofs = FALSE
INVARIANTS HeldByGateway
CHECK_DEADLOCK FALSE
