\* GoneNeverBack (Path::gone: nothing can use it again), holding with fix T6: relay_fallback takes only a validated
\* relayed path that is not gone, and no answer, path_returned or data packet makes a gone path usable again. Before
\* T6 a gone relayed path left by set_active was taken back by relay_fallback and TLC found GoneNeverBack violated.
\* Two slots, ids 1 and 2.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "set", "silence", "lost", "failover"}
CONSTRAINT Bound
INVARIANT GoneNeverBack
