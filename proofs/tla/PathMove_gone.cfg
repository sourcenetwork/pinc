\* Finding witness (Path::gone: nothing can use it again): a gone relayed path left by set_active is not forgotten, and
\* relay_fallback, which does not look at gone, moves the session back onto it. TLC must violate GoneNeverBack. Two
\* slots, ids 1 and 2.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "set", "silence", "lost", "failover"}
CONSTRAINT Bound
INVARIANT GoneNeverBack
