\* Witness: the rule before the hold. A Reply or a reject that arrives while the verdict on another Reply waits is
\* refused, so a forged Reply that passed its first checks ahead of the genuine one makes the dial lose the genuine one.
\* TLC must violate NotLost.
SPECIFICATION Spec
CONSTANTS NP = 4 Ids = {1, 2, 3, 4, 5} Roles = {"dial"} Old = FALSE Lookup = TRUE HDMAX = 2 ResumeValid = FALSE MOVE = FALSE RESP = "fan" HMAX = 1 HOLD = FALSE
CONSTRAINT Bound
INVARIANT NotLost
