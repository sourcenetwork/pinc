\* RED: a take that clears the segment even for the session that wrote it: a session that goes quiet after every
\* request clears its own segment each time, and OwnKept fails.
SPECIFICATION Spec
CONSTANTS
    Slots = {1, 2}
    MaxOps = 10
    Refusals = TRUE
    Bug = "clearown"
CHECK_DEADLOCK FALSE
INVARIANT OwnKept
