\* No room in either store (Mode client: the client half of ZeroStoresNothing; the server store is never written in
\* client mode, so its half holds by the mode, not by NS = 0).
SPECIFICATION Spec
CONSTANTS Unit = 1 Attempts = 2 MaxBatch = 2 Mode = "client"
          Peers = {p1, p2, p3} Alpns = {a1, a2} Tids = {t1} Psks = {s1} AeadVals = {1} CreditVals = {0}
          ExpVals = {1, 2} Nows = {1, 2} Ids = {1, 2, 3}
          NC = 0 NS = 0 MaxClock = 4
CONSTANTS TicketSet <- TicketSetDef Batches <- BatchesDef Streams <- StreamsDef
CONSTRAINT Bounded
INVARIANTS TypeOK ClientBound ZeroStoresNothing OnePerPeer StampsDistinct InsertOrder TakeOnce TakeAlpn BatchLastKept ExportOK RoundTrip MalformedStoresNothing RestoreFilters
CHECK_DEADLOCK FALSE
