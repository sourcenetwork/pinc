\* Witness: revoke keeps the peer's answers. A peer dials and the allow is cached; the peer is revoked and dials again,
\* and the endpoint lets the session through on the cached allow without asking the gate. DecideFresh must fail.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = FALSE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
SPECIFICATION Spec
INVARIANTS DecideFresh
