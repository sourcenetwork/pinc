\* Witness: revoke keeps the cached answer. p1 dials and its allow is cached; p1 is revoked, dials again, and the
\* endpoint lets the session through on the cached allow without asking the gate. DecideFresh must fail.
CONSTANTS
    Peers = {p1, p2}
    Allowed = {p1}
    ForgetOnLift = TRUE
    ForgetOnRevoke = FALSE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
SPECIFICATION Spec
INVARIANTS DecideFresh
