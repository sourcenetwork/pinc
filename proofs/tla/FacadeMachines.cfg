\* node.rs machines() with std: two endpoints of a thread share one pool of B = 1 cell (MACHINE_BOXES = 64 scaled; the
\* pool's own order of cells is Machines.cfg's), H = 2 handshakes at once per endpoint (more than the pool holds, so it
\* empties, fills and frees), at most NB = 4 boxes allocated. Estimated under 6,000 states; not measured.
SPECIFICATION Spec
CONSTANTS B = 1 H = 2 NB = 4 STD = TRUE
INVARIANT TypeOK OneHolder OwnPool IdleBound
PROPERTY AllocOnlyEmpty
