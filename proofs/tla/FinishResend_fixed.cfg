\* RED: the first wait is 999 ms whatever the probe timeout (the rule before #427). A Finish lost in a burst on a
\* path whose probe timeout is 85 ms still waits 999 ms; TLC must find FirstAtPto broken.
SPECIFICATION Spec
CONSTANTS
    FIRST = 999
    CAP = 2000
    SHIFT = 3
    THINMAX = 20000
    PTOS = {1, 85, 625, 998, 999, 1000, 1825, 42000}
    RTTS = {0, 20, 600, 15000}
    SENDS = {1, 2, 3, 4}
    FIRES = 6
    BUG = "fixed"
INVARIANTS TypeOK FirstBounded FirstAtPto WaitsCapped WaitsGrow ThinWaits WaitsPositive
CHECK_DEADLOCK FALSE
