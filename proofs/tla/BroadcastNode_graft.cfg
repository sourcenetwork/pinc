\* A hub that also publishes its own messages: the id is recorded, and a message over the ring (size 5, ring 4) is
\* refused by the log, which leaves the id known with no print held. A graft due an acknowledgement under such an id
\* is answered IdTaken and not acknowledged (GraftTaken); a graft under a stored id is acknowledged as before
\* (AckOnlyStored). Two ids, one origin, both sizes (the rival bodies are in BroadcastNode_taken and _retry).
SPECIFICATION SpecOwn
CONSTANTS AckById = FALSE Bodies = {1} KeepPrint = TRUE DueOnly = TRUE GraftStored = TRUE
CONSTANTS TTL = 2 SeenCap = 2 LogRing = 4 LogCap = 2 LogWin = 3 FholdMax = 1 HeldMax = 1 ChecksMax = 1 AcpCap = 2 AcpMax = 1 FloorWait = 2 OldSlack = 1 Mids = {1, 2} Origins = {1} Me = 1 IsHub = TRUE Revoked = {} HeldDedup = TRUE HeldFullKeepsUnseen = TRUE TopicFull = FALSE AckAfterStore = TRUE Gather = FALSE EvictGuard = TRUE LogTrack = TRUE Stamps = {1} Sizes = {2, 5} MaxNow = 4 MaxLife = 0 Paths = {"PUB"}
INVARIANTS TypeOK AckOnlyStored GraftTaken
CHECK_DEADLOCK FALSE
