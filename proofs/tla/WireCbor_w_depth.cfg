\* WireCbor_w_depth.cfg (witness): the WireCbor_skip.cfg domain; TLC must find NoDepth violated, a value skip_value
\* refuses for depth, so the depth bound of SkipAgrees is reached and not vacuous.
CONSTANTS
    MaxDepth = 2
    Parts = {"skip"}
