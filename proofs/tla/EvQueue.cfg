\* conn/event.rs EvQueue at QUEUE = 3 places over five events: Readable of stream 1 (rd, recoverable), Datagram (dg,
\* recoverable, never matched as a repeat), Opened of stream 1 (op), Closed (cl) and an undeliverable extension (xu,
\* never matched); the callers unbounded (XU above QUEUE); every sequence of pushes and pops up to 2 lost events.
\* At most 6^3 written prefixes x 3 heads x 4 lengths x 3 loss counts: under 10000 states, fewer reachable.
SPECIFICATION Spec
CONSTANTS QUEUE = 3 KINDS = {"rd", "dg", "op", "cl", "xu"} KEYS = {1} XU = 4 LMAX = 2
CONSTRAINT Bound
INVARIANT TypeOK RingIsQueue QueuedWritten NoRepeat Accounted
PROPERTY LostOnlyFull
