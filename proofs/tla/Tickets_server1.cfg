\* the server store smaller than a batch (NS 1, MaxBatch 2): a batch ends when the store is full of it, and every
\* ticket it returns is stored (BatchStored, BatchLen)
SPECIFICATION Spec
CONSTANTS Unit = 1 Attempts = 2 MaxBatch = 2 Mode = "server"
          Peers = {p1, p2, p3} Alpns = {a1, a2} Tids = {t1} Psks = {s1} AeadVals = {1} CreditVals = {0}
          ExpVals = {1, 2} Nows = {1, 2} Ids = {1, 2, 3}
          NC = 0 NS = 1 MaxClock = 3
CONSTANTS TicketSet <- TicketSetDef Batches <- BatchesDef Streams <- StreamsDef
CONSTRAINT Bounded
INVARIANTS TypeOK ServerBound UniqueIds StampsDistinct IssueOrder CollisionFails BatchStored BatchLen
CHECK_DEADLOCK FALSE
