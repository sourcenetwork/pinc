\* SPILL (#478, #635): two peer streams whose stored ranges hold 2 intervals inline and 4 once spilled into a slot of
\* the endpoint's spill arena, of which this session may hold one, with frames of one byte anywhere in their first 7:
\* three scattered frames leave three intervals, one more than the inline array holds, so the first stream to need it
\* takes the slot and the other is refused Fragmented until the slot comes back. A frame that leaves a spilled stream
\* one interval gives the slot back at once (MOVEBACK). The ledger holds in every state and on every grant, it passes
\* the pool only on a first byte, a blocked stream gets its limit, and the slots never charge the pool.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 5 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 5 MSWC = 5 PM = 0 MAXOFF = 5 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters Admitted LocatePure NoMissedGrant NoStuckGrant LedgerAlways SpillHeld NoNeedlessFragmented ArenaBound MovedBack
PROPERTIES LimitsMonotone ReadMonotone FinalFixed EighthRule PoolOnAlloc ReadFollowsContig LedgerOnGrant OverOnlyByFirstData
CONSTRAINT SpillBound
CHECK_DEADLOCK FALSE
