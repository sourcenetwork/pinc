\* SPILL (#159): one peer stream whose stored ranges hold 2 intervals inline and 4 once spilled into a pool chunk, with
\* frames of one byte anywhere in its first 7: three scattered frames leave three intervals, one more than the inline
\* array holds, and the stream must spill instead of refusing the frame.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 4
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 4
CONSTANTS CH = 2 RING = 5 RR = 2 N = 1 MAXREM = 1 B = 8 SWC = 8 MSWC = 8 PM = 0 MAXOFF = 8 RETRY = TRUE
          HOR = 7 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters Admitted LocatePure NoMissedGrant NoStuckGrant SpillHeld NoNeedlessFragmented
PROPERTIES LimitsMonotone ReadMonotone FinalFixed EighthRule PoolOnAlloc ReadFollowsContig
CHECK_DEADLOCK FALSE
