\* RED: the rule before #584. A whole flight's room is the interface's MTU with the IP and UDP headers still in it, so a
\* 1280-byte interface gets a datagram of 1280 bytes on a link that carries 1252 (IPv4) or 1232 (IPv6). TLC must find
\* IfaceOK violated.
SPECIFICATION Spec
CONSTANTS GUARD = TRUE IFACE = FALSE
INVARIANTS IfaceOK
CHECK_DEADLOCK FALSE
