\* Witness (TLC must violate NeverAtWindow): a source-backed stream has bytes waiting and no credit left (the window at
\* zero at the start, or spent), so nothing fresh leaves (SentInWindow holds in StreamSend_src.cfg on these bounds).
\* Bounds: chunks of 2 bytes, a ring of 1 slot over a pool of 1 chunk, 1 lost and 1 acknowledged range, a window of 0
\* or 2 at the start raised to 4, sources of 3 or 4 bytes (4 = MAXOFF, the offset at its maximum), whole or one byte
\* short, and one of 5 (past MAXOFF, refused); no writes (a buffered stream here is only finished empty), frames of 0 to
\* 2 bytes, one reset code, no other user of the pool.
SPECIFICATION Spec
CONSTANTS CH = 2 RING = 1 B = 1 LR = 1 AR = 1 MAXOFF = 4
          LIM0 = {0, 2} LIMS = {4} WANTS = {} ROOMS = {8} BUDGETS = {0, 1, 2} MAXB = 2
          SRCLENS = {3, 4, 5} EXTS = {0} CODES = {1}
INVARIANT NeverAtWindow
