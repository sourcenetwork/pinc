\* Witness: the bounds of FacadeWaits_write. The peer stops streams 0 and 1 with TRACKED at 1, so the entry of
\* stream 0 is evicted and its writer sees the transport's refusal instead of Stopped: NoEvict must fail.
CONSTANTS
    Op <- OpsWrite
    Env <- EnvWrite
    ACAP = 1
    EQ = 2
    MAXEV = 3
    MAXOPEN = 0
    NSTOP = 2
    TRK = 1
    DQ = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS NoEvict
