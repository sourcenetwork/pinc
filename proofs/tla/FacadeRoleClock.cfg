\* The relay clock of an Endpoint with the role: wall clocks unknown, at T0, after it and next to the largest,
\* one run.
\* Bounds: T0 = 4, the largest clock 12 (u64::MAX), mailbox age 2, the endpoint runs 0..3 units, relay deadlines
\* {0, 3, 9, 12}, kept packets that arrived at 1, 6 and 9.
SPECIFICATION Spec
CONSTANTS T0 = 4 MAX = 12 AGE = 2 DMAX = 3 DUES = {0, 3, 9, 12} KEPT = {1, 6, 9} WALLS = {0, 4, 7, 11} MAXRUN = 1
INVARIANT TypeOK WallKnown ClockIsWall DeadlineExact RestoredOnce
CHECK_DEADLOCK FALSE
