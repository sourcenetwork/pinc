\* Witness of a documented finding (TLC must violate CloseAfterNotices): a second suspend after the first one's notices
\* were answered and before the tick that closes the carriers; the carriers close at the first close time while the
\* second suspend's notice is still outstanding. One relay with a UDP address, clocks 1 and 2, no beacons.
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 2} TMax = 9 Retry = 2 Repub = 4 Beacons = FALSE Twice = TRUE LinkStates <- LinksOpenDown
INVARIANT CloseAfterNotices
CHECK_DEADLOCK FALSE
