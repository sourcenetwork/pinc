\* StreamsAnnounce.cfg: every invariant of the announce. 4 slots, a remote stream limit of 2 (MAXREM) and a pool of 5
\* chunks of 1, so the handshake credit is 2; the opener opens 2 streams in all, of either kind (two of one kind: the
\* announce of the second opens the first too), then an open is refused; an empty frame is lost at most once.
CONSTANT SPR = 2
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION Spec
CONSTANTS CH = 1 RING = 3 RR = 2 N = 4 MAXREM = 2 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 1 RETRY = TRUE
          RemIds = {} LocIds = {} FIRSTK = 1 RELEASE = TRUE PERSTREAM = TRUE
          OPENS = 2 LOSSES = 1
INVARIANT Inv
CHECK_DEADLOCK FALSE
