\* RED: a member applies changes from any hub. Both hubs number their lists from the same start, so hub A's change
\* passes the base check on the list the member took whole from hub B: the member then holds neither hub's list at the
\* version it claims, and ViewIsHubSet fails.
CONSTANTS Hubs = {"A", "B"} Members = {1, 2} Max = 1 StreamCap = 1 MaxSteps = 8 MaxLives = 2 Hinted = {1, 2} HintMax = 1 Piece = 1
          GapRule = TRUE FromCheck = FALSE CapDelta = TRUE HintGuard = TRUE ChainCheck = TRUE WholeOnly = TRUE KeepPlace = TRUE FitWhole = TRUE
SPECIFICATION Spec
INVARIANTS ViewIsHubSet
CHECK_DEADLOCK FALSE
