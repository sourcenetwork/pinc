\* The send queue of stream/datagram.rs scaled: QN = 3 entries in C = 2 chunks of CS = 2 bytes, datagrams of 0, 1, 2 and
\* 3 bytes (3 passes max_size = 3 and is refused as larger than a chunk), a pool of P = 2 chunks shared with other
\* users, its budget 0..2; counters as their docs say (DOC = TRUE), at most 2 drops counted. Estimated under 20000
\* states (queue windows of up to 3 entries x chunk head x pool use and budget x counter x last call); not measured.
SPECIFICATION Spec
CONSTANTS SIDE = "send" DOC = TRUE QN = 3 C = 2 CS = 2 P = 2 LENS = {0, 1, 2, 3} MAXSZ = 3 DMAX = 2
CONSTRAINT Bound
INVARIANT TypeOK Bounded Contiguous PoolKept NoStraddle InHeldChunk BackToBack EveryChunkUsed EmptyHoldsNoChunk Counted
PROPERTY DropsOldest
