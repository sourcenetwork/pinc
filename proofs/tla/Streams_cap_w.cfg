\* RED: the live-stream cap ignores the configured limit and takes half the slots, as before Streams::adopt
\* (the table kept its own default of 100 whatever Limits::streams said). Four slots, a limit of one: the table
\* advertises two streams at the handshake, so a peer keeping to the credit has two live against a limit of one, and
\* TLC must find CreditInLimit violated.
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 4 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0, 4} LocIds = {}
CONSTANT CapLive <- [StreamsOps] CapIgnoringLimit
INVARIANTS CreditInLimit
CHECK_DEADLOCK FALSE
