\* Witness (TLC must find OverOnlyByFirstDataWhole violated): since 8abd9451 a stream is admitted while its first charge
\* fits beside one first charge for each open stream, so the ledger (whole windows of the streams that carried data)
\* passes the pool by an admission, which the rule before it did not allow. The constants of Streams_lazy_jump.cfg with
\* N 4 -> 3, B 5 -> 4, MAXOFF 4 -> 3
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION Spec
CONSTANT Next <- NextQuick
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 3 MAXREM = 2 B = 4 SWC = 2 MSWC = 2 PM = 1 MAXOFF = 3 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0, 4} LocIds = {1}
PROPERTY OverOnlyByFirstDataWhole
CHECK_DEADLOCK FALSE
