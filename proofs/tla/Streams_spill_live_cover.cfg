\* COVER (#635), the vacuity guard of Streams_spill_live: the same constants and constraint under Spec, with the
\* invariant NoSpillWhileBlocked expected to fail. Its counterexample is a state where one stream's ranges are spilled
\* while the other waits at its limit with its grant deferred: the states Progress is about. If a change to the bounds
\* or the constraint pruned them, the invariant would hold and the proof script would fail.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 4 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 4 MSWC = 4 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
INVARIANT NoSpillWhileBlocked
CONSTRAINT SpillLiveBound
CHECK_DEADLOCK FALSE
