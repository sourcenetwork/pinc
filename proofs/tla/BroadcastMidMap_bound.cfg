\* Every id starts at one slot (a sender who chooses where its ids land), with a bound of 3: inserts past it are
\* refused and everything else holds (the bound, the abstraction, the probe chains). The refusal itself is allowed.
SPECIFICATION Spec
CONSTANTS Slots = 8 Cap = 4 Keys = {0, 8, 16, 24, 32} Vals = {0, 1} ProbeMax = 3
CONSTANT Hash <- MaskHash
INVARIANTS TypeOK Abstraction LenIsCount CapBound OneSlotPerKey ProbeChain ProbeBound
CHECK_DEADLOCK FALSE
