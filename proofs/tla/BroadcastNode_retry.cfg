\* A hub whose log holds one message: a second id evicts the first, which the dedupe set (room for all three ids)
\* then remembers with its print. An exact retry of the evicted message is acknowledged (RetryAcked) and another message
\* under the id (another body) is not (AckOnlyStored); one origin, three ids. The copy due no acknowledgement is in BroadcastNode_retryFan.
SPECIFICATION Spec
CONSTANTS AckById = FALSE Bodies = {1, 2} KeepPrint = TRUE DueOnly = TRUE
CONSTANTS TTL = 2 SeenCap = 3 LogRing = 4 LogCap = 1 LogWin = 3 FholdMax = 1 HeldMax = 1 ChecksMax = 1 AcpCap = 2 AcpMax = 1 FloorWait = 2 OldSlack = 1 Mids = {1, 2, 3} Origins = {1} Me = 1 IsHub = TRUE Revoked = {} HeldDedup = TRUE HeldFullKeepsUnseen = TRUE TopicFull = FALSE AckAfterStore = TRUE Gather = FALSE EvictGuard = TRUE LogTrack = TRUE Stamps = {1} Sizes = {2} MaxNow = 4 MaxLife = 0 Paths = {"PUB"}
INVARIANTS TypeOK AckOnlyStored RetryAcked
CHECK_DEADLOCK FALSE
