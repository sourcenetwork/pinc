\* Reachability witness on the cases of PlatformTime.cfg (same bounds): TLC must find a start s and a deadline at
\* with s + (at - T0) past the latest instant, where instant(at) saturates to the latest instant and `now` at that
\* instant is still before at, so WakeDue is checked only where it can hold and the saturated case is reached.
SPECIFICATION Spec
CONSTANTS BITS = 4 NPS = 4 T0N = 5 SB = 4 IMSN = 9 BACK = FALSE
INVARIANT WakeDueAll
CHECK_DEADLOCK FALSE
