\* WireCbor.cfg: MaxDepth = 2 (the frame stack of skip_value, MAX_DEPTH is 64 in the code; the families checked here
\* do not depend on it). Every pair of keys of 0 to 3 bytes over {0, 97, 255}; next_item on every first byte 0..255
\* followed by each of 37 tails; 80 encoder calls into buffers of 0, 1, L - 1, L and L + 1 bytes (L the encoding),
\* each round-tripped with 4 following rests; ordered_map of 0 to 2 entries into a 7-byte buffer with keys from
\* {"", "a", "b", "aa"}. About 10,500 states.
CONSTANTS
    MaxDepth = 2
    Parts = {"keys", "dec", "enc", "mk"}
SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK FALSE
