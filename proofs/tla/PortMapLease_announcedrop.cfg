\* RED: the client as first written believed an announce (AnnounceDrops = TRUE): it noted the announce's epoch and
\* dropped the mapping when that read as a restart. An announce has no nonce, so a host on the link sends one with the
\* epoch of a gateway just started: the mapping the gateway still holds leaves the record. AnnounceKeeps must fail.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = TRUE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = TRUE AnnounceDrops = TRUE Floor = 2 FloorOn = TRUE KeepFloor = TRUE Spoofs = TRUE
INVARIANTS AnnounceKeeps
CHECK_DEADLOCK FALSE
