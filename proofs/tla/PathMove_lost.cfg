\* GoneLeft (path_lost: the connection leaves a lost path for the best validated one at once, or as soon as one
\* validates), holding with fix T4: add_path chooses a path when the active one is gone. The active path is lost with
\* no other path, then the host adds a relayed path, valid at once, and the session moves onto it. Before T4 it
\* stayed on the gone path and TLC found GoneLeft violated. Two slots, ids 1 and 2.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 0
          OPS = {"add", "lost"}
CONSTRAINT Bound
INVARIANT GoneLeft
