\* Finding witness (path_lost: the connection leaves a lost path for the best validated one at once, or as soon as one
\* validates): the active path is lost with no other path, then the host adds a relayed path, valid at once, and the
\* session stays on the gone path. TLC must violate GoneLeft. Two slots, ids 1 and 2.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 0
          OPS = {"add", "lost"}
CONSTRAINT Bound
INVARIANT GoneLeft
