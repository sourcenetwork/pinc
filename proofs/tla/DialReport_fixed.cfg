\* RED: the first fix, an end 8 ticks (four first delays, the old 2 s) after the dial whatever was sent. Two lost
\* flights or a hold push a running peer's answer past it, so ReachLive must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 8
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    AnswerAtReport = FALSE
    AnswerEvent = TRUE
    AnswerAtKeys = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS ReachLive
CHECK_DEADLOCK FALSE
