\* Streams_stop_end_w.cfg: witness, TLC must violate StopOverAtEnd under the rule before 9a410adf (OnDataStopOld): the
\* end arriving on a stream asked to stop leaves its request waiting, or lost and sent again. The bounds of Streams_stop.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 3 LMAX = 2 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
CONSTANT OnData <- [StreamsOps] OnDataStopOld
INVARIANTS StopOverAtEnd
