\* Witness (TLC must violate NoLost): the driver's flush before the restore takes a datagram for a member and
\* drops it, counted (role_io.rs role_carries), and hands the role nothing.
\* Bounds: T0 = 4, the largest clock 12 (u64::MAX), mailbox age 2, the endpoint runs 0..3 units, relay deadlines
\* {0, 3, 9, 12}, kept packets that arrived at 1, 6 and 9. Wall clock 7, one run.
SPECIFICATION Spec
CONSTANTS T0 = 4 MAX = 12 AGE = 2 DMAX = 3 DUES = {0, 3, 9, 12} KEPT = {1, 6, 9} WALLS = {7} MAXRUN = 1
INVARIANT NoLost
CHECK_DEADLOCK FALSE
