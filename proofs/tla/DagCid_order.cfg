\* Witness: the text order of CIDs is not their byte order. TLC must find a violation of ByteOrderIsTextOrder
\* (<<1, 0x71, 0, 1, 25>> is below <<1, 0x71, 0, 1, 26>> by bytes, above it by text: last digit 'z' against '2').
\* Bounds: the 9 pairs of the three short CIDs (the default stack of witness_tlc suffices).
SPECIFICATION Spec
CONSTANT Parts = {"order"}
INVARIANT ByteOrderIsTextOrder
CHECK_DEADLOCK FALSE
