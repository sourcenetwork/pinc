\* facade_waits.ndjson of tests/trace_facade_waits.rs: future ids below 64, the subject's accept limit set to 2
\* (Limits::accept_streams) so refusals happen, TRACKED 128.
CONSTANTS
    FILE = "facade_waits.ndjson"
    NF = 64
    ACAP = 2
    TRK = 128
SPECIFICATION TraceSpec
CHECK_DEADLOCK FALSE
INVARIANT Inv
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
