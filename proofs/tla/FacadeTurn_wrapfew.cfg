\* With GENS = 3, not more than twice the slab, a slot is taken at the generation of a stale entry of it before the
\* queue is long enough to be compacted: the entry names a live slot again and QueueOnce must fail. In the code a slot
\* has 2^32 generations, so by the same count a stale entry is compacted away before its slot wraps while the slab
\* has fewer than 2^31 slots.
SPECIFICATION Spec
CONSTANTS F = {1, 2} OWNER = 1 ROLE = FALSE DRAIN = 1 DMAX = 0 STARTS = 4 GENS = 3 PASS = TRUE
INVARIANT QueueOnce
