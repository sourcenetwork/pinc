\* NodeValues_twice.cfg: documented finding, TLC must violate TellOnce: fetch 2's stream on a session fetch 1 hung up
\* is told by the Closed of the provider when the redial's session ends first, and told again as a reset when the
\* hung-up session ends after a third session came up (the fetch ignores it). The bounds of NodeValues_two.cfg.
SPECIFICATION Spec
CONSTANTS PEERS = {1} SIDS = {1, 2, 3} CAP = 2 SCAP = 2 FIDS = {1, 2} FETCHES = 2 SERVERS = 1 NMAX = 2
CONSTRAINT Bound
INVARIANT TellOnce
