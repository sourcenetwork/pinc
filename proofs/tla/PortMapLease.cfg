\* GREEN: the code. Every guard is on; a refusal that shows a restart drops the mapping (PortMap::note_epoch); an
\* announce only brings the renewal forward, at least Floor apart; a header-form error changes nothing during a
\* renewal; every call given the clock ends a lease past its end first; a host on the link sends announces and
\* header-form errors of its own.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = TRUE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = TRUE AnnounceDrops = FALSE Floor = 2 FloorOn = TRUE KeepFloor = TRUE Spoofs = TRUE HeaderDrops = FALSE ExpireFirst = TRUE OverEnds = TRUE
INVARIANTS TypeOK HeldByGateway StoppedUnpublished LeaseLive RenewedBeforeLapse AnnounceKeeps AnnounceSpaced HeaderKeeps
PROPERTIES LeaseEndedOnCall
CHECK_DEADLOCK FALSE
