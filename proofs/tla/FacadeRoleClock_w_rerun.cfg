\* FINDING witness (TLC must violate RestoredOnce): a second run of the same Endpoint restores the store again
\* into the same role, so a kept packet is held twice.
\* Bounds: T0 = 4, the largest clock 12 (u64::MAX), mailbox age 2, the endpoint runs 0..3 units, relay deadlines
\* {0, 3, 9, 12}, kept packets that arrived at 1, 6 and 9. Wall clock 7, two runs.
SPECIFICATION Spec
CONSTANTS T0 = 4 MAX = 12 AGE = 2 DMAX = 3 DUES = {0, 3, 9, 12} KEPT = {1, 6, 9} WALLS = {7} MAXRUN = 2
INVARIANT RestoredOnce
CHECK_DEADLOCK FALSE
