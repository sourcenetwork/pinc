\* drive.rs buffer pools without std: each endpoint its own pool with one buffer reserved at the build; POOLED = 2,
\* endpoint 1 with H1 = 3 holders (one more than the pool holds, so it fills and frees), endpoint 2 with H2 = 1, at
\* most NB = 5 buffers (2 reserved, 3 allocated). Estimated under 3,000 states; not measured.
SPECIFICATION Spec
CONSTANTS POOLED = 2 STD = FALSE H1 = 3 H2 = 1 L1 = 1 L2 = 2 NB = 5
INVARIANT PoolBound OneHolder ExactLen OwnLen NoGrow
CHECK_DEADLOCK FALSE
