\* TraceWireCbor.cfg: the runs tests/trace_wire_cbor.rs records in tla/wire_cbor.ndjson under PINC_TRACE_DIR, against the
\* codec with the frame stack of the code (MAX_DEPTH = 64).
CONSTANTS
    MaxDepth = 64
SPECIFICATION TraceSpec
INVARIANT EventsOK
CHECK_DEADLOCK FALSE
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
