\* RED: the doubling has no 2 s ceiling. After a 999 ms first wait the waits go 1,998 ms, 3,996 ms, 7,992 ms, so
\* an ordinary node waits ever longer for a peer that may only have lost one packet; TLC must find WaitsCapped broken.
SPECIFICATION Spec
CONSTANTS
    FIRST = 999
    CAP = 2000
    SHIFT = 3
    THINMAX = 20000
    PTOS = {1, 85, 625, 998, 999, 1000, 1825, 42000}
    RTTS = {0, 20, 600, 15000}
    SENDS = {1, 2, 3, 4}
    FIRES = 6
    BUG = "nocap"
INVARIANTS TypeOK FirstBounded FirstAtPto WaitsCapped WaitsGrow ThinWaits WaitsPositive
CHECK_DEADLOCK FALSE
