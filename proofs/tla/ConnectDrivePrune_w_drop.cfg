\* PruneDropsLookup with a full pending table and buffers as large (3 pending, buffers of 3: LOOKUPS both, fix K5):
\* every peer that ends in one drive drops its lookup. Before K5 (a buffer of 2 here, 8 for 16 in the code) the third
\* kept its lookup and TLC found PruneDropsLookup violated.
SPECIFICATION Spec
CONSTANTS Pend = 3 Look = 3 Buf = 3 Peers = {1, 2, 3}
INVARIANT PruneDropsLookup
CHECK_DEADLOCK FALSE
