\* Witness on the bounds of PlatformTime_clock.cfg (a platform clock that steps back): TLC must find the endpoint's
\* clock going back, so a host that breaks the monotonic contract moves `now` back with it (down to T0, never below).
SPECIFICATION ClockSpec
CONSTANTS BITS = 4 NPS = 4 T0N = 5 SB = 4 IMSN = 9 BACK = TRUE
INVARIANT NowNotBack
