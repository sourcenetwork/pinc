\* Reachability witness (TLC must violate NoFallbackOpen): with TCP broken, a dial fails and a carrier still opens,
\* on the other kind. Both stream addresses, at most 2 dials, 1 packet, a held queue of 1.
SPECIFICATION Spec
CONSTANTS Addrs <- AddrsBoth Brokens <- BrokensTcp Slow = FALSE Cap = 1 MaxPkts = 1 MaxGen = 2
CONSTRAINT Bound
INVARIANT NoFallbackOpen
CHECK_DEADLOCK FALSE
