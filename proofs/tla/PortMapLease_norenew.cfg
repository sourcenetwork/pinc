\* RED NoRenew: the client never renews half way (the renew branch of handle_timeout is gone).
\* The bug: a lease the gateway would gladly extend runs out, so the published mapping disappears at every lease
\* end and the node's record loses its address until a new round succeeds. TLC finds RenewedBeforeLapse violated.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = FALSE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = TRUE AnnounceDrops = FALSE Floor = 2 FloorOn = TRUE KeepFloor = TRUE Spoofs = FALSE HeaderDrops = FALSE ExpireFirst = TRUE
INVARIANTS RenewedBeforeLapse
CHECK_DEADLOCK FALSE
