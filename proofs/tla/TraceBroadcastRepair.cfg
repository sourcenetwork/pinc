\* The code's timers in whole seconds (GAP_EVERY 20, GAP_SPAN 25, GAP_LIVE 60, RESUB_BACK 15, HUB_AE 5 over [now-30,
\* now-1), HAVE_MAX 512, LOG_WINDOW 120, LOG_CAP 2048), messages 1..8, a run under 110 s; Times are the instants the
\* trace acts at.
SPECIFICATION TraceSpec
CONSTANTS Times <- TimesDef Mids = {1, 2, 3, 4, 5, 6, 7, 8} Window = 120 LogCap = 2048 GapEvery = 20 GapSpan = 25 GapLive = 60
          ResubBack = 15 AeEvery = 5 AeFrom = 30 AeTo = 1 HaveMax = 512 GiveUp = 90 RxHubOnly = TRUE GapMark = TRUE
          Resub = TRUE Born = 0 MaxTime = 110 Quiet = FALSE MaxFlips = 1000
INVARIANT Inv
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
