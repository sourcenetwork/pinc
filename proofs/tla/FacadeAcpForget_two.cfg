\* The code as built with two peers and one listed protocol: what is kept for one peer does not decide for the other,
\* and the table of remembered allows is cleared for both at once.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
    AskHeld = TRUE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DecideFresh CacheSound KnownSound NoDialRevoked NoCrossAllow NoCrossDeny NoCut
