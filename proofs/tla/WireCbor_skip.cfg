\* WireCbor_skip.cfg: MaxDepth = 2; skip_value (and MapReader with skip_value of each value, on every map input) on
\* every sequence of up to 5 tokens (scalars, empty, one- and two-element arrays and maps, tag 42; keys "a", "b",
\* "aa" and a non-text key; tag contents good, empty and not starting with 0x00), grown while skip_value answers
\* Truncated. About 3,000 states. Depth is counted as the documentation states it (open arrays and maps), so this
\* config reports SkipAgrees violated on a tag inside MaxDepth open containers while the code counts the tag as a
\* frame (the finding of the report).
CONSTANTS
    MaxDepth = 2
    Parts = {"skip"}
SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK FALSE
