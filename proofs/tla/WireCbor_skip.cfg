\* WireCbor_skip.cfg: MaxDepth = 2; skip_value (and MapReader with skip_value of each value, on every map input) on
\* every sequence of up to 5 tokens (scalars, empty, one- and two-element arrays and maps, tag 42; keys "a", "b",
\* "aa" and a non-text key; tag contents good, empty and not starting with 0x00), grown while skip_value answers
\* Truncated. About 3,000 states. Depth is counted as the documentation states it: open arrays, maps and tags (a tag
\* takes a frame, as the code counts it), so a tag inside MaxDepth open containers is refused for depth by both;
\* SkipAgrees holds (before the doc was corrected the model counted only containers and this config failed).
CONSTANTS
    MaxDepth = 2
    Parts = {"skip"}
SPECIFICATION Spec
INVARIANT Inv
CHECK_DEADLOCK FALSE
