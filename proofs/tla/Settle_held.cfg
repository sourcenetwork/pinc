\* Applied (Settle.tla), holding once settle hands the interval over every time (core.md, the keepalive fix): a plain session in the quiet period after a resume (QU 50 s), calls at 0, 10 and 20 s. A
\* timer at 0 plans the ping at the end of the quiet period, 50 s (interval 50 s); an acknowledgement sent at 10 s
\* with nothing in flight leaves the plan as it was, and the interval handed over is 40 s, so the PING falls at
\* 50 s. Before the fix the interval stayed 50 s, the PING fell at 60 s and TLC found Applied violated.
SPECIFICATION Spec
CONSTANTS TIMES = {0, 10, 20} ROLES = {"other"} DIALERS = {TRUE} DIRECTS = {TRUE} WATCH = FALSE QU = 50
INVARIANT Applied
CHECK_DEADLOCK FALSE
