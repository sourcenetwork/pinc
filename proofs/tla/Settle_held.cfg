\* Finding (Settle.tla): a plain session in the quiet period after a resume (QU 50 s), calls at 0, 10 and 20 s. A
\* timer at 0 plans the ping at the end of the quiet period, 50 s (interval 50 s); an acknowledgement sent at 10 s
\* with nothing in flight leaves the plan as it was, so the interval stays 50 s and the connection's PING falls at
\* 60 s, not 50 s. TLC must find Applied violated.
SPECIFICATION Spec
CONSTANTS TIMES = {0, 10, 20} ROLES = {"other"} DIALERS = {TRUE} DIRECTS = {TRUE} WATCH = FALSE QU = 50
INVARIANT Applied
CHECK_DEADLOCK FALSE
