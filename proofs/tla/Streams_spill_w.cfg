\* RED for SPILL (#478): no spill, as before the fix (SPR = RR = 2). Three one-byte frames at offsets 1, 3 and 5 leave
\* three intervals; the third is refused Fragmented though the arena has a slot free, so its packet goes unacknowledged
\* and the sender declares it lost and sends it again though it arrived (on the 150 ms path, about 1,300 such packets
\* in a 32 MiB transfer). TLC must find a violation of NoNeedlessFragmented.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 4
CONSTANTS CH = 2 RING = 5 RR = 2 N = 1 MAXREM = 1 B = 8 SWC = 8 MSWC = 8 PM = 0 MAXOFF = 8 RETRY = TRUE
          HOR = 7 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS TypeOK NoNeedlessFragmented
CHECK_DEADLOCK FALSE
