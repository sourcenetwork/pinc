\* RED (#635), liveness without the peer using its credit: Streams_spill_live under LSpecNoCredit, which drops the
\* assumption that the peer eventually sends up to its limit on each stream or ends it. The bug it plants is a peer that
\* goes quiet on one stream: the pool room reserved for that stream's unused credit stays reserved, the other stream
\* reads all it was granted and waits at its limit, and its deferred grant never fits, so Progress fails. Master fails
\* the same way; only that peer's streams starve (#690: reclaiming or capping unused credit).
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION LSpecNoCredit
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 4 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 4 MSWC = 4 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
PROPERTIES Progress
CONSTRAINT SpillLiveBound
CHECK_DEADLOCK FALSE
