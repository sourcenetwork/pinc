\* Witness: the report after the handshake keyed on "not optimistic", as before the fix. With the early report off,
\* an optimistic dial is never reported and times out against a running peer, so ReachInDial must fail.
CONSTANTS
    Hs = 1
    Deadline = 3
    MaxNow = 10
    MaxInc = 3
    EarlyReport = FALSE
    ReportByFlag = TRUE
    DenyByFlag = FALSE
SPECIFICATION Spec
INVARIANTS ReachInDial
CHECK_DEADLOCK FALSE
