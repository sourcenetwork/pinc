\* NodeSets_two.cfg: every invariant and step property with two rounds at once, over two peers that each run rounds.
\* Peers 1 and 2, no filler; 2 endpoint session ids; a layer table of 1 session (TABLE_MAX, 4096, in the code), so one
\* peer's session fills it, and lconn of 1; 2 rounds at a time (ROUNDS 8) and 2 started in all, on one peer or both,
\* sharing a session or not; 1 answered stream (RESPONDERS 16), 2 attempts (ATTEMPTS 4); times 0 and 1 (the maximum),
\* OPEN_RETRY 1.
SPECIFICATION Spec
CONSTANTS PEERS = {1, 2} FILLERS = {} SIDS = {1, 2} LCAP = 1 LCONN = 1 ROUNDS = 2 RESPONDERS = 1 ATTEMPTS = 2 NSTARTS = 2 TMAX = 1 OR = 1
INVARIANT Inv
PROPERTY StepProps
