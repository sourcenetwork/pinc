\* K6 as revised (Job::cancelled): a resume, or a second suspend, while a sleep notice is asked for keeps the request
\* and drops its answer, so each relay owed a notice gets that suspension's notice twice and no other (NoticeTwice),
\* the carriers close only after the notices (CloseAfterNotices), and a cancelled notice that fails is not a retry
\* question (SleepNotRetried). Before the revision the resume dropped the job (its answer landed on the next job), and
\* with K6 as first designed (kept, sent when suspending) suspend, resume, suspend, answer gave the relay four
\* datagrams. One relay with a UDP address, the home, link open or down; clocks 1 and 2; any number of suspends.
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 2} TMax = 9 Retry = 2 Repub = 4 Beacons = FALSE Twice = TRUE LinkStates <- LinksOpenDown
INVARIANTS NoticeTwice CloseAfterNotices SleepNotRetried
CHECK_DEADLOCK FALSE
