\* RED: freeing a slot lowers the high-water mark below it (MarkOnFreeLow), as a mark recomputed from the freed slot
\* would. Two peer streams take slots 1 and 2; the first ends and frees slot 1, the mark drops to 0 while slot 2 is
\* still live, so the scans that stop at the mark would never send its data or its control frames again. TLC must find
\* NothingAboveMark violated.
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 3 MAXREM = 2 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0, 4} LocIds = {}
CONSTANT MarkOnFree <- [StreamsOps] MarkOnFreeLow
INVARIANTS NothingAboveMark
CHECK_DEADLOCK FALSE
