\* The release before the fix of #419 (DROP = FALSE): a stale entry of the queue names a live slot again once its slot
\* was released a multiple of GENS times (2^32 in the code) while the entry waits: with GENS = 2, a ticket armed,
\* released, its slot taken and released again, and taken a third time; the queue then holds a live entry whose slot is
\* not queued, and QueueStrict must fail.
SPECIFICATION Spec
CONSTANTS LIVE = 1 AMAX = 3 W = {1} GENS = 2 OLD = FALSE DROP = FALSE
INVARIANT QueueStrict
