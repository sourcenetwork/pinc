\* alone, so one in a lower slot ties with the relay path the session is on and wins: a reply on a relay path the
\* dial does not hold, named a relay's, is left for the dialed path. TLC must violate RankRule.
SPECIFICATION Spec
CONSTANTS NP = 3 Ids = {1, 2, 3, 4} Roles = {"dial"} Old = FALSE Lookup = TRUE HDMAX = 2 RelayKeep = TRUE
          Forget = TRUE RT = 1 Rank = "none"
CONSTRAINT Bound
