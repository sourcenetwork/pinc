\* Witness: a bound shorter than a handshake takes. A running peer's optimistic connection is closed before its
\* handshake can finish, so ReachLive must fail.
CONSTANTS
    Hs = 1
    Bound = 0
    Promise = 3
    Limit = 6
    MaxNow = 12
    MaxInc = 3
SPECIFICATION Spec
INVARIANTS ReachLive
CHECK_DEADLOCK FALSE
