\* slot is empty (emptied by forget_found); NoEvictWhileFree must fail.
SPECIFICATION Spec
CONSTANTS N = 2 PEERS = {1, 2, 3} SEQS = {1, 2} HOMES = {1} TTL = 1 TMAX = 1 OLD = FALSE
PROPERTY NoEvictWhileFree
CHECK_DEADLOCK FALSE
