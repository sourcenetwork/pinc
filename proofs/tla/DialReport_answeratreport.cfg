\* RED: the code before the answered report. A dial reported before its peer answered (a cached allow, or a
\* sub-session) counts as answered from its report, so a dial to a peer that stopped looks answered and the host pushes
\* into it; AnsweredOnlyHeard must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    AnswerAtReport = TRUE
    AnswerEvent = TRUE
    AnswerAtKeys = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS AnsweredOnlyHeard
CHECK_DEADLOCK FALSE
