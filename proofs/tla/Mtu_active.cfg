\* RED: the one rule this config drops is the probe's own path. The acknowledgement and the loss of a probe are applied to
\* the path that is active when they arrive, not to the path the probe left on; the in-flight check, the packet-number
\* match and the echo's bound stay as the code has them. TLC must find OutcomeOnProbePath violated.
SPECIFICATION Spec
CONSTANTS TOP = 100000 MINMTU = 1200 PROBEMTU = 1452 JFLOOR = 2904 JMTU = 8952 REPROBE = 10 KMAX = 5 ROUTE = "active" BOUND = TRUE MATCH = "token"
CONSTRAINT Bound
PROPERTY OutcomeOnProbePath
