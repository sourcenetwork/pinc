\* A documented bound, not a reachable defect: the handle is a wrapping u64; with 2 handles in place of 2^64, two
\* rotations bring back the handle of the dropped generation 0 and TLC finds RotatedOutRefused violated.
\* Same policy and times as SoftPrekeys.cfg; a few states.
SPECIFICATION Spec
CONSTANTS LIFE = 2 USES = 2 TS = {0, 1, 2, 3} GENS = 2 GMAX = 4
CONSTRAINT Bound
INVARIANT RotatedOutRefused
CHECK_DEADLOCK FALSE
