\* DocGain as the path.rs module doc states it after T11: off a direct path only when the round trip is more than 5 ms
\* shorter, which choose_path compares. Before T11 the doc spoke of the cost, and leaving a usable IPv6 path of 6 ms
\* (cost 3 ms) for a path of 0 ms, a cost gain of 3 ms, violated DocGain. Two slots, ids 1 and 2, IPv6 or not, round trips 0 and 6 ms, up to 3 challenges.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d"} SIXES = {FALSE, TRUE} RTTS = {0, 6000000} TMAX = 3
          OPS = {"add", "probe", "send", "resp", "set"}
CONSTRAINT Bound
INVARIANT DocGain
