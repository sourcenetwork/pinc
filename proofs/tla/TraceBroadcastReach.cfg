\* One hub, members 1..4, Ed25519 records charged in 32-byte units (RecBase 10, TableBytes 39 = 1248 bytes): at most
\* three members are held and a held member's record always fits. Everything else is the code's configuration.
SPECIFICATION TraceSpec
CONSTANTS N = 4 HubCount = 1 Liars = {} MaxChanges = 200 MaxLoss = 0 MaxExpire = 4 MaxLeave = 1 TableBytes = 39
          RecBase = 10 SigUnits = 2 Mutual = TRUE Rebuild = TRUE Tomb = TRUE ScopedRepair = TRUE Closed = TRUE EvictAny = FALSE
          Batch = TRUE Told = TRUE Waits = TRUE Charge = TRUE
INVARIANT Inv
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
