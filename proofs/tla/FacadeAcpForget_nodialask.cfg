\* The rule before a dial dropped a refusal held for its peer (DialAsks = FALSE): the peer is refused on the listed
\* protocol a and the endpoint holds that refusal; this node then dials it on b, which the hook allows outbound: the
\* refusal stands against the dial. NoCrossDeny must fail.
CONSTANTS
    Peers = {p1}
    Listed = {a}
    Dialed = {b}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
    AskHeld = TRUE
    DialAsks = FALSE
SPECIFICATION Spec
INVARIANTS NoCrossDeny
