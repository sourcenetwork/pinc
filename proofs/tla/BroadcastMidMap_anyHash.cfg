\* Every placement of three ids over four slots (64 of them, chosen at Init): whatever the secret key puts where, the
\* walk bound, the probe chains, the abstraction and "nothing is refused" hold.
SPECIFICATION Spec
CONSTANTS Slots = 4 Cap = 2 Keys = {0, 1, 2} Vals = {0, 1} RefuseAt = 0
CONSTANT Hashes <- AnyHash
INVARIANTS TypeOK Abstraction LenIsCount CapBound OneSlotPerKey ProbeChain WalkBound NoneRefused
CHECK_DEADLOCK FALSE
