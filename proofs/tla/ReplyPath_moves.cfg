\* The code's rule with costs (RT 1): the choice of the active path by rank, the escape of a relay path that
\* failed and is not seen, the fall-back of a failed direct path, the endpoint naming a path's kind, the slot a
\* path takes, the way back to a path left at the bound; both roles, 3 places.
SPECIFICATION Spec
CONSTANTS NP = 3 Ids = {1, 2, 3, 4} Roles = {"dial", "resp"} Old = FALSE Lookup = TRUE HDMAX = 2 RelayKeep = TRUE
          Forget = TRUE RT = 1 Rank = "full"
CONSTRAINT Bound
INVARIANT TypeOK Unique RelayValid LeavesRule ActiveHeld ActiveValid KeyWaits ReplyTaken KeyTaken Quiet
          Counted GiveUpRule RankRule EscapeRule FallRule BackRule SlotFresh
