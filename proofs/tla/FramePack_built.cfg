\* The rule before #433 (SEAL = FALSE): build_app takes the pending repair when the build starts, so a build that then
\* ends without a packet (a buffer with no room for a packet or for the repair's frames, no destination id, a sent ring
\* with no slot, a seal that fails) loses a repair a packet can carry. TLC must find RepairPending violated.
SPECIFICATION Spec
CONSTANTS MAXLEN = 2 LIMIT = 16384 MAXPN = 8191 MAXEND = 8191 MAXRANGES = 3 MINIMAL = TRUE
          MINROOM = 24 SBUDGET = 11 REKEYMAX = 51 REFS = 8 CLEAR = TRUE CHECK = TRUE KEEP = TRUE SEAL = FALSE
          MODES = {"repair"}
INVARIANTS RepairPending
CHECK_DEADLOCK FALSE
