\* Witness on the constants of MbtEndpoint.cfg: two sessions hold message id 1, the second made by a flight whose
\* part was held for it, after a part was evicted (5 parts at time 0, then the flights of (1, 1) and (1, 2)).
\* TLC must find NoTwoHolders violated, so Handed is not about an empty set of states.
SPECIFICATION Spec
CONSTANTS K = 2 LIFE = 30000 OLIFE = 1000 OMAX = 1 TMAX = 1000000 KEYS = {<<1, 1>>, <<1, 2>>, <<2, 1>>} IDS = {1, 2} FT = {0, 1001} PT = {0} CT = {1001} ST = {} XT = {} DT = {} LENS = {1, 2} HMAX = 5 QB = 0 S = 10
CONSTRAINT Bound
INVARIANT NoTwoHolders
