\* Witness: without the revoked check of session_admitted, a peer revoked after its allow was cached and remembered
\* opens a new session on the same protocol and direction; the endpoint lets it through on the cached allow, the
\* remembered allow covers it, and it goes live, so NoLiveRevoked must fail.
CONSTANTS
    Peers = {p1, p2}
    Protos = {a}
    Slots = {1, 2}
    MaxRevoked = 1
    FailOpen = FALSE
    Backstop = FALSE
SPECIFICATION Spec
INVARIANTS NoLiveRevoked
