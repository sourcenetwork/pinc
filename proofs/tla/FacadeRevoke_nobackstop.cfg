\* Witness: without the revoked check when a session comes up, a peer revoked after its allow was cached opens a new
\* session on the cached allow and it goes live, so NoLiveRevoked must fail.
CONSTANTS
    Peers = {p1, p2}
    Slots = {1, 2}
    Allowed = {p1}
    MaxRevoked = 1
    FailOpen = FALSE
    Backstop = FALSE
SPECIFICATION Spec
INVARIANTS NoLiveRevoked
