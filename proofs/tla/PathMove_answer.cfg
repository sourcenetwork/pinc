\* Validation inside migration. Two places, ids 1 and 2, direct and relayed paths; the host adds, removes and probes
\* paths, punches the known ones and hands back re-joined ones; challenges leave or are lost, answers carrying any
\* challenge that left or a forged one arrive on any path, challenges from the peer arrive; the third probe timeout
\* in a row unvalidates the active direct path and moves the session to a relayed one. One challenge drawn at most
\* (TMAX = 1), round trips 0, no IPv6.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d", "r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "remove", "probe", "punch", "send", "resp", "chal", "returned", "failover"}
CONSTRAINT Bound
INVARIANT TypeOK ActiveLive Unique ChooseValid FallbackRule ValidCause AnswerOnPath OutstandingKept
