\* Finding (Settle.tla): a quiet dialing session on a direct path (a hub session this node dialed), calls at 0, 30
\* and 40 s, no quiet period. A send at 30 s, a datagram heard at 40 s (the plan's ping becomes 40 + 14 s of direct
\* silence, the interval 24 s), an acknowledgement sent at 40 s: the plan is the same, so the interval stays 24 s and
\* the connection's PING falls at 64 s, not 54 s. TLC must find Applied violated.
SPECIFICATION Spec
CONSTANTS TIMES = {0, 30, 40} ROLES = {"hub"} DIALERS = {TRUE} DIRECTS = {TRUE} WATCH = TRUE QU = 0
INVARIANT Applied
CHECK_DEADLOCK FALSE
