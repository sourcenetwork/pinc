\* A queue of Q = 3 packets and B = 4 bytes, packets of at most M = 3 bytes, pushes of 0..4 bytes (4 is refused),
\* at most PMAX = 4 pushes, with pops and retains of every subset between them. Estimate: under 20000 distinct states.
SPECIFICATION Spec
CONSTANTS Q = 3 B = 4 M = 3 PMAX = 4 LENS = {0, 1, 2, 3, 4}
INVARIANT Bounded Layout Refines PushOK PopOK
PROPERTY RefusedUnchanged
CHECK_DEADLOCK FALSE
