\* Alphabet {0, 1, 2} (2 is the version), origin and digests of 1 symbol, the 64-bit and 32-bit fields of 0 symbols
\* (their bytes are copied, never looked at), blen of 1 symbol, at most 1 parent, tags 1 (no public key) and 2 (a
\* 1-symbol key), signatures of 1 symbol. Every string up to 9 symbols (beyond 2 symbols, those that start with
\* the version): about 9,850 initial states, no transitions. The ASSUMEs range over about 2,800 heads and 4 bodies.
SPECIFICATION Spec
CONSTANTS Sym = {0, 1, 2} MaxLen = 9 OrgW = 1 IntW = 0 CtrW = 0 BlenW = 1 DigW = 1 MaxParents = 1 Tags = {1, 2}
          PkW <- PkSmall SigW <- SigSmall
INVARIANTS Canonical Strict PrefixOnly
CHECK_DEADLOCK FALSE
