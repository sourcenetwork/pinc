\* The fix on the relay binary with a hub: the hub endpoint's datagrams, charged by its own gate, wait in the role's
\* queue and leave without a second charge; the role's answers pass the same ledger. 2 addresses, a queue of 2,
\* behaviours of at most 5 steps.
SPECIFICATION Spec
CONSTANTS NA = 2 QMax = 2 MaxSteps = 5 Gate = TRUE Pad = TRUE EpTraffic = TRUE EpSizes = {1200} Hub = TRUE Twice = FALSE
INVARIANTS TypeOK AmpUnproved ChargedOnce
CHECK_DEADLOCK FALSE
