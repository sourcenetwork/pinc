\* NotBehindRecord as restated by K9: the sleep notices wait for at most the record request already outstanding when
\* the suspension begins, and no record job starts while they are owed (PriorityOrder). Before K9 the doc promised no
\* wait at all and TLC found that violated. One relay with a UDP address, clocks 1 and 2, no beacons.
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 2} TMax = 9 Retry = 2 Repub = 4 Beacons = FALSE Twice = FALSE LinkStates <- LinksOpenDown
INVARIANT PriorityOrder
PROPERTY NotBehindRecord
CHECK_DEADLOCK FALSE
