\* The full table: TableBytes 7 holds three records with no peer (6) or two that name each other and one with none
\* (3 + 3 + 2 = 8 does not fit), so a record is refused and the table closes while two members hold an edge and hand
\* messages to each other (DeliverySound and EdgesGood meet both). Tombstones (RecBase - SigUnits = 1) from expiry and
\* refusal; an older frame taken over a tombstone (NoRollback).
SPECIFICATION Spec
CONSTANTS N = 3 HubCount = 1 Liars = {} MaxChanges = 1 MaxLoss = 0 MaxExpire = 2 TableBytes = 7 RecBase = 2 SigUnits = 1 MaxLeave = 1
    Closed = TRUE EvictAny = FALSE Mutual = TRUE Rebuild = TRUE Tomb = TRUE ScopedRepair = TRUE
    Batch = TRUE Told = TRUE Waits = TRUE Charge = TRUE
INVARIANTS DeliverySound EdgesGood LabelsFresh Bounds BoundedReports ClosedTold
PROPERTIES NoRollback
CHECK_DEADLOCK FALSE
