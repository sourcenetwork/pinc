\* Witness: the code before #162. A freed place woke every waiting open and took them off the list, so an open
\* that asked later, polled before them, took the place while an older open still waited: NoOvertake must fail.
CONSTANTS
    Opens = {o1, o2, o3}
    Places = 1
    Fifo = FALSE
    Handoff = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS NoOvertake
