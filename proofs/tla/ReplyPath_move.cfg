\* Witness: the rule before the handshake fix. A dialing side moves to the path of a reply it did not hold, so a copy of
\* the Reply from any address takes the dial there. TLC must violate ActiveValid.
SPECIFICATION Spec
CONSTANTS NP = 4 Ids = {1, 2, 3, 4, 5} Roles = {"dial"} Old = FALSE Lookup = TRUE HDMAX = 2 ResumeValid = FALSE MOVE = TRUE RESP = "fan" HMAX = 1 HOLD = TRUE
CONSTRAINT Bound
INVARIANT ActiveValid
