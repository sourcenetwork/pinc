\* The bounds of FacadeStream_send at DOC = FALSE (the code as written, fix F2 in): after reset(code) the handle
\* answers write and finish with Stopped(code) (stream.rs, SendStream::write, finish), so ResetSeen holds. Before
\* F2 they answered Stopped(0) and Ok and TLC found ResetSeen violated.
CONSTANTS
    DOC = FALSE
    DQ = 2
    RC = 7
    SC = 3
    PR = 5
    PC = 6
    PCC = 9
    LC = 11
    Parts = {"send"}
    MAXW = 2
    MAXR = 0
    MAXD = 0
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS ResetSeen
