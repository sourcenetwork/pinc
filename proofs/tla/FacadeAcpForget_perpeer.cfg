\* Witness: the rule before #440. The endpoint gets the hook's answer for the session that raised the check and no
\* session is asked on its own: a peer allowed on one protocol dials, the allow is cached, and its session on a
\* protocol the hook refuses comes up on that allow. NoCrossAllow must fail.
CONSTANTS
    Peers = {p1}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = FALSE
    AnswerAny = FALSE
    AskHeld = TRUE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS NoCrossAllow
