\* Clock 0..130 s in steps of -1, 0, 1, 4 and 60 s (two steady beacons, at 64 and 124 s, after the burst from 0);
\* restarts at 0 (the start again), 2 (in the burst), 5 (at its end) and 64 s (at the first steady beacon); mailbox on
\* and off at any time; no saturation. Estimate: 15000 to 30000 distinct states (RS is the knob if it is more).
SPECIFICATION Spec
CONSTANTS UNIT = 1 TOP = -1 T = 130 STEPS = {-1, 0, 1, 4, 60} RS = {0, 2, 5, 64}
INVARIANT BurstBound
PROPERTY BurstGap SteadyGap QuietWithMailbox Rearm
CHECK_DEADLOCK FALSE
