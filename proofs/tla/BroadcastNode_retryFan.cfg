\* A hub whose log holds one message (a second id evicts the first, which the dedupe set remembers with its print), with
\* the paths PUB and FAN: a copy due no acknowledgement (FAN) is a plain duplicate and compares nothing (UndueDuplicate),
\* beside the retry and the rival of BroadcastNode_retry (two ids; the three-id retry run is in that config).
SPECIFICATION Spec
CONSTANTS AckById = FALSE Bodies = {1, 2} KeepPrint = TRUE DueOnly = TRUE GraftStored = TRUE
CONSTANTS TTL = 2 SeenCap = 2 LogRing = 4 LogCap = 1 LogWin = 3 FholdMax = 1 HeldMax = 1 ChecksMax = 1 AcpCap = 2 AcpMax = 1 FloorWait = 2 OldSlack = 1 Mids = {1, 2} Origins = {1, 2} Me = 1 IsHub = TRUE Revoked = {} HeldDedup = TRUE HeldFullKeepsUnseen = TRUE TopicFull = FALSE AckAfterStore = TRUE Gather = FALSE EvictGuard = TRUE LogTrack = TRUE Stamps = {1} Sizes = {2} MaxNow = 4 MaxLife = 0 Paths = {"PUB", "FAN"}
INVARIANTS TypeOK AckOnlyStored RetryAcked UndueDuplicate
CHECK_DEADLOCK FALSE
