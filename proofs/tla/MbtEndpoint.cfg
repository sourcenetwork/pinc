\* The handover of held parts (MbtEndpoint.tla): 2 slots, message ids 1 and 2, the (id, source) pairs (1, 1), (1, 2)
\* and (2, 1); parts held at time 0 of length 1 (held) and 2 (over the largest held, refused), at most 5 held in all
\* so the fifth evicts the oldest of the 4 entries; first flights at 0 and at 1001 ms, a timer at 1001 ms (a part held
\* at 0 is then past its 1 s life). No event calls (DT empty), no stale-id or stray calls: MbtEndpoint_life.cfg and
\* MbtEndpoint_stall.cfg have them. A few thousand states.
SPECIFICATION Spec
CONSTANTS K = 2 LIFE = 30000 OLIFE = 1000 OMAX = 1 TMAX = 1000000 KEYS = {<<1, 1>>, <<1, 2>>, <<2, 1>>} IDS = {1, 2} FT = {0, 1001} PT = {0} CT = {1001} ST = {} XT = {} DT = {} LENS = {1, 2} HMAX = 5 QB = 0 S = 10
CONSTRAINT Bound
INVARIANT Complete
