CONSTANT PERSTREAM = TRUE
\* Witness: a stop that does not discard (DISCARD = FALSE, the earlier behaviour) leaves the half holding what it had.
\* The violating behaviour: a byte arrives and is held, then the application stops the half (StopReq) and the half
\* still holds the chunk, so StoppedHoldsNothing fails at the stop step; with DISCARD = TRUE the stop releases it.
\* Smallest constants at which the property is violated: one bidirectional peer stream, one slot, a window of two
\* bytes of one-byte chunks, one byte in flight (HOR = 1), the stop requests on, no release, no clock (DT = 0).
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT DISCARD = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 1 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS StoppedHoldsNothing
CHECK_DEADLOCK FALSE
