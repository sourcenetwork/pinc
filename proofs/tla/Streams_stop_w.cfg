CONSTANT PERSTREAM = TRUE
\* Streams_stop_w.cfg: witness, TLC must violate GiveUpHoleDiscards under the rule before ff7ad474 (StopReqOld,
\* OnDataOld): a peer stream whose end arrives past a hole and that the application gives up is left as it is, so it
\* is never read to its end and keeps its slot and its place in the peer's limit until the connection closes. The
\* bounds of Streams_release.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CONSTANT StopReq <- [StreamsOps] StopReqOld
CONSTANT OnData <- [StreamsOps] OnDataOld
INVARIANTS GiveUpHoleDiscards
CHECK_DEADLOCK FALSE
