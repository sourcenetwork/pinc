\* The bounds of DgramQueue_send.cfg with DMAX 3 and the counting of fix T2 (DOC = TRUE): a datagram refused by an
\* empty pool is counted by send_dropped, as its doc says (Counted). Before T2 (DOC = FALSE) TLC found it violated.
SPECIFICATION Spec
CONSTANTS SIDE = "send" DOC = TRUE QN = 3 C = 2 CS = 2 P = 2 LENS = {0, 1, 2, 3} MAXSZ = 3 DMAX = 3
CONSTRAINT Bound
INVARIANT Counted
