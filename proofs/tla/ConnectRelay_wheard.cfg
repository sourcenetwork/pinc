SPECIFICATION Spec
CONSTANTS Times = {0, 16, 31} MaxNs = 2 Depth = 6 WithSleep = TRUE WithReady = FALSE OldHeld = TRUE
INVARIANTS HeardDelivers
CONSTRAINT SmallMb
