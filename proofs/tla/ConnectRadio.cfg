\* Times 0..12 ns, frames of 0..3 bytes on a medium of 2 bytes, 0, 1 or 3 ns per byte, duty 0, 1, 250, 1000 and 1500
\* per thousand; no saturation (TOP = -1, MAXU above every product). Estimate: under 20000 distinct states.
SPECIFICATION Spec
CONSTANTS TOP <- NoTop MAXU = 1000000 T = 12 LENS = {0, 1, 2, 3} MTUS = {2} NSPBS = {0, 1, 3} DUTIES = {0, 1, 250, 1000, 1500}
PROPERTY FitAndShare RefusedUnchanged
CHECK_DEADLOCK FALSE
