\* Witness: a graft is acknowledged whatever the hub holds (GraftStored = FALSE, the rule before the fix). The hub
\* publishes a message over the ring (size 5, ring 4), the log refuses it and the id stays known with no print held; a
\* graft under that id is acknowledged: GraftTaken fails.
SPECIFICATION SpecOwn
CONSTANTS AckById = FALSE Bodies = {1} KeepPrint = TRUE DueOnly = TRUE GraftStored = FALSE
CONSTANTS TTL = 2 SeenCap = 1 LogRing = 4 LogCap = 1 LogWin = 3 FholdMax = 1 HeldMax = 1 ChecksMax = 1 AcpCap = 2 AcpMax = 1 FloorWait = 2 OldSlack = 1 Mids = {1} Origins = {1} Me = 1 IsHub = TRUE Revoked = {} HeldDedup = TRUE HeldFullKeepsUnseen = TRUE TopicFull = FALSE AckAfterStore = TRUE Gather = FALSE EvictGuard = TRUE LogTrack = TRUE Stamps = {1} Sizes = {5} MaxNow = 2 MaxLife = 0 Paths = {"PUB"}
INVARIANTS GraftTaken
CHECK_DEADLOCK FALSE
