\* GREEN (safety only): lists of one to three pieces against a stream that holds two, changing forever. Lists of one and two
\* pieces fit and are never left in part (NotLeftPart); the list of three does not fit and goes piece by piece, its place
\* back to 0 by a change. This config does NOT show that a recipient of the large list holds it under endless change: it
\* may not, by design (vinc#643 keeps the list in flight). It claims no liveness.
CONSTANTS Hold = 2 Sizes = {1, 2, 3} Rule = "new" Changes = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NotLeftPart
CHECK_DEADLOCK FALSE
