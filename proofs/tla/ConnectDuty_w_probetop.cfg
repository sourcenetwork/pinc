SPECIFICATION Spec
CONSTANTS UNIT = 1 TOP = 9 T = 9 STEPS <- DutySteps RS = {5} PROBE = TRUE
INVARIANT ProbeNotAtTop
CHECK_DEADLOCK FALSE
