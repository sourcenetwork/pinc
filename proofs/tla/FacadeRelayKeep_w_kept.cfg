\* FINDING witness (TLC must violate KeptBounded): a removal that fails waits behind the marks not tried yet
\* (keep.rs next_job, write_failed), so a put of another node lands first and the store holds more records than the
\* record table; a removal given up after MAX_TRIES leaves its record until the next start. Kept.records is documented
\* as bounded by RECORDS (store.rs Kept), which a store that fails removals and takes puts passes.
\* Bounds: 2 record nodes and a record table of 1, record lifetime 2 units, relay clock 0..3, seq 1, 2 publishes, no
\* packets, no restart; the code's MAX_TRIES 8 and FAILED 64.
SPECIFICATION Spec
CONSTANTS NR = 2 NM = 1 RCAP = 1 MCAP = 1 MBP = 1 MAILQ = 4 TTL = 2 AGE = 2 TMAX = 3 CLOCKS = {0} SEQS = 1 PUBS = 2 PMAX = 0 MAXR = 0 REFRESH = FALSE TORN = {} FAIL = TRUE RERUN = FALSE MAXT = 8 FQ = 64
INVARIANT KeptBounded
CHECK_DEADLOCK FALSE
