\* NodeValues_super.cfg: witness, TLC must violate NeverSuper: a new incoming session supersedes an older one that held a stream, whose stream goes.
\* Peers 1 and 2, 3 session ids, a provider table and a stream table of 2 (TABLE_MAX, 4096, in the code), one fetch
\* id with one provider (FETCHES 8: 1 here), 1 server slot (SERVERS 32), at most 3 streams added in a behaviour
\* (CONSTRAINT Bound).
SPECIFICATION Spec
CONSTANTS PEERS = {1, 2} SIDS = {1, 2, 3} CAP = 2 SCAP = 2 FIDS = {1} FETCHES = 1 SERVERS = 1 NMAX = 3
CONSTRAINT Bound
INVARIANT NeverSuper
