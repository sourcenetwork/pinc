\* The premise of queue_fits at QUEUE = 3: two unrecoverable events that repeats collapse (Opened of stream 1, Closed)
\* and at most XU = 1 undeliverable extension unread, so 2 + 1 = QUEUE; recoverable ones (Readable of stream 1,
\* Datagram) at will. Nothing is lost (LMAX = 1 keeps a first loss inside the checked states). Same size as EvQueue.cfg.
SPECIFICATION Spec
CONSTANTS QUEUE = 3 KINDS = {"rd", "dg", "op", "cl", "xu"} KEYS = {1} XU = 1 LMAX = 1
CONSTRAINT Bound
INVARIANT NoLost RingIsQueue Accounted
