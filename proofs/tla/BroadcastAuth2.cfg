\* Honest nodes 1 (Ed25519) and 2, Byz node 3 (both key-carrying); algorithms {1, 2}; every field of 2 values
\* (origin of 3, flags of 3); at most 2 signatures. About 1,000 states.
SPECIFICATION Spec
CONSTANTS Honest = {1, 2} Byz = {3} Algs = {1, 2} KeyCheck = TRUE MaxSig = 2 AlgOf <- AlgSmall
          Cover = {"alg", "origin", "inc", "seq", "topic", "wall", "ctr", "flags", "parents", "body"}
INVARIANTS DeliverExact
CHECK_DEADLOCK FALSE
