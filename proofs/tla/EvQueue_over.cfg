\* Witness of a finding: the queue sized as EvQueue_fits.cfg counts one undeliverable extension (QUEUE = 2 + 1), but the
\* callers raise two while unread (XU = 2), as conn/send.rs hold_queued_extension does beyond the extension slots
\* FIXED_EVENTS counts. TLC must find a lost unrecoverable event (NoLost violated).
SPECIFICATION Spec
CONSTANTS QUEUE = 3 KINDS = {"rd", "dg", "op", "cl", "xu"} KEYS = {1} XU = 2 LMAX = 1
CONSTRAINT Bound
INVARIANT NoLost
