\* A session may end at any time and the log evicts freely while the subscriber is away or its GET is on its way
\* (vinc#505): the hub tells the subscriber what it can no longer give it, by the three rules of Notice.
SPECIFICATION Spec
CONSTANTS Subs = {s1, s2} N = 4 LogCap = 2 StreamCap = 1 Swaps = 0 Cursor = TRUE Guard = TRUE Tell = TRUE Resume = TRUE Ends = 1 Owe = TRUE Notice = {"sub", "forgot", "get"}
INVARIANTS AckedReachesLive MissedOnlyHeld OwedInLog Bounds WakeOrPending
PROPERTIES AllAcked LiveAgain
CHECK_DEADLOCK FALSE
