SPECIFICATION TraceSpec
\* the invariants of QuietProbe.tla in every state of the replay
INVARIANT Inv
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
\* a replay branch that took a step in another order than the code (the end of a pass, the environment) stops;
\* ReplayEnded is what says some branch read the whole trace
CHECK_DEADLOCK FALSE
