\* recovery/math.rs scaled: a word of W = 28 bits for the u128, roots of RB = 10 bits for the 43 of the code, a narrow
\* word of SW = 14 bits for the u64. One state per input: n below 2000, k^3 - 1, k^3, k^3 + 1 for k below 1024 (kept when
\* below 2^28, so k up to 645), 2^j - 1, 2^j, 2^j + 1 for j below 28, and 2^28 - 1: about 4000 states. No cube in TLC
\* passes 1024^3 = 2^30.
SPECIFICATION Spec
CONSTANTS W = 28 RB = 10 SW = 14
INVARIANT IcbrtOK SatOK
CHECK_DEADLOCK FALSE
