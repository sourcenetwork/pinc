\* Plain run: no prekey is due at the time it was made, the clock's maximum (6 here, u64::MAX in the code) included:
\* a lifetime that ends past it gives no due time (keys.rs rotate_at, deadline_after). Before that fix rotate_at
\* saturated there and a prekey made at the maximum was due at once (this config was its witness). A few states.
SPECIFICATION Spec
CONSTANTS LIFE = 2 USES = 2 TOP = 6 TS = {0, 1, 3, 6} UTOP = 3 GMAX = 4
CONSTRAINT Bound
INVARIANT NotDueAtBirth
CHECK_DEADLOCK FALSE
