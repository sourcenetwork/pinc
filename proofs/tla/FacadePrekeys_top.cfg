\* A documented bound, not a reachable defect: rotate_at = now.saturating_add(PREKEY_LIFE), so a prekey made with the
\* clock at its maximum (6 here, u64::MAX in the code) is due at once and every service call rotates again. TLC finds
\* NotDueAtBirth violated. The engine's clock starts at 10 s and saturates only after about 584 years. A few states.
SPECIFICATION Spec
CONSTANTS LIFE = 2 USES = 2 TOP = 6 TS = {0, 1, 3, 6} UTOP = 3 GMAX = 4
CONSTRAINT Bound
INVARIANT NotDueAtBirth
CHECK_DEADLOCK FALSE
