\* ReAsk with a full pending table and buffers as large (3 pending, buffers of 3: LOOKUPS both, fix K5): after every
\* lookup was cleared, every pending peer asks again. Before K5 (a buffer of 2 here, 8 for 16 in the code) the third
\* pending peer did not ask again while the first two waited, and TLC found ReAsk violated.
SPECIFICATION Spec
CONSTANTS Pend = 3 Look = 3 Buf = 3 Peers = {1, 2, 3}
INVARIANT ReAsk
CHECK_DEADLOCK FALSE
