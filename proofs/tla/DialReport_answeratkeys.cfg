\* RED: a sub-session opened over a session whose handshake still runs counts as answered when it gets its keys (the
\* handshake ended), before the peer has seen its open: a peer that does not serve the protocol, or stopped right after
\* the handshake, looks answered; AnsweredOnlyHeard must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    AnswerAtReport = FALSE
    AnswerEvent = TRUE
    AnswerAtKeys = TRUE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS AnsweredOnlyHeard
CHECK_DEADLOCK FALSE
