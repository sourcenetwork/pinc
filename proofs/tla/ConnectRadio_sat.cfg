\* The bounds of ConnectRadio.cfg with the clock's maximum (u64::MAX) at 12 ns, the end of the clock. FitAndShare
\* holds: a frame whose off time ends past the maximum leaves no next admission (fix C1). Before C1 the next admission
\* was free at the same time and TLC found FitAndShare violated.
SPECIFICATION Spec
CONSTANTS TOP = 12 MAXU = 1000000 T = 12 LENS = {0, 1, 2, 3} MTUS = {2} NSPBS = {0, 1, 3} DUTIES = {0, 1, 250, 1000, 1500}
PROPERTY FitAndShare
CHECK_DEADLOCK FALSE
