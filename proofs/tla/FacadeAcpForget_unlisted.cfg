\* The answer worked out over the listed protocols only (AskHeld = FALSE), as the first part of #440 did: this node
\* dials a protocol it does not list (b), which the hook allows outbound only. The refusal of a session of the listed
\* protocol, or the later check of the session of b (which asks b inbound, as no dial waits any more), finds nothing
\* allowed among the listed questions: the endpoint is told deny and closes the session or the dial the hook allows.
\* NoCut must fail.
CONSTANTS
    Peers = {p1}
    Listed = {a}
    Dialed = {b}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
    AskHeld = FALSE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS NoCut
