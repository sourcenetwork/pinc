\* Found: this node dials on a protocol it does not list (b), which the hook allows outbound; every listed protocol and
\* b inbound are refused. A session of the listed protocol a is refused and the "allowed something" answer asks only
\* about the listed protocols, so the endpoint is told deny and refuses this node's dials on b for 30 s; and a session
\* on b that came up is closed at its recheck, which asks b inbound as no dial waits any more. NoCrossDeny must fail.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a}
    Dialed = {b}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
SPECIFICATION Spec
INVARIANTS NoCrossDeny
