\* A queue of 3 events that stops taking endpoint events at 2 and resumes at 1 (EVENT_CAP 8192, EVENT_HIGH 7168,
\* EVENT_LOW 4096 in the code: the same order CAP > HIGH > LOW, small enough to fill), a lost count that saturates
\* at 1 (u32::MAX in the code) so a second drop before a read reaches it, and 5 arrivals: enough to fill the queue
\* and overflow it twice. Estimated a few thousand states.
\* Witness: the count of lost events saturates. TLC must report NoLostSat violated.
CONSTANTS
    CAP = 3
    HIGH = 2
    LOW = 1
    LMAX = 1
    PUSHES = 5
SPECIFICATION Spec
INVARIANT NoLostSat
CHECK_DEADLOCK FALSE
