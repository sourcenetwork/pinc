\* The rule before #398 (BUMP = FALSE): index 9 has the id of index 1 and is passed over, the entry keeps index 1, and
\* once index 1 is LOOK below the highest index seen it makes room while index 9 is one the sender takes next.
\* Lookahead must fail, at the code's 8 slots.
SPECIFICATION Spec
CONSTANTS SLOTS = 8 LOOK = 2 FIXED = TRUE SKIP = TRUE BUMP = FALSE KMAX = 9 IDXMAX = 9 SENDER = FALSE COLL <- CollEvict
CONSTRAINT Bound
INVARIANT Lookahead
