\* Witness: the count saturates. TOP = 1 stands for u32::MAX; TLC must find two drops owed with a count of 1, so the
\* count is exact only below the saturation (in the code: fewer than 2^32 - 1 drops between two polls, a stated bound).
SPECIFICATION Spec
CONSTANTS CAP = 2 TOP = 1 MAXSTEPS = 6 NODELOST = {1, 2}
INVARIANT CountExact
CHECK_DEADLOCK FALSE
