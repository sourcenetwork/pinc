\* Witness: each session is asked on its own, but the endpoint is told the asking session's own refusal. A peer allowed
\* on one protocol dials first on one the hook refuses; the deny is cached, so its sessions on the allowed protocol are
\* refused and a live one would be closed. NoCrossDeny must fail.
CONSTANTS
    Peers = {p1}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = FALSE
    AskHeld = TRUE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS NoCrossDeny
