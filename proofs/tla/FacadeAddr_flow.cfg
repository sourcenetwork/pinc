\* The documented round trip (addr.rs: "printing then parsing returns the same value") with an IPv6 direct address of
\* flowinfo 1, which `with_direct` takes. It FAILS on today's code: the text of a SocketAddrV6 has no flowinfo, so the
\* value comes back with 0 (finding F2). About 1,220 cases; not measured.
SPECIFICATION Spec
CONSTANTS FLOWS = {0, 1} RAW = FALSE
INVARIANT RoundTrip
CHECK_DEADLOCK FALSE
