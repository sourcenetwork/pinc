\* Witness: the rule before the anti-amplification fix. A resumed responder validated its active path at the Hello,
\* which anyone who saw it can send a copy of from any source, so the endpoint took that source for one that proved
\* it receives what is sent to it. TLC must violate ResumeProvesNothing.
SPECIFICATION Spec
CONSTANTS NP = 4 Ids = {1, 2, 3, 4, 5} Roles = {"resp"} Old = FALSE Lookup = TRUE HDMAX = 2 ResumeValid = TRUE
CONSTRAINT Bound
INVARIANT ResumeProvesNothing
