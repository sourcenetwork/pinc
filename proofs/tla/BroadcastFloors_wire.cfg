\* The FLOOR frame alone (no message is taken): every frame of at most 8 tokens over {0, 1, 2, 7}, which holds every
\* body with at most one origin and that body with one token more. OnFloorStrict and EncodeParses hold.
SPECIFICATION Spec
CONSTANTS Hubs = {1, 2} Members = {5} Origins = {7} Stamps = {} TableMax = 1 OriginMax = 1 MaxT = 0 Future = FALSE TopFix = TRUE Drift = 0 Restarts = 0 Parser = "strict" WireTok = {0, 1, 2, 7} WireLen = 8
INVARIANTS OnFloorStrict EncodeParses
CHECK_DEADLOCK FALSE
