\* RED: the one rule this config drops is the echo's bound. An echo is taken as the path's datagram size without the bound
\* (the smaller of the jumbo size and what the interface carries); the in-flight check, the probe's own path and the
\* packet-number match all stay as the code has them (master had none of the four). TLC must find EchoBounded violated.
SPECIFICATION Spec
CONSTANTS TOP = 100000 MINMTU = 1200 PROBEMTU = 1452 JFLOOR = 2904 JMTU = 8952 REPROBE = 10 KMAX = 5 ROUTE = "probe" BOUND = FALSE MATCH = "token"
CONSTRAINT Bound
PROPERTY EchoBounded
