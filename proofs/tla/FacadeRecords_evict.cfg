\* Finding a (records.rs 81-90): at a full table a node is forgotten, and its next lookup believes a replay older than
\* what was believed before. TLC must violate NoReplayBelieved; with KNOWN_MAX 4096 this needs 4097 nodes looked up.
CONSTANTS
    Nodes = {n1, n2}
    MaxSeq = 2
    SeqCheck = TRUE
    KMAX = 1
    RELAYS = FALSE
SPECIFICATION Spec
INVARIANTS NoReplayBelieved
