\* Two timers (the bound treats every timer alike and the held time is shared, so two show one stuck while the other
\* moves). Times 0, 1, u64::MAX - 1 and u64::MAX: forward, standing still, backward, and the top of the clock where
\* the held time saturates. A tick of 1 ns (the code's TIMER_TICK is 1 ms; only its addition matters). Counters
\* saturate at 2 instead of u64::MAX so the saturation is reached. About 3,000 states, 100 successors each.
CONSTANTS
    N = 2
    CMAX = 2
CONSTANT TIMES <- TimesDef
CONSTANT TICK <- TickDef
SPECIFICATION Spec
INVARIANT HeldBound Unmoved AtMostTick Counted TotalOK RecordedOnce
CHECK_DEADLOCK FALSE
