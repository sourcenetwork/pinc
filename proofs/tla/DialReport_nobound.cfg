\* RED: no early end, the code before #76. An optimistic dial to a stopped peer lasts until Limit (32 ticks), past
\* the promised 30, so NoLingering must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = FALSE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS NoLingering
CHECK_DEADLOCK FALSE
