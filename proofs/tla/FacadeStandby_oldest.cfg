\* The code before the fix of #311 (OLD): release left the slot queued and its entry in the queue, so a ticket that
\* reused a queued slot kept that place and the baton woke it before a ticket that waited longer. The documented order
\* (standby.rs: the baton "wakes the oldest waiting ticket") must fail under it. With GENS = 4 and 4 tickets no slot
\* wraps, so the failure is the old rule's alone.
SPECIFICATION Spec
CONSTANTS LIVE = 3 AMAX = 4 W = {1, 2} GENS = 4 OLD = TRUE DROP = TRUE
INVARIANT BatonOldest
