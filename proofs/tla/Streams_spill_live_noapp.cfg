\* RED (#635), liveness without the application's reads: Streams_spill_live under LSpecNoApp, which drops the assumption
\* that the application reads every stream that has bytes for it. The bug it plants is an application that never reads
\* one stream: that stream keeps its chunks, the other stream reads all it was granted and waits at its limit, and the
\* grant never comes, so Progress fails. Master fails the same way; the transport does not promise progress to a
\* stream whose sibling is never read.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION LSpecNoApp
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 4 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 4 MSWC = 4 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
PROPERTIES Progress
CONSTRAINT SpillLiveBound
CHECK_DEADLOCK FALSE
