\* Witness: the rule before the correction that followed #399. new_path_slot did not look the id up, so a reply on a
\* path the dial does not hold with a 1-RTT packet behind it in the same datagram added the path twice (the model found
\* it; the code now looks the id up). TLC must violate Unique.
SPECIFICATION Spec
CONSTANTS NP = 4 Ids = {1, 2, 3, 4, 5} Roles = {"dial"} Old = FALSE Lookup = FALSE HDMAX = 2 RelayKeep = TRUE
          Forget = TRUE RT = 0 Rank = "full"
CONSTRAINT Bound
INVARIANT Unique
