\* Reachability witness for RecoveryMath.cfg (same bounds: W = 28, RB = 10, SW = 14): TLC must find an input for which
\* a candidate's cube overflows the word (768^3 > 2^28 - 1 for every n of 2^27 and above), so IcbrtOK covers the branch
\* where `checked_pow` refuses.
SPECIFICATION Spec
CONSTANTS W = 28 RB = 10 SW = 14
INVARIANT NoOverflow
CHECK_DEADLOCK FALSE
