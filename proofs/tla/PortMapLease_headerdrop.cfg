\* RED: the client before fix P1 took a header-form MAP error as the answer to its renewal (HeaderDrops = TRUE): it
\* noted the error's epoch and dropped the mapping when that read as a restart. Such an error has no nonce, so a host
\* on the link sends one with the epoch of a gateway just started: the mapping the gateway still holds leaves the
\* record. HeaderKeeps must fail.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = TRUE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = TRUE AnnounceDrops = FALSE Floor = 2 FloorOn = TRUE KeepFloor = TRUE Spoofs = TRUE HeaderDrops = TRUE ExpireFirst = TRUE
INVARIANTS HeaderKeeps
CHECK_DEADLOCK FALSE
