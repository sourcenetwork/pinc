\* Everything as the code has it: a table of one node for two (forgetting), relays that answer a missed lookup. What
\* still holds: every believed record and every answer is genuine, a lookup answers what is believed (the relays'
\* record too, kept since fix F8), the table stays bounded, and a held record never goes back (HeldNoRollback).
\* Estimated under 20,000 states; not measured.
CONSTANTS
    Nodes = {n1, n2}
    MaxSeq = 3
    SeqCheck = TRUE
    KMAX = 1
    RELAYS = TRUE
SPECIFICATION Spec
INVARIANTS KnownGenuine LookupNewest AnswerGenuine Bounded
PROPERTIES HeldNoRollback
