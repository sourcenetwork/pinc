\* GREEN (liveness): the constants of the witness BroadcastSubsRoom_tip under the new rule. A list of two pieces fits a
\* stream that holds two and changes again and again; the recipient still comes to hold a whole list, so the witness fails
\* for its rule and not for its sizes. The invariants at these sizes are checked by BroadcastSubsRoom_large.
CONSTANTS Hold = 2 Sizes = {2} Rule = "new" Changes = TRUE
SPECIFICATION Spec
PROPERTY Live
CHECK_DEADLOCK FALSE
