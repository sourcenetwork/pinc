\* NoWallNoSign: with fix K8 a tick called without a wall clock forgets the earlier one, so it starts no signature.
\* Before K8 it signed with the wall clock an earlier call gave and TLC found NoWallNoSign violated. One relay with a UDP address, clocks 1 and 2, no beacons.
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 2} TMax = 9 Retry = 2 Repub = 4 Beacons = FALSE Twice = FALSE LinkStates <- LinksOpenDown
INVARIANT NoWallNoSign
CHECK_DEADLOCK FALSE
