CONSTANT PERSTREAM = TRUE
\* The rule before #432: the control frames of a stream we opened past the peer's limit are not held (CtlUngated), so
\* a stream opened early and reset at once sends its reset while the peer's limit does not cover it. TLC must find
\* PeerNeverRefuses violated.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = TRUE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 0 B = 4 SWC = 1 MSWC = 1 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {} LocIds = {1}
CONSTANT CtlGate <- [StreamsOps] CtlUngated
INVARIANTS PeerNeverRefuses
CONSTRAINT OpenBound
CHECK_DEADLOCK FALSE
