\* The keep of a node with the relay role with a mailbox mark cap below the members: every documented property but
\* MailSynced, and MailCounted (fix R10: a mark past the cap leaves the store behind only with a store error counted).
\* Bounds: 1 record node (no publish), 2 members of 2 packets each, 2 packets held, packet age 2 units, relay clock
\* 0..3 (a restart at 0, 1 or 3), 1 restart, a mark cap of 1.
SPECIFICATION Spec
CONSTANTS NR = 1 NM = 2 RCAP = 1 MCAP = 2 MBP = 2 MAILQ = 1 TTL = 2 AGE = 2 TMAX = 3 CLOCKS = {0, 1, 3} SEQS = 1 PUBS = 0 PMAX = 2 MAXR = 1 REFRESH = FALSE TORN = {"noverify", "prefix"} FAIL = FALSE RERUN = FALSE
INVARIANT TypeOK RestoredLive MailOrdered RecSynced LifeSynced MailCounted MarksBounded KeptBounded WritingHasJob
CHECK_DEADLOCK FALSE
