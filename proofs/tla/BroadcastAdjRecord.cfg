\* Alphabet {0, 1, 2}, origin and peers of 1 symbol, incarnation and sequence number of 0 symbols (copied, never
\* looked at), the count of 2 (as the code), at most 2 peers (a count with a high byte above it), tags 1 (no key)
\* and 2 (a 1-symbol key), signatures of 1 symbol. Every string up to 7 symbols: 3,280 initial states, no
\* transitions. The ASSUME ranges over every well-formed record of the alphabet (about 60).
SPECIFICATION Spec
CONSTANTS Sym = {0, 1, 2} MaxLen = 7 OrgW = 1 IntW = 0 CntW = 2 AdjMax = 2 Tags = {1, 2} PkW <- PkSmall SigW <- SigSmall
INVARIANTS WellFormed Canonical Strict SignedBinds
CHECK_DEADLOCK FALSE
