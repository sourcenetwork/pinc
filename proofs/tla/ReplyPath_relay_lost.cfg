\* Witness: the rule before #598. follow_reply took the validity of the path the session left whatever its kind, and
\* a relay path is born validated and nothing ever validates one again: a dial through a relay whose reply comes back
\* on another path loses the relay path for good. TLC must violate TypeOK (a relay slot is not a state) and RelayValid
\* with it.
SPECIFICATION Spec
CONSTANTS NP = 4 Ids = {1, 2, 3, 4, 5} Roles = {"dial"} Old = FALSE Lookup = TRUE Direct = FALSE HDMAX = 2
CONSTRAINT Bound
INVARIANT TypeOK RelayValid
