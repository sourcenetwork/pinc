\* Witness: the queue without the hand-off in `forget`. Two places free at once, the oldest open takes one and
\* leaves without waking the next, so a place stays free beside a sleeping waiter: NoStall must fail.
CONSTANTS
    Opens = {o1, o2, o3, o4}
    Places = 2
    Fifo = TRUE
    Handoff = FALSE
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS NoStall
