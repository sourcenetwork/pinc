\* FollowsPeer where a gone path is held beside the active one: two direct paths, the active one lost while the
\* other is unvalidated (choose_path has nowhere to go, so the gone path stays held and active), data on the other
\* path (followed: the gone slot stays held, follow_active does not forget it), then data with a higher number on the
\* gone path's id, which fix T6 never follows. Before T6 the code followed it, and without the term ~ev.sg (the doc
\* before late2 D) the property would fail on that run. Two slots, ids 1 and 2, the host adds direct paths, one
\* challenge drawn at most.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "lost", "data"}
CONSTRAINT Bound
INVARIANT FollowsPeer GoneNeverBack
