\* RED: no floor between the renewals announces bring forward (FloorOn = FALSE and KeepFloor = FALSE: neither the
\* announce nor the bringing forward looks at the floor): every announce that arrives while a mapping is held starts
\* a renewal, so announces make the client renew as fast as the gateway answers. AnnounceSpaced must fail.
