\* The code as built: an optimistic dial ends after 4 unheard flights (30 ticks of a 2-tick first delay for a full
\* handshake), any handshake once Limit = 32 is exceeded. The peer stops and restarts; flights are lost; the host holds resends.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLingering ReachLive ThinKeepsLimit FloorOnLimit SubAtOnce
CHECK_DEADLOCK FALSE
