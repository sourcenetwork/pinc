\* The code's bounds. LMAX stands for u32::MAX, which a TLC integer cannot hold; no trace drops that many events,
\* so the saturation is never reached here (NodeEventQueue_w_sat reaches it in the model).
SPECIFICATION TraceSpec
CONSTANTS
    CAP = 8192
    HIGH = 7168
    LOW = 4096
    LMAX = 2147483647
INVARIANT Inv
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
