\* quick profile of Reconcile_w_refused.cfg: bounds unchanged (UniMax 2 does not reach the witness); Xor8 <- Xor8Quick and XorTab <- XorTabQuick (the byte XOR from a 16 x 16 table of half bytes), so the 65536-entry table is not built at start-up
SPECIFICATION Spec
CONSTANTS SPLIT = 2 ALEAF = 2 BLEAF = 1 COLD_RATIO = 2 MAX_NEST = 64 CPL_MAX = 255 FRAME_MAX = 16777215
CONSTANTS ALPHA = {0,1} MAXLEN = 2 UniMax = 3 Scenario = "all" HashMode = "onehot" CapSet = {400} MaxItemSet = {2} IdMods = {7}
CONSTANTS MaxReportC = 100000 MaxRoundsC = 1 Attempts = 1 ResetOn = FALSE Shadow = FALSE Liar = "none" Garbage = TRUE SmallMenu = TRUE FanTight = FALSE AllowTMR = FALSE
INVARIANTS NotRefused
CONSTANTS Xor8 <- Xor8Quick XorTab <- XorTabQuick
