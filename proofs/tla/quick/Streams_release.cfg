\* quick profile of Streams_release.cfg: Next -> NextQuick (Next without its stuttering steps); bounded by constraint: behaviours of at most 5 levels (Streams_releaseQuickBound)
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
\* The release rule with every property of the table on: a peer stream stops counting against the peer's limit once its
\* data is whole and read and its answer has left (a stream frame that ends the send half, or a reset sent), and its slot
\* is kept until both halves are done. One peer stream, two slots, a limit of one, and the stop requests and our own resets on
\* (the other configs that check the table run with RELEASE = FALSE, the size they were cut to).
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 1 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure ImplicitOpens StopEndsWithCode CodesSet StoppedEndDiscarded GiveUpDiscards DoneFreed NoMissedGrant NoStuckGrant NoHeldWithinCredit CreditInLimit RaiseNotHeld NothingAboveMark LedgerOnAdmit
PROPERTIES LimitsMonotone ReadMonotone FinalFixed EighthRule LedgerOnGrant PoolOnAlloc ReadFollowsContig CodeKept CreditMonotone OverOnlyByFirstData ReleaseWhenFlushed ReleaseIsFinal
CHECK_DEADLOCK FALSE
CONSTANT Next <- NextQuick
CONSTRAINT Streams_releaseQuickBound
