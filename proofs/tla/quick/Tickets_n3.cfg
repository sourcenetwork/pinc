\* quick profile of Tickets_n3.cfg: ExpVals {1, 2} -> {1} (live at now 1, expired at now 2), MaxClock 4 -> 3 (the store fills; the invariants insert into the full store), server-side Ids {1, 2, 3} -> {1}
SPECIFICATION Spec
CONSTANTS Unit = 1 Attempts = 2 MaxBatch = 1 Mode = "client"
          Peers = {p1, p2, p3, p4} Alpns = {a1} Tids = {t1} Psks = {s1} AeadVals = {1} CreditVals = {0}
          ExpVals = {1} Nows = {1, 2} Ids = {1}
          NC = 3 NS = 0 MaxClock = 3
CONSTANTS TicketSet <- TicketSetDef Batches <- BatchesDef Streams <- StreamsDef
CONSTRAINT Bounded
INVARIANTS TypeOK ClientBound OnePerPeer StampsDistinct InsertOrder TakeOnce TakeAlpn BatchLastKept ExportOK RoundTrip MalformedStoresNothing RestoreFilters
CHECK_DEADLOCK FALSE
