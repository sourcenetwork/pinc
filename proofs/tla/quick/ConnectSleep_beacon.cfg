\* quick profile of ConnectSleep_beacon.cfg: Times {1, 2, 9} -> {1, 9} (the clocks of ConnectSleep.cfg: a call before every deadline and one at the clock's last instant; no call lands between the first deadline and a later one with beacons on)
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 9} TMax = 9 Retry = 2 Repub = 4 Beacons = TRUE Twice = FALSE LinkStates <- LinksAll
INVARIANTS CloseAfterNotices PriorityOrder NoticesNotIdle NoWallNoJob RefusedNotSent SleepNotRetried RecordRetry NoticeTwice CloseOnlySuspended
CHECK_DEADLOCK FALSE
