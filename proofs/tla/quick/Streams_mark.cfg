\* quick profile of Streams_mark.cfg: Next -> NextQuick (Next without its stuttering steps); bounded by constraint: behaviours of at most 5 levels (Streams_markQuickBound)
CONSTANT PERSTREAM = TRUE
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 3 MAXREM = 2 B = 5 SWC = 2 MSWC = 2 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0, 4} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure NoHeldWithinCredit CreditInLimit NothingAboveMark
CHECK_DEADLOCK FALSE
CONSTANT Next <- NextQuick
CONSTRAINT Streams_markQuickBound
