\* quick profile of ConnectRelay_wstop.cfg: Times {0, 16, 31} -> {0}, MaxNs 2 -> 1, carrier nodes {1, 2} -> {1} (ClQuick1), peers {5, 6} -> {5} (PeersQuick), MAX_PEERS and ALIAS_MAX 32 -> 2 and 4 (MAXPEERSQuick, AMQuick: the tables never hold more)
\* Witness: with the first round's pass (it stops at the first message that does not fit) the short message behind
\* a long one is not handed over, so StepsOver is violated at the 6th call (open 1, sleep, close, long, short from
\* peer 5, heard 1).
SPECIFICATION Spec
CONSTANTS Times = {0} MaxNs = 1 Depth = 6 WithSleep = TRUE WithReady = FALSE OldHeld = FALSE FullUdp = FALSE LoudSpu = FALSE Cl <- ClQuick1 Peers <- PeersQuick MAXPEERS <- MAXPEERSQuick AM <- AMQuick
    HoldBehind = FALSE StopFirst = TRUE Seed = 5 Lens = {1, 1400} MBytes = 1600
INVARIANTS StepsOver
CONSTRAINT SmallMb
