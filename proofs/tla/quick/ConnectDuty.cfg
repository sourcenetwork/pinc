\* quick profile of ConnectDuty.cfg: T 130 -> 65 (two steady beacons, at 5 and 65, after a burst cut short by a step of 4 s), RS {0, 2, 5, 64} -> {2} (a restart in the burst, and after the steady beacons once the clock stepped back to 2)
SPECIFICATION Spec
CONSTANTS UNIT = 1 TOP <- NoTop T = 65 STEPS <- DutySteps RS = {2}
INVARIANT BurstBound
PROPERTY BurstGap SteadyGap QuietWithMailbox Rearm
CHECK_DEADLOCK FALSE
