\* quick profile of FacadeAcpForget.cfg: bounded by constraint: behaviours of depth 8 (FacadeAcpForgetQuickBound); one peer and two listed protocols are what it is about
\* The code as built, one peer and two listed protocols taken either way, any hook to start with (the host may edit it).
\* Revoke, unrevoke and admission_changed drop both answers of the peer, a dial to a revoked peer is refused before
\* anything is sent, each session is decided on its own protocol and direction, the endpoint is told whether the peer is
\* allowed any of the questions it is asked about, its own sessions and dials among them, and a dial the gate allows
\* drops a refusal held for its peer.
CONSTANTS
    Peers = {p1}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
    AskHeld = TRUE
    DialAsks = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DecideFresh CacheSound KnownSound NoDialRevoked NoCrossAllow NoCrossDeny NoCut
CONSTRAINT FacadeAcpForgetQuickBound
