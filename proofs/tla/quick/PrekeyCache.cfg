\* quick profile of PrekeyCache.cfg: MaxClock 6 -> 4 (the cache fills, a get refreshes the older entry, the next insert evicts the least recently used)
SPECIFICATION Spec
CONSTANTS N = 2 Hashes = {h1, h2, h3, h4} Vals = {1, 2} MaxClock = 4
CONSTRAINT Bounded
INVARIANTS TypeOK LenBound ZeroCachesNothing HashesDistinct StampsDistinct GetAgrees Refines EvictsLRU FillsEmpty GetRefreshes InsertKnownKeeps HitAfterInsert
CHECK_DEADLOCK FALSE
