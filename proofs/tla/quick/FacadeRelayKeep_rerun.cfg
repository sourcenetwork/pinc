\* quick profile of FacadeRelayKeep_rerun.cfg: TMAX 3 -> 2, CLOCKS {0, 1, 3} -> {0, 2} (a restart at 0 or later, back in time or ahead), SEQS 2 -> 1 (one record per node, no higher seq), PMAX 3 -> 1 and MBP 2 -> 1 (one packet held; FacadeRelayKeep_mailq keeps the mailbox bounds)
SPECIFICATION Spec
CONSTANTS NR = 2 NM = 1 RCAP = 1 MCAP = 1 MBP = 1 MAILQ = 4 TTL = 2 AGE = 2 TMAX = 2 CLOCKS = {0, 2} SEQS = 1 PUBS = 2 PMAX = 1 MAXR = 1 REFRESH = FALSE TORN = {"noverify", "prefix"} FAIL = FALSE RERUN = TRUE MAXT = 8 FQ = 64
INVARIANT TypeOK RestoredLive MailOrdered RecSynced LifeSynced MailSynced MarksBounded KeptBounded WritingHasJob StoreOwed DropsCounted RoleBounded
CHECK_DEADLOCK FALSE
