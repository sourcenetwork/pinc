\* quick profile of ConnectRelay_ready.cfg: Times {0, 16, 31} -> {0}, MaxNs 2 -> 1, carrier nodes {1, 2} -> {2} (ClQuick2), peers {5, 6} -> {5} (PeersQuick), MAX_PEERS and ALIAS_MAX 32 -> 2 and 4 (MAXPEERSQuick, AMQuick: the tables never hold more)
\* Readiness and the return of a member are inputs: held messages are kept when the hand-over is refused.
SPECIFICATION Spec
CONSTANTS Times = {0} MaxNs = 1 Depth = 6 WithSleep = TRUE WithReady = TRUE OldHeld = FALSE FullUdp = FALSE LoudSpu = FALSE Cl <- ClQuick2 Peers <- PeersQuick MAXPEERS <- MAXPEERSQuick AM <- AMQuick
    HoldBehind = FALSE StopFirst = FALSE Seed = 0 Lens = {1} MBytes = 120
INVARIANTS CallsOk QuotaOk SessionLimit SessionsBound MailboxOk Forwarded HeardDelivers StepsOver
CONSTRAINT SmallMb
