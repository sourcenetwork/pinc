\* quick profile of Cid_collmany.cfg: KMAX 9 -> 6, IDXMAX 9 -> 7 (every colliding index, up to 6, is reached by the refills)
\* Indices 1, 3 and 5 share one id, indices 2 and 4 another, and index 6 has the first id.
SPECIFICATION Spec
CONSTANTS SLOTS = 4 LOOK = 2 FIXED = TRUE SKIP = TRUE BUMP = TRUE KMAX = 6 IDXMAX = 7 SENDER = FALSE COLL <- CollMany
CONSTRAINT Bound
INVARIANT Inv Lookahead WindowAccepted
PROPERTY EpochMoves
