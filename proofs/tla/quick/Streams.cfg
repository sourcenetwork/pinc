\* quick profile of Streams.cfg: HOR 3 -> 1, LMAX 2 -> 1, MAXOFF 8 -> 5, DT 1 -> 0, Next -> NextQuick (Next without its stuttering steps, the same behaviours); one byte of data and one grant (limit 4 -> 5); no window grows: that needs 3 bytes read in one round trip (HOR 3)
CONSTANT PERSTREAM = TRUE
SPECIFICATION Spec
CONSTANT Next <- NextQuick
CONSTANT STOPS = TRUE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 4
CONSTANTS CH = 2 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 4 MSWC = 6 PM = 0 MAXOFF = 5 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure ImplicitOpens StopEndsWithCode CodesSet NoMissedGrant NoStuckGrant NoHeldWithinCredit CreditInLimit NothingAboveMark LedgerOnAdmit
PROPERTIES LimitsMonotone ReadMonotone FinalFixed EighthRule LedgerOnGrant PoolOnAlloc ReadFollowsContig CodeKept CreditMonotone OverOnlyByFirstData ReleaseWhenFlushed ReleaseIsFinal
CHECK_DEADLOCK FALSE
