\* quick profile of ConnectClient_net.cfg: DoNet -> DoNetQuick (probes sent at 0 only, answers carry address 1 only), CONSTRAINT Bounded (counters to threshold + 1) -> BoundedQuick (to the threshold), plus ConnectClient_netQuickBound (behaviours of at most 4 calls)
SPECIFICATION Spec
CONSTANTS Mode = "net" Times = {0, 70000} Peers = {1} Sess = {0} BUG = "none" DoNet <- DoNetQuick
INVARIANTS NetOK AnswerOK
CONSTRAINT BoundedQuick ConnectClient_netQuickBound
