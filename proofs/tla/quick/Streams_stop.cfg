\* quick profile of Streams_stop.cfg: HOR 3 -> 2, LMAX 2 -> 1, MAXOFF 4 -> 3 (frames of one byte ending by offset 2: one window read and raised once still, to 3), Next -> NextQuick (Next without its stuttering steps, the same behaviours)
\* Streams_stop.cfg: a stream asked to stop (710afb61, c3ea10e1, 29fb6aa7): its end or its sender's reset arriving
\* ends the request, no stop frame leaves after either, it is given no
\* more window, it still ends once its sender answers, and the table keeps every other rule. One peer stream that may
\* read a window and be raised once.
SPECIFICATION Spec
CONSTANT Next <- NextQuick
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 3 RETRY = TRUE
          HOR = 2 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK Pool CodesSet StoppedEndDiscarded StopOverAtEnd StopOverAtReset NoStopFrameAfterEnd StopEndable DoneFreed NoMissedGrant NoStuckGrant
PROPERTIES LimitsMonotone EighthRule LedgerOnGrant CodeKept NoRaiseAfterStop
