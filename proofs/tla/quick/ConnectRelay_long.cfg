\* quick profile of ConnectRelay_long.cfg: Times {0, 16, 31} -> {0}, MaxNs 2 -> 1, carrier nodes {1, 2} -> {1} (ClQuick1), peers {5, 6} -> {5} (PeersQuick), MAX_PEERS and ALIAS_MAX 32 -> 2 and 4 (MAXPEERSQuick, AMQuick: the tables never hold more)
\* A held message too long for the tunnel (1400 bytes, from a peer relay) stands before a short one; a heard member
\* keeps the long one and gets the short one. Mailbox quota 1600 so that both fit.
SPECIFICATION Spec
CONSTANTS Times = {0} MaxNs = 1 Depth = 6 WithSleep = TRUE WithReady = FALSE OldHeld = FALSE FullUdp = FALSE LoudSpu = FALSE Cl <- ClQuick1 Peers <- PeersQuick MAXPEERS <- MAXPEERSQuick AM <- AMQuick
    HoldBehind = FALSE StopFirst = FALSE Seed = 5 Lens = {1, 1400} MBytes = 1600
INVARIANTS CallsOk QuotaOk SessionLimit SessionsBound MailboxOk Forwarded HeardDelivers StepsOver
CONSTRAINT SmallMb
