\* quick profile of Cid_collevict.cfg: KMAX 9 -> 5, IDXMAX 9 -> 8 (install and authentications at 2, 4, 6, 8 reach the refill of index 9 and the eviction after it)
\* Index 9 has the id of index 1, at the code's 8 slots: the refill that reaches index 9 makes the entry of index 1
\* stand for it too, so it is kept while index 9 may be used (the rule before #398 lost it: Cid_skipevict.cfg).
SPECIFICATION Spec
CONSTANTS SLOTS = 8 LOOK = 2 FIXED = TRUE SKIP = TRUE BUMP = TRUE KMAX = 5 IDXMAX = 8 SENDER = FALSE COLL <- CollEvict
CONSTRAINT Bound
INVARIANT Inv Lookahead WindowAccepted
PROPERTY EpochMoves
