\* quick profile of ConnectRelay_wfwd.cfg: Times {0, 16, 31} -> {0}, MaxNs 2 -> 1, carrier nodes {1, 2} -> {2} (ClQuick2), peers {5, 6} -> {5} (PeersQuick), MAX_PEERS and ALIAS_MAX 32 -> 2 and 4 (MAXPEERSQuick, AMQuick: the tables never hold more)
\* Witness: with the withdrawn rule (a packet for a member that holds mail is held behind it) the packet of the member
\* homed at peer relay 5 is held and not forwarded, so Forwarded is violated at the 6th call (open 2, sleep, close,
\* SPU 1 to 2, return of 2, SPU 1 to 2).
SPECIFICATION Spec
CONSTANTS Times = {0} MaxNs = 1 Depth = 6 WithSleep = TRUE WithReady = TRUE OldHeld = FALSE FullUdp = FALSE LoudSpu = FALSE Cl <- ClQuick2 Peers <- PeersQuick MAXPEERS <- MAXPEERSQuick AM <- AMQuick
    HoldBehind = TRUE StopFirst = FALSE Seed = 5 Lens = {1} MBytes = 120
INVARIANTS Forwarded
CONSTRAINT SmallMb
