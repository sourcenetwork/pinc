\* quick profile of Streams_early_ctl.cfg: Next -> NextQuick (Next without its stuttering steps), OpenBound kept; bounded by constraint: behaviours of at most 5 levels (Streams_early_ctlQuickBound)
CONSTANT PERSTREAM = TRUE
\* The control frames of an optimistic dial (#432): Streams_early.cfg with the stop requests and our own resets on, so
\* the first stream we open (past the limit of 0) can be reset or asked to stop at once, before the establishment, and
\* its control frames wait for the limit as its data does. At most three opens in all (the constraint OpenBound).
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = TRUE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 3 RR = 2 N = 2 MAXREM = 0 B = 4 SWC = 1 MSWC = 1 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {} LocIds = {1}
INVARIANTS TypeOK Pool Unique FreeIsNew Counters ReleasedArePeer Admitted LocatePure ImplicitOpens StopEndsWithCode CodesSet NoHeldWithinCredit LedgerOnAdmit CreditInLimit NothingAboveMark OpenerInsideOrEarly Ordinals SendOnlyInLimit GatePrefix CtlOnlyInLimit PeerNeverRefuses CtlReleased
PROPERTIES CreditMonotone ReleaseWhenFlushed ReleaseIsFinal OpenPastOnlyEarly GateMonotone CodeKept
CONSTRAINT OpenBound
CHECK_DEADLOCK FALSE
CONSTANT Next <- NextQuick
CONSTRAINT Streams_early_ctlQuickBound
