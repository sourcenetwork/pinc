\* quick profile of ConnectRelay_fwd.cfg: Times {0, 16, 31} -> {0}, MaxNs 2 -> 1, carrier nodes {1, 2} -> {2} (ClQuick2), peers {5, 6} -> {5} (PeersQuick), MAX_PEERS and ALIAS_MAX 32 -> 2 and 4 (MAXPEERSQuick, AMQuick: the tables never hold more)
\* A member that holds mail is no longer asleep, has no route, and is homed at peer relay 5: its packets are forwarded.
\* Peer 5 is present from the start and is the home of node 2's record; the mail comes from a sleep, a close, an SPU
\* packet and the return of the member.
SPECIFICATION Spec
CONSTANTS Times = {0} MaxNs = 1 Depth = 6 WithSleep = TRUE WithReady = TRUE OldHeld = FALSE FullUdp = FALSE LoudSpu = FALSE Cl <- ClQuick2 Peers <- PeersQuick MAXPEERS <- MAXPEERSQuick AM <- AMQuick
    HoldBehind = FALSE StopFirst = FALSE Seed = 5 Lens = {1} MBytes = 120
INVARIANTS CallsOk QuotaOk SessionLimit SessionsBound MailboxOk Forwarded HeardDelivers StepsOver
CONSTRAINT SmallMb
