\* quick profile of IntegrationCodecs_tag64.cfg: the bounds are those of the deep config; the definitions cTagBoundary does not read, which TLC evaluates at start (RelayRT alone is 2 * 256 * 65536 cases, Addrs, Built and TagStrs billions of values, SRests and Bodies sequences of up to 1217 bytes), are substituted: the properties by UncheckedQuick (TRUE), the sets by UnreadQuick ({})
SPECIFICATION Spec
CONSTANTS B = 256 M4 = 240 S0 = 64854 S1 = 18766 S2 = 67 MAXTAG = 64 EXTMAX = 1216 BUG = "none"
CONSTANTS Addrs <- UnreadQuick Built <- UnreadQuick TagStrs <- UnreadQuick RelayRT <- UncheckedQuick RelayInv <- UncheckedQuick RelayNone <- UncheckedQuick TagAll <- UncheckedQuick SidRT <- UncheckedQuick SidAll <- UncheckedQuick SRests <- UnreadQuick Bodies <- UnreadQuick
INVARIANTS cTagBoundary
CHECK_DEADLOCK FALSE
