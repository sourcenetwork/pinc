\* quick profile of Reconcile_w_held.cfg: bounds unchanged (UniMax 4 does not reach the witness); Xor8 <- Xor8Quick and XorTab <- XorTabQuick (the byte XOR from a 16 x 16 table of half bytes), so the 65536-entry table is not built at start-up
SPECIFICATION Spec
CONSTANTS SPLIT = 2 ALEAF = 2 BLEAF = 1 COLD_RATIO = 2 MAX_NEST = 64 CPL_MAX = 255 FRAME_MAX = 16777215
CONSTANTS ALPHA = {0,1} MAXLEN = 2 UniMax = 5 Scenario = "all" HashMode = "onehot" CapSet = {66} MaxItemSet = {2} IdMods = {7}
CONSTANTS MaxReportC = 100000 MaxRoundsC = 1000 Attempts = 1 ResetOn = FALSE Shadow = FALSE Liar = "none" Garbage = FALSE SmallMenu = FALSE FanTight = FALSE AllowTMR = FALSE
INVARIANTS NotHeld
CONSTANTS Xor8 <- Xor8Quick XorTab <- XorTabQuick
