\* quick profile of BroadcastNode_evictCap2x.cfg: SeenCap 4 -> 2 and Mids {1, 2, 3, 4} -> {1, 2} (still one seen slot per mid, so the seen table never overflows, as in the deep run), Origins {1, 2} -> {2} (every message is asked for, so the answer is taken; the node's own messages are left out)
SPECIFICATION Spec
CONSTANTS AckById = FALSE Bodies = {1} KeepPrint = TRUE DueOnly = TRUE GraftStored = TRUE
CONSTANTS
    TTL = 2
    SeenCap = 2
    LogRing = 4
    LogCap = 2
    LogWin = 3
    FholdMax = 1
    HeldMax = 1
    ChecksMax = 1
    AcpCap = 2
    AcpMax = 1
    FloorWait = 2
    OldSlack = 1
    Mids = {1, 2}
    Origins = {2}
    Me = 1
    IsHub = TRUE
    Revoked = {}
    HeldDedup = TRUE
    HeldFullKeepsUnseen = TRUE
    TopicFull = FALSE
    AckAfterStore = TRUE
    Gather = FALSE
    EvictGuard = TRUE
    LogTrack = TRUE
    Stamps = {1}
    Sizes = {2, 4}
    MaxNow = 0
    MaxLife = 0
    Paths = {"PUB"}
PROPERTIES EvictedSeen
CHECK_DEADLOCK FALSE
