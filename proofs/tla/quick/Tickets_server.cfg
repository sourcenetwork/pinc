\* quick profile of Tickets_server.cfg: MaxClock 3 -> 2 (the store fills; the invariants issue into the full store), draw streams of 0..4 -> 0..3 ids (Streams <- StreamsDefQuick), client-side Peers {p1, p2, p3} -> {p1}, Alpns {a1, a2} -> {a1}, Ids {1, 2, 3} -> {1, 2} (a draw still collides with a stored id and a retry still finds a fresh one), ExpVals {1, 2} -> {1}
SPECIFICATION Spec
CONSTANTS Unit = 1 Attempts = 2 MaxBatch = 2 Mode = "server"
          Peers = {p1} Alpns = {a1} Tids = {t1} Psks = {s1} AeadVals = {1} CreditVals = {0}
          ExpVals = {1} Nows = {1, 2} Ids = {1, 2}
          NC = 0 NS = 2 MaxClock = 2
CONSTANTS TicketSet <- TicketSetDef Batches <- BatchesDef Streams <- StreamsDefQuick
CONSTRAINT Bounded
INVARIANTS TypeOK ServerBound ClientBound ZeroStoresNothing OnePerPeer UniqueIds StampsDistinct InsertOrder IssueOrder CollisionFails TakeOnce TakeAlpn BatchLastKept ExportOK RoundTrip MalformedStoresNothing RestoreFilters
CHECK_DEADLOCK FALSE
