\* RED for the arena bound (#635): Streams_spill with BOUND = FALSE. The session takes a slot for every stream that
\* spills, past its share, so one session could take every slot of the endpoint and shut the others out. TLC must
\* find a violation of ArenaBound.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = FALSE
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 5 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 5 MSWC = 5 PM = 0 MAXOFF = 5 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
INVARIANTS TypeOK ArenaBound
CONSTRAINT SpillBound
CHECK_DEADLOCK FALSE
