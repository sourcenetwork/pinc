\* MbtConnectFound.cfg: the graph tests/mbt_connect_found.rs walks. The code's ring of FOUND = 8 slots; two peers, so
\* a peer is evicted only after the other was forgotten and answered again until the ring came round (with a slot
\* empty then); sequences 1 and 2 and one home (an equal sequence that replaces shows in its time); a lifetime of 1
\* tick and the clock to 1: model time n is 1001 s + n * 30 s in the code (FOUND_TTL is 30 s), so an entry is fresh
\* at its own time and stale exactly at the next tick.
SPECIFICATION Spec
CONSTANTS N = 8 PEERS = {1, 2} SEQS = {1, 2} HOMES = {1} TTL = 1 TMAX = 1
INVARIANT Complete
CHECK_DEADLOCK FALSE
