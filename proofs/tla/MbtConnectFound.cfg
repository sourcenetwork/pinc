\* MbtConnectFound.cfg: the graph tests/mbt_connect_found.rs walks. The code's ring of FOUND = 8 slots; 6 fillers
\* (peers 4 .. 9) in slots 1 .. 6 before the first step and three peers (1 .. 3), so the ring is full with two of them
\* held: a forget then an answer for the third fills the emptied slot, an answer for the third with both held evicts
\* filler 4 at the next index (once: after it the three peers and five fillers fill the ring, and a new peer appears
\* only by a forget, which leaves a slot empty). Sequences 1 and 2 and one home (an equal sequence that replaces shows
\* in its time); a lifetime of 1 tick and the clock to 1: model time n is 1001 s + n * 30 s in the code (FOUND_TTL is
\* 30 s), so an entry is fresh at its own time and stale exactly at the next tick.
SPECIFICATION Spec
CONSTANTS N = 8 NP = 3 FILL = 6 SEQS = {1, 2} HOMES = {1} TTL = 1 TMAX = 1
INVARIANT Complete
CHECK_DEADLOCK FALSE
