\* The ledger table: 3 addresses over a table of 2 entries (an eviction of the first inserted), counters saturating
\* at 3, overhead 1, sizes 0 to 2 (charges 1 to 3). An entry has at most 32 values: at most 6 * 32 * 32 + 3 * 32 + 1
\* = 6241 states.
SPECIFICATION Spec
CONSTANTS NA = 3 CAP = 2 U = 3 OVH = 1 NS = {0, 1, 2} FIT = TRUE
INVARIANTS TypeOK Bounded Distinct AmpBound Earned SendExact OpenExact ReceiveExact ValidateExact
PROPERTIES TableStep Monotone
CHECK_DEADLOCK FALSE
