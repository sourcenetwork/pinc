\* Witness: the bounds of Streams_live_ext.cfg (HOR 2, SWC 2, EXTMAX 3); TLC must find NeverBlocked violated, so the
\* Blocked state that Progress is about is reachable there. Streams_live_mid.cfg (HOR 3, EXTMAX 1) and Streams_live.cfg
\* (EXTMAX 0) are not shown by it.
\* EXTMAX 3 (it was 2): a window is at most half the pool, so with the other users holding half of it (2 of 4 chunks)
\* the one stream's next window always fits (its read is chunk-aligned at its limit, below HOR) and no stream is ever
\* blocked: Progress held vacuously and NeverBlocked held. With 3 a window grown to 2 chunks no longer fits
CONSTANT PERSTREAM = TRUE
SPECIFICATION Spec
CONSTANT STOPS = TRUE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 4
CONSTANTS CH = 2 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 4 SWC = 2 MSWC = 6 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 2 LMAX = 2 EXTMAX = 3 SRTTS = {1} DT = 1
          RemIds = {0} LocIds = {}
INVARIANT NeverBlocked
CHECK_DEADLOCK FALSE
