\* RED: no Answered event. An optimistic dial whose handshake ends, or a sub-session whose peer answers, is never told
\* so, and a host waiting for the answer waits for good; AnsweredWhenDone must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    Cap = 64
    CapThin = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = FALSE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    AnswerAtReport = FALSE
    AnswerEvent = FALSE
    AnswerAtKeys = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS AnsweredWhenDone
CHECK_DEADLOCK FALSE
