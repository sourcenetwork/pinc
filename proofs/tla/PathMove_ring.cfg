\* The table of outstanding challenges (CH = 4) around its wrap. One slot, the first path, rebound to id 2 and back;
\* up to 5 challenges drawn (the fifth overwrites the first), by probe and by fail_over (which also unvalidates the
\* path, so an answer has something to validate); any of them answered, or a forged one.
SPECIFICATION Spec
CONSTANTS NP = 1 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d"} SIXES = {FALSE} RTTS = {0} TMAX = 5
          OPS = {"probe", "send", "resp", "rebind", "failover"}
CONSTRAINT Bound
INVARIANT TypeOK ActiveLive Unique OutstandingKept ReplacedKept AnswerOnPath ValidCause FallbackRule
