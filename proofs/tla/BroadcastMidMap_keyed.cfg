\* The keyed placement: ids that agree in their low bits start at other slots, and with a bound of 3 no insert of
\* the five ids is refused. Everything the plain config checks, with the bound in force.
SPECIFICATION Spec
CONSTANTS Slots = 8 Cap = 4 Keys = {0, 8, 16, 24, 32} Vals = {0, 1} ProbeMax = 3
CONSTANT Hash <- KeyedHash
INVARIANTS TypeOK Abstraction LenIsCount CapBound OneSlotPerKey ProbeChain ProbeBound NoneRefused
CHECK_DEADLOCK FALSE
