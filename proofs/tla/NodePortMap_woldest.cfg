\* NodePortMap_woldest.cfg: FINDING (portmap.rs start_port_mapping): TLC violates ReplacesOldest: with slot 1 freed by a reap and refilled by a later start, a full queue replaces the newest release and keeps an older one. 5 clients.
\* R = 2 retiring slots (RETIRING is 4 in the code; 2 reach the same full-queue path with fewer starts), NIDS
\* clients started in a behaviour, at most 2 failed draws per Pm (CONSTRAINT Bound), times 0 and TMAX = 1, the clock's maximum,
\* with NR = 1 (NONCE_RETRY), so a retry drawn at 0 is due at the maximum and one drawn at the maximum saturates.
SPECIFICATION Spec
