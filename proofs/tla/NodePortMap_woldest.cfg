\* NodePortMap_woldest.cfg: ReplacesOldest holds with fix N4 (reap keeps the queue in order; a full queue replaces the oldest). Before N4, with slot 1 freed by a reap and refilled by a later start, a full queue replaced the newest release and TLC found it violated. 5 clients.
\* R = 2 retiring slots (RETIRING is 4 in the code; 2 reach the same full-queue path with fewer starts), NIDS
\* clients started in a behaviour, at most 2 failed draws per Pm (CONSTRAINT Bound), times 0 and TMAX = 1, the clock's maximum,
\* with NR = 1 (NONCE_RETRY), so a retry drawn at 0 is due at the maximum and one drawn at the maximum saturates.
SPECIFICATION Spec
CONSTRAINT Bound
CONSTANTS R = 2 NIDS = 5 TMAX = 1 NR = 1
INVARIANT ReplacesOldest
