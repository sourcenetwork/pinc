\* One relay slot whose node has both stream addresses or only TCP, no stream kind broken, TCP broken, or both
\* broken (the only node carrying the relay role at the slot gone); the node is not very slow. At most 3 dials
\* (generation <= 3), 2 packets routed, a held queue of 1 (the second hold drops the oldest).
SPECIFICATION Spec
CONSTANTS Addrs <- AddrsFallback Brokens <- BrokensAll Slow = FALSE Cap = 1 MaxPkts = 2 MaxGen = 3
CONSTRAINT Bound
INVARIANTS StreamOnLiveLink OpenMatches OneStream DialKind FailsCounted NoticesAlternate SameCarrier HeldBound HeldFirst
CHECK_DEADLOCK FALSE
