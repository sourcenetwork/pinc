\* The repair of a session that ended at the hub (pinc#504): the subscriber's place is forgotten, it subscribes again
\* and asks for what it lacks, and a GET answered into a stream that fills keeps its place.
SPECIFICATION Spec
CONSTANTS Subs = {s1, s2} N = 3 LogCap = 3 StreamCap = 1 Swaps = 0 Cursor = TRUE Guard = TRUE Tell = TRUE Resume = TRUE Ends = 1 Owe = TRUE Notice = {"sub", "forgot", "get"}
INVARIANTS AckedReachesLive MissedOnlyHeld OwedInLog Bounds WakeOrPending
PROPERTIES AllAcked LiveAgain
CHECK_DEADLOCK FALSE
