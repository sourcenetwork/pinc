\* The retry of a validation. Two places, ids 1 and 2, direct and relayed paths: data from the peer on any path moves
\* the session and starts the validation of its path, and so does a challenge back to a path the peer probes; the
\* challenge leaves or is lost, answers arrive or not, the probes fall due (the last one too), the host adds, loses and
\* punches paths, the third probe timeout in a row. One challenge drawn at most (TMAX = 1: a retry sends the same
\* one), round trips 0, no IPv6.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d", "r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "lost", "punch", "chal", "data", "send", "resp", "timer", "failover"}
CONSTRAINT Bound
INVARIANT TypeOK ActiveLive Unique ValidCause AnswerOnPath ValidationLive
