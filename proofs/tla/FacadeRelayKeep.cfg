\* The keep of a node with the relay role: every documented property where no open limit applies (no refresh of
\* the same seq, no unparsable torn record); failed writes, a second run and a record table of 2 are in the _fail,
\* _rerun and _sweep configs.
\* Bounds: 2 record nodes and a record table of 1, 1 mailbox member of 2 packets, 3 packets held, record lifetime
\* and packet age of 2 units, relay clock 0..3 (a restart at 0, 1 or 3: back, at 0, ahead), seqs 1..2, 2 publishes, 1 restart.
SPECIFICATION Spec
CONSTANTS NR = 2 NM = 1 RCAP = 1 MCAP = 1 MBP = 2 MAILQ = 4 TTL = 2 AGE = 2 TMAX = 3 CLOCKS = {0, 1, 3} SEQS = 2 PUBS = 2 PMAX = 3 MAXR = 1 REFRESH = FALSE TORN = {"noverify", "prefix"} FAIL = FALSE RERUN = FALSE MAXT = 8 FQ = 64
INVARIANT TypeOK RestoredLive MailOrdered RecSynced LifeSynced MailSynced MarksBounded KeptBounded WritingHasJob StoreOwed DropsCounted RoleBounded
CHECK_DEADLOCK FALSE
