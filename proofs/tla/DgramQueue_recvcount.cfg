\* The bounds of DgramQueue_recv.cfg with DMAX 3 and the counting of fix T2 (DOC = TRUE): with the pool budget lowered
\* below what the queue holds, a push drops every entry, the pool still refuses, and recv_dropped counts every datagram
\* gone, as its doc says (Counted). Before T2 (DOC = FALSE) it counted 1 and TLC found Counted violated.
SPECIFICATION Spec
CONSTANTS SIDE = "recv" DOC = TRUE QN = 3 C = 2 CS = 2 P = 2 LENS = {0, 1, 2, 3} MAXSZ = 3 DMAX = 3
CONSTRAINT Bound
INVARIANT Counted
