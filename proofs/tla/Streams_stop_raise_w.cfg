\* Streams_stop_raise_w.cfg: witness, TLC must violate NoRaiseAfterStop under the rule before c3ea10e1 (DueOld): a
\* stream asked to stop whose reader read its window is given a new limit. The bounds of Streams_stop.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 3 LMAX = 2 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
CONSTANT Due <- [StreamsOps] DueOld
PROPERTIES NoRaiseAfterStop
