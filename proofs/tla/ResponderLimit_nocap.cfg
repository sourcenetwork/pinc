\* RED: the hold is armed again at every resend of the flight instead of counting from the session's creation. A dialer
\* that never finishes keeps the responder resending, so the half-open session outlives the hold of 6 ticks:
\* HalfOpenBounded fails.
CONSTANTS Base = 3 Hold = 6 Resend = 2 MaxRtt = 3 MaxT = 12 Fixed = FALSE Held = TRUE
SPECIFICATION Spec
INVARIANTS HalfOpenBounded
CHECK_DEADLOCK FALSE
