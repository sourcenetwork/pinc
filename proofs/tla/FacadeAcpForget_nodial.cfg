\* Witness: a dial to a revoked peer goes out. p1 is revoked and this node dials it; the session reaches p1, which holds
\* it until our deny arrives, and p1's own dial after the lift rides it and fails. NoDialRevoked must fail.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = FALSE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
SPECIFICATION Spec
INVARIANTS NoDialRevoked
