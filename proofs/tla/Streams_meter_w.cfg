\* RED for METER (#159): one meter for the whole connection, as before the fix. Stream 0 reads its byte, and a round
\* trip later its meter closes an epoch at a rate of 1; stream 4 then reads its first byte and, having drained nothing
\* it could measure yet, takes twice the connection's rate (2) as its window where its own rate asks for the initial
\* window (1). With sixteen streams on a real path the windows together asked the pool for sixteen times the credit the
\* connection moved, so most grants were deferred and the last streams crawled at one window per round trip. TLC must
\* find a violation of SizeFollowsOwnRate.
CONSTANT PERSTREAM = FALSE
SPECIFICATION Spec
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 4
CONSTANTS CH = 2 RING = 3 RR = 2 N = 2 MAXREM = 2 B = 4 SWC = 1 MSWC = 4 PM = 0 MAXOFF = 2 RETRY = TRUE
          HOR = 1 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 1
          RemIds = {0, 4} LocIds = {}
INVARIANTS TypeOK
PROPERTIES SizeFollowsOwnRate
CHECK_DEADLOCK FALSE
