\* Witness, on the bounds of PathMove_ring: an answer to a challenge that was replaced (not the outstanding one)
\* validates the path. TLC must violate NoReplacedAnswer.
SPECIFICATION Spec
CONSTANTS NP = 1 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d"} SIXES = {FALSE} RTTS = {0} TMAX = 5
          OPS = {"probe", "send", "resp", "rebind", "failover"}
CONSTRAINT Bound
INVARIANT NoReplacedAnswer
