\* RED: a take that leaves another session's bytes in the segment (no clear): the next session of the slot, or a
\* session of another slot, reads them, and NoForeignBytes fails.
SPECIFICATION Spec
CONSTANTS
    Slots = {1, 2}
    MaxOps = 10
    Refusals = TRUE
    Bug = "noclear"
CHECK_DEADLOCK FALSE
INVARIANT NoForeignBytes
