\* RED: a renewal the gateway grants for less than its round trip, taken as a failed renewal that keeps the lease held
\* before (OverEnds = FALSE; the code before fix P4 asked again at once instead, a rate this model does not count).
\* The bug: the gateway's mapping now runs for the short lifetime only and ends in the tick, while the client goes
\* back to holding and keeps publishing the old lease. With no restart and no spoof, TLC finds HeldByGateway violated.
SPECIFICATION Spec
