\* The timers of one session: a direct-first dial (relay copy at +300 ms, relay path given back at +2 s) or a dial
\* that waits for its peer's address, up to 2 resends (tries 1 to 3), drive at 1 s, 1.3 s and 3 s (in any order: the
\* clock jumps forward and back). No punch timer, the route stays direct, no probe timeout.
SPECIFICATION Spec
CONSTANTS Directs <- Both MaxRetx = 2 Arms <- NoArms PVs <- PVsIdle Routes <- OnlyFalse Ptos <- OnlyFalse Times = {1000000, 1300000, 3000000}
INVARIANTS HoldMirror NoDueAfterDrive RelayCopyOnce ReaddOnce RetryPerTry
CHECK_DEADLOCK FALSE
