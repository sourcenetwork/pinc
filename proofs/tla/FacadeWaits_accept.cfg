\* Futures: accept_bi, read on stream 0, answered. Transport: up to 3 changes among stream opens (2 at most), data,
\* fin, the answer and the close; the event queue has 2 places, so a third event finds it full (drop, evict or
\* stall), and the accept queue 1 place, so a second open is refused. Shutdown is the other config's.
\* States not measured yet; estimated under 20000.
CONSTANTS
    Op <- OpsAccept
    Env <- EnvAccept
    ACAP = 1
    EQ = 2
    MAXEV = 3
    MAXOPEN = 2
    NSTOP = 0
    TRK = 1
    DQ = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostWake Registered WaitsOwned ClosedReason EndedWhenGone AcceptFifo AcceptBound AcceptKept FailBound FailOnlyStopped
PROPERTIES WakeLive WakeExact EndedOnce ErrKeeps
