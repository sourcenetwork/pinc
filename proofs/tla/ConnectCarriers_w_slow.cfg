\* Witness of a documented finding (TLC must violate HeldFirst): on a very slow node, a packet routed after the
\* carrier opened leaves before the packets held while it was closed, which carriers.rs (carrier_open) says go out
\* first. Both stream addresses, nothing broken, at most 2 dials, 2 packets, a held queue of 2.
SPECIFICATION Spec
CONSTANTS Addrs <- AddrsBoth Brokens <- BrokensNone Slow = TRUE Cap = 2 MaxPkts = 2 MaxGen = 2
CONSTRAINT Bound
INVARIANT HeldFirst
CHECK_DEADLOCK FALSE
