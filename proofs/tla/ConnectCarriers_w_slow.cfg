\* HeldFirst on a very slow node: with fix K4 a packet routed after the carrier opened, while the drain is due, is held
\* behind the packets held while it was closed, which carriers.rs (carrier_open) says go out first. Before K4 it left
\* first and TLC found HeldFirst violated. Both stream addresses, nothing broken, at most 2 dials, 2 packets, a held queue of 2.
SPECIFICATION Spec
CONSTANTS Addrs <- AddrsBoth Brokens <- BrokensNone Slow = TRUE Cap = 2 MaxPkts = 2 MaxGen = 2
CONSTRAINT Bound
INVARIANT HeldFirst
CHECK_DEADLOCK FALSE
