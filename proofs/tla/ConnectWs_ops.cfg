SPECIFICATION Spec
\* FLs are form * 2000000 + length: 14000000 is the 7-bit form, 32000000 the 16-bit form, 128000000 the 64-bit form.
\* Every opcode (text and the reserved ones too), the reserved bit, both mask bits, FIN or not, pairs of frames.
CONSTANTS MP = 130 Wrong = "none" NF = 2 Ops = {0, 1, 2, 3, 8, 9, 10} RSVs = {FALSE, TRUE}
          FLs = {14000000, 14000002} ReadSizes = {1, 1000} EncCaps = {0, 2, 3, 8} EncLens = {0, 1, 125}
INVARIANT Faithful
INVARIANT BufBound
CHECK_DEADLOCK FALSE
