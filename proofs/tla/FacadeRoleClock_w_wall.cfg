\* FINDING witness (TLC must violate ClockIsWall): a wall clock after 0 and before T0 is accepted, and the relay
\* clock is then T0 plus the time since the start, not the wall clock (role.rs: nanoseconds since the Unix epoch).
\* Bounds: T0 = 4, the largest clock 12 (u64::MAX), mailbox age 2, the endpoint runs 0..3 units, relay deadlines
\* {0, 3, 9, 12}, kept packets that arrived at 1, 6 and 9. Wall clock 2, one run.
SPECIFICATION Spec
CONSTANTS T0 = 4 MAX = 12 AGE = 2 DMAX = 3 DUES = {0, 3, 9, 12} KEPT = {1, 6, 9} WALLS = {2} MAXRUN = 1
INVARIANT ClockIsWall
CHECK_DEADLOCK FALSE
