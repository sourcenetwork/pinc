\* The event queue at its stall point (MbtEndpoint.tla): 1 slot, one (id, source) pair; a flight, a part and a stray
\* at 0; dials to this node itself at 0, one at a time (queue lengths 0 and 1, then past the bound) or until the queue
\* stalls (S = 2K + 961 = 963 events for K = 1, S - 1 = 962 the last length that does not stall); events read one at
\* a time or all; timers at 1001 ms (the part is past its life) and 30001 ms (the session is past its end: freed, or
\* kept while the queue is stalled); a stale-id call and a stray at 30001 ms. At most 2 parts held. A few hundred
\* states.
