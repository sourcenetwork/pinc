\* StreamSend, a buffered stream: send credit spent at the write, the ring of chunks wrapping over released chunks, the
\* pool taken by other users, the range sets at capacity, a reset or a stop in every phase, the final size.
\* Bounds: chunks of 2 bytes, a ring of 1 slot over a pool of 1 chunk (the ring wraps at offset 2 once chunk 0 is
\* released), other users of the pool holding 0 or 1 chunk, 1 lost and 1 acknowledged range (every second disjoint range
\* overflows), offsets up to MAXOFF = 4, a window of 0 at the start raised to 2 or 4, writes of 1 or 3 bytes with no
\* send buffer cap reached, frames of 0 to 2 bytes, one reset code; no source.
\* Estimate: under 20,000 distinct states (not measured yet).
