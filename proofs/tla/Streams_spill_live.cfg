\* SPILL (#635), liveness: two peer streams that share the session's one arena slot, as in Streams_spill, with a limit
\* that can move past the first window (4 bytes here, one chunk): a stream that read all it was granted gets a new
\* limit, whichever stream holds the slot and whichever was refused it (Progress). It runs under LSpec2, which assumes
\* the application reads every stream that has bytes for it, and the peer is live: it fills its holes, and on each
\* stream it eventually uses its granted credit or ends the stream. These are assumptions about the application and
\* the peer, not properties of the transport. Streams_spill_live_noapp, _nohole and _nocredit each drop one part and
\* fail. Streams_spill_live_cover shows the states Progress is about are reached (a stream spilled while the other
\* waits at its limit with its grant deferred). This config has no RED for the regrant: TLC finds no reachable state
\* where a stream waits at its limit with a deferred grant that would now fit, so Progress holds here with RETRY =
\* FALSE and with the retry of deferred grants removed alike. Streams_live_stall is the regrant RED, in a config where
\* the other users of the pool let go without a read; the unit test
\* a_deferred_grant_goes_out_when_a_sibling_read_frees_room covers a deferred grant woken by a sibling's read.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION LSpec2
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 4 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 4 MSWC = 4 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
PROPERTIES Progress
CONSTRAINT SpillLiveBound
CHECK_DEADLOCK FALSE
