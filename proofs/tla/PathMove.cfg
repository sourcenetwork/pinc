\* Migration. An established connection with two places: the first path (1, direct, validated, active) and a second
\* (2) the host adds as a direct or a relayed path or a packet makes the connection learn. The host's calls that move
\* the session (add, path_lost, set_active, set_path_info), data from the peer on any path (with or without WAKE, the
\* highest numbered or not), a path going silent for 15 s, the timers (idle-out, the relay escape, the probes due, a
\* thin re-join held by its floor, the last probe), the third probe timeout in a row and every later one, the random
\* draw failing. One challenge drawn at most (TMAX = 1: a step that draws a second is checked, not extended), round
\* trips 0, no IPv6. Answers are PathMove_answer's.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"d", "r"} SIXES = {FALSE} RTTS = {0} TMAX = 1
          OPS = {"add", "lost", "set", "info", "data", "silence", "timer", "failover"}
CONSTRAINT Bound
INVARIANT TypeOK ActiveLive Unique ChooseValid FollowRule FallbackRule LostRule ValidCause
