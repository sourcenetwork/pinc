\* Small shape: node id and digests of 1 byte, at most 2 parents, topics of at most 2 bytes. The fields: every
\* refusal crossed with every other (topics of 0, 1, 2, 3 bytes x parent lists of 0 to 3 over 2 digests x flags
\* 0, 1, 2, 255), each 64-bit field at the 10 CBOR head boundaries (0, 23, 24, 255, 256, 65535, 65536, 2^32-1,
\* 2^32, 2^64-1), the counter at its 8, every algorithm tag. About 300 initial states, no transitions.
SPECIFICATION Spec
CONSTANTS IdW = 1 DigW = 1 MaxParents = 2 MaxTopic = 2 Wide = FALSE
INVARIANTS RoundTrip
CHECK_DEADLOCK FALSE
