\* Two peers and a table of one entry (TABLE_MAX 4096 in the code: one is the smallest table a second peer finds
\* full), times 0, 1 s, 2 s and u64::MAX that never go back. Six failures of a peer take its wait from 2 s to the
\* 60 s cap. Estimated under 10,000 states.
\* The documented redial: every peer owed a redial has the redial time at or before the end of its wait. It holds
\* with fix N2 (a look that skips a peer in its window sets the redial time to that peer's end). Before N2 TLC
\* reported NoLostRedial violated: a failure of a peer at 0, a second failure of it at 1 s, then the timer at 2 s.
CONSTANTS
    MAXT = 1
    PEERS = {1, 2}
CONSTANT TIMES <- TimesDef
SPECIFICATION Spec
INVARIANT NoLostRedial
CHECK_DEADLOCK FALSE
