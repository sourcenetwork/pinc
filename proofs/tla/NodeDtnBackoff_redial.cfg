\* Two peers and a table of one entry (TABLE_MAX 4096 in the code: one is the smallest table a second peer finds
\* full), times 0, 1 s, 2 s and u64::MAX that never go back. Six failures of a peer take its wait from 2 s to the
\* 60 s cap. Estimated under 10,000 states.
\* The documented redial: every peer owed a redial has the redial time at or before the end of its wait. The code
\* is expected to break it (one redial time, cleared when it fires): TLC reports NoLostRedial violated with the
\* shortest run, a failure of a peer at 0 and a second failure of it at 1 s, then the timer at 2 s.
CONSTANTS
    MAXT = 1
    PEERS = {1, 2}
CONSTANT TIMES <- TimesDef
SPECIFICATION Spec
INVARIANT NoLostRedial
CHECK_DEADLOCK FALSE
