\* The fix as built: two peers (the hook refuses one at the start, and the host may edit it); revoke, unrevoke and
\* admission_changed all drop the peer's cached answer, and a dial to a revoked peer is refused before anything is sent.
CONSTANTS
    Peers = {p1, p2}
    Allowed = {p1}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DecideFresh CacheSound NoDialRevoked
