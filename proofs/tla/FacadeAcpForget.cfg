\* The code as built: two peers, two listed protocols taken either way, any hook to start with (the host may edit it).
\* Revoke, unrevoke and admission_changed drop both answers of the peer, a dial to a revoked peer is refused before
\* anything is sent, each session is decided on its own protocol and direction, and the endpoint is told whether the
\* peer is allowed anything.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = TRUE
    AskEach = TRUE
    AnswerAny = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK DecideFresh CacheSound KnownSound NoDialRevoked NoCrossAllow NoCrossDeny
