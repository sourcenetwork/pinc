\* RED: found by this model in the floor as first written (KeepFloor = FALSE). An announce that arrives while a
\* renewal is in flight is kept for that renewal's answer. The renewal fails and the mapping stays held; a later
\* announce brings a renewal forward and sets the floor; that renewal is granted, and the announce kept from before
\* is acted on at its old start: another renewal at once, inside the floor, and the floor moves back.
\* AnnounceSpaced must fail.
SPECIFICATION Spec
CONSTANTS L = 4 Sec = 8 MaxT = 7 MaxRestarts = 1 Tries = 2 Renew = TRUE Epoch = TRUE Expiry = TRUE StopDrop = TRUE RefusalDrops = TRUE AnnounceDrops = FALSE Floor = 2 FloorOn = TRUE KeepFloor = FALSE Spoofs = TRUE HeaderDrops = FALSE ExpireFirst = TRUE
INVARIANTS AnnounceSpaced
CHECK_DEADLOCK FALSE
