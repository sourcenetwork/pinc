\* The clock's maximum (u64::MAX) at 68 s, the end of the clock; restarts and steps as ConnectDuty.cfg. Rearm holds:
\* the steady beacon after 64 s is due at the maximum, and a release there leaves no deadline (the next is past the
\* clock's end), so it is the last (fix C1). Before C1 the deadline stayed at now and TLC found Rearm violated. The
\* probe's deadlines follow the same rule (ProbeRearm), and next_deadline keeps one at the maximum (DeadlineCovers).
SPECIFICATION Spec
CONSTANTS UNIT = 1 TOP = 68 T = 68 STEPS <- DutySteps RS = {0, 2, 5, 64} PROBE = TRUE
INVARIANT DeadlineCovers
PROPERTY Rearm ProbeRearm
CHECK_DEADLOCK FALSE
