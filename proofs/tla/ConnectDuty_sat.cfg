\* Finding witness: the clock's maximum (u64::MAX) at 68 s, the end of the clock; restarts and steps as ConnectDuty.cfg.
\* TLC must find a step that violates Rearm: the steady beacon after 64 s is due at the maximum, and a release there
\* leaves the deadline at now, so every later poll at the maximum releases again.
SPECIFICATION Spec
CONSTANTS UNIT = 1 TOP = 68 T = 68 STEPS = {-1, 0, 1, 4, 60} RS = {0, 2, 5, 64}
PROPERTY Rearm
CHECK_DEADLOCK FALSE
