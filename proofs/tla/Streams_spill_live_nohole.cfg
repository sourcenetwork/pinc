\* RED (#635), liveness without the peer's retransmission: Streams_spill_live under LSpecNoHole, which drops the
\* assumption that the peer resends every hole. The bug it plants is a peer that never resends one lost byte: that
\* stream keeps its chunks above the hole, the other stream reads all it was granted and waits at its limit, and its
\* deferred grant never fits, so Progress fails. Master fails the same way; only that peer's connection starves, and
\* its idle timeout ends it.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = TRUE BOUND = TRUE
SPECIFICATION LSpecNoHole
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 4 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 4 MSWC = 4 PM = 0 MAXOFF = 6 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
PROPERTIES Progress
CONSTRAINT SpillLiveBound
CHECK_DEADLOCK FALSE
