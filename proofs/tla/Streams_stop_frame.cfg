\* Streams_stop_frame.cfg: witness of a finding, TLC must violate NoStopFrameAfterEnd: a stop request queued before the
\* sender's reset arrived is still sent (recv.rs on_reset leaves it waiting). The bounds of Streams_stop.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 3 LMAX = 2 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
INVARIANTS NoStopFrameAfterEnd
