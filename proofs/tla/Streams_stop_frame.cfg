\* Streams_stop_frame.cfg: witness, TLC must violate NoStopFrameAfterEnd under the rule before 29fb6aa7 (OnResetROld): a
\* stop request queued before the sender's reset arrived is still sent. The bounds of Streams_stop.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 3 LMAX = 2 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
CONSTANT OnResetR <- [StreamsOps] OnResetROld
INVARIANTS NoStopFrameAfterEnd
