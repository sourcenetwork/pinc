    HoldBehind = FALSE StopFirst = FALSE Seed = 5 Lens = {1, 1400} MBytes = 1600
INVARIANTS CallsOk QuotaOk SessionLimit SessionsBound MailboxOk Forwarded HeardDelivers StepsOver CloseRecorded GoneBound
