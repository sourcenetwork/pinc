\* DocFallback (path.rs module doc and fail_over: after three probe timeouts in a row on a direct path the connection
\* falls back to a relayed path), holding with fix T5: fail_over falls back from an active direct path whether it is
\* validated or not. The session follows the peer onto a direct path it has not validated and fail_over moves it to
\* the relayed path it holds. Before T5 it stayed there and TLC found DocFallback violated. Three slots, ids 1 to 3,
\* up to 2 challenges.
SPECIFICATION Spec
CONSTANTS NP = 3 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2, 3} KINDS = {"d", "r"} SIXES = {FALSE} RTTS = {0} TMAX = 2
          OPS = {"add", "data", "failover"}
CONSTRAINT Bound
INVARIANT DocFallback
