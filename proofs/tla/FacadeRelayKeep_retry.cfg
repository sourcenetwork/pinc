\* The keep of a node with the relay role with store writes that fail and are given up (keep.rs MAX_TRIES, FAILED at
\* 2 and 2): no write tried more than MAX_TRIES times, the failed writes within FAILED, a failed write holding back a
\* mark not tried yet only until the clock moves on, every failure and every write given up counted, and the store
\* behind the machine only for a node or member whose write was given up; a second run puts a write tried before
\* back at the front of the failed writes. KeptBounded is not checked here (finding, _w_kept).
\* Bounds: 1 record node, 1 mailbox member of 1 packet, 1 packet held, record lifetime and packet age of 2 units, relay
\* clock 0..2 (a restart at 0 or 2, the write out lost or landed whole), seq 1, 2 publishes, 1 restart or second run, a
\* write given up after 2 tries, 2 failed writes waiting (a put, a member's packets, then a removal finds them full).
