\* RED for the move back (#635): Streams_spill with MOVEBACK = FALSE. A spilled stream whose holes fill keeps its slot
\* with one interval left, so the other stream is refused a slot it could have had. TLC must find a violation of
\* MovedBack.
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 3
CONSTANTS ARENA = 1 MOVEBACK = FALSE BOUND = TRUE
SPECIFICATION Spec
VIEW MeterFree
CONSTANT STOPS = FALSE
CONSTANT RELEASE = FALSE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 5 RING = 2 RR = 2 N = 2 MAXREM = 2 B = 2 SWC = 5 MSWC = 5 PM = 0 MAXOFF = 5 RETRY = TRUE
          HOR = 5 LMAX = 1 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {2, 6} LocIds = {}
INVARIANTS TypeOK MovedBack
CONSTRAINT SpillBound
CHECK_DEADLOCK FALSE
