\* GREEN (safety and liveness): a stream that holds three pieces, a list of one to three pieces that fits it and may change
\* forever, a recipient that is stale at the start with the stream partly taken by other traffic. With room freed again and
\* again and the hub's step taken again and again it comes to hold a whole list (Live), and is never left with a part of
\* a list that fits (NotLeftPart).
CONSTANTS Hold = 3 Sizes = {1, 2, 3} Rule = "new" Changes = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NotLeftPart
PROPERTY Live
CHECK_DEADLOCK FALSE
