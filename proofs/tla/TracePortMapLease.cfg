\* A state machine trace: each event fixes every recorded variable, so a step no model action takes is a deadlock,
\* which TLC reports with the event index i. The constants are set in the INSTANCE of TracePortMapLease.tla.
SPECIFICATION TraceSpec
INVARIANT TraceInv
CHECK_DEADLOCK TRUE
\* the end check (TraceEnd.tla): TLC fails unless the replay consumed the last line of a trace that has one
INVARIANT ReplayAtEnd
POSTCONDITION ReplayEnded
