\* A very slow node (the drain of the held packets waits for the next drive), one relay slot with any set of
\* stream addresses (both, TCP only, WebSocket only, or none: a node that relays over UDP only), no stream kind
\* broken. At most 3 dials, 2 packets routed, a held queue of 1. HeldFirst is left out: on a very slow node it is
\* the finding of ConnectCarriers_w_slow.cfg.
SPECIFICATION Spec
CONSTANTS Addrs <- AddrsAll Brokens <- BrokensNone Slow = TRUE Cap = 1 MaxPkts = 2 MaxGen = 3
CONSTRAINT Bound
INVARIANTS StreamOnLiveLink OpenMatches OneStream DialKind FailsCounted NoticesAlternate SameCarrier HeldBound
CHECK_DEADLOCK FALSE
