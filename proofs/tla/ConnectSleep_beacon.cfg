\* One relay with a UDP address, the home; its link open, dialing or down; beacons on, so sleep notices, the record
\* and beacons compete for the one outstanding request. Clocks 1, 2 and 9 (9 stands for u64::MAX), a retry period of
\* 2, a republish period of 4. One suspension at a time.
SPECIFICATION Spec
CONSTANTS Relays = {1} Udp = {1} Home = 1 Times = {1, 2, 9} TMax = 9 Retry = 2 Repub = 4 Beacons = TRUE Twice = FALSE LinkStates <- LinksAll
INVARIANTS CloseAfterNotices PriorityOrder NoticesNotIdle NoWallNoSign RefusedNotSent SleepNotRetried RecordRetry NoticeTwice CloseOnlySuspended
CHECK_DEADLOCK FALSE
