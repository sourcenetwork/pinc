SPECIFICATION PacerSpec
CONSTANTS MS = 1 SEC = 100 TOP = 100000 MAXC = 24 MINC = 4 INITC = 8 BETALIM = 10 MINMSS = 2 MAXMSS = 6 MINSAMP = 2 EXITCW = 8 GFAST = 3 GMID = 5 U32MAX = 5 IRTT = 8 BURST = 3 KMAX = 4 PMTU = 4 PSRTT = 20 PCW = 8
    RULE = "count"
    LIMS = {TRUE}
    DELAYS = {0}
    SIZES = {1}
    EAGERS = {FALSE}
CONSTRAINT Bound
PROPERTY NoEarlyPause
CHECK_DEADLOCK FALSE
