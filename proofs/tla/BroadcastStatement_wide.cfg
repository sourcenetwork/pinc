\* The code's shape: node ids and digests of 32 bytes, 8 parents, topics of 255 bytes. The fields: the widest
\* statement (every integer at its widest head, a 255-byte topic, 8 parents, a hybrid origin), a narrow one, and
\* one of each refusal at the widest. 7 initial states, no transitions.
SPECIFICATION Spec
CONSTANTS IdW = 32 DigW = 32 MaxParents = 8 MaxTopic = 255 Wide = TRUE
INVARIANTS RoundTrip Bound
CHECK_DEADLOCK FALSE
