\* The code's default regime (100 slots, a live-stream cap of 50, max_remote 100): the cap (half the slots, 1 of 3) below
\* the peer's limit (MAXREM 2). A frame on stream 4 opens streams 0 and 4 past the credit of 1; they are admitted by
\* the pool test and the credit is then caught up with them (CatchUpExact), also while the windows of the streams that
\* carried data, ours included, hold the ledger past the pool (Streams_catchup_w.cfg): LedgerOnGrant meets the raise
\* the first statement of it refused. The constants of Streams_lazy_jump.cfg with N 4 -> 3, B 5 -> 4, MAXOFF 4 -> 2
\* and RemIds {0, 4} -> {4}
