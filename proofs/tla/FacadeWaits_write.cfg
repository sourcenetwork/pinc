\* Futures: write on stream 0, recv_datagram, closed. Transport: up to 3 changes among room, stop-sending on
\* streams 0 and 1, datagrams (1 held, so a second drops the first) and the close, plus the local shutdown; the
\* event queue has 2 places and TRACKED is 1, so a second stopped stream evicts the first.
\* States not measured yet; estimated under 20000.
CONSTANTS
    Op <- OpsWrite
    Env <- EnvWrite
    ACAP = 1
    EQ = 2
    MAXEV = 3
    MAXOPEN = 0
    NSTOP = 2
    TRK = 1
    DQ = 1
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS TypeOK NoLostWake Registered WaitsOwned ClosedReason EndedWhenGone AcceptFifo AcceptBound AcceptKept FailBound FailOnlyStopped
PROPERTIES WakeLive WakeExact EndedOnce ErrKeeps
