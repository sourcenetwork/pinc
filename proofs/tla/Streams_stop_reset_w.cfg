\* Streams_stop_reset_w.cfg: witness, TLC must violate StopOverAtReset under the rule before 29fb6aa7 (OnResetROld): the
\* sender's reset arriving on a stream asked to stop leaves its request waiting or in flight. The bounds of Streams_stop.cfg.
SPECIFICATION Spec
VIEW MeterFree
CONSTANT PERSTREAM = TRUE
CONSTANT SPR = 2
CONSTANT STOPS = TRUE
CONSTANT RELEASE = TRUE
CONSTANT EARLY = FALSE
CONSTANT FIRSTK = 1
CONSTANTS CH = 1 RING = 4 RR = 2 N = 1 MAXREM = 1 B = 6 SWC = 2 MSWC = 3 PM = 0 MAXOFF = 4 RETRY = TRUE
          HOR = 3 LMAX = 2 EXTMAX = 0 SRTTS = {1} DT = 0
          RemIds = {0} LocIds = {}
CHECK_DEADLOCK FALSE
CONSTANT OnResetR <- [StreamsOps] OnResetROld
INVARIANTS StopOverAtReset
