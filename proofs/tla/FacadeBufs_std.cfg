\* drive.rs buffer pools with std: two endpoints of a thread share one pool; POOLED = 2 (scaled from 8), endpoint 1
\* with H1 = 2 holders of buffers of L1 = 1 byte, endpoint 2 with H2 = 2 of L2 = 2 bytes (distinct lengths, so mixing
\* shows), at most NB = 5 buffers allocated. Estimated under 15,000 states; not measured.
SPECIFICATION Spec
CONSTANTS POOLED = 2 STD = TRUE H1 = 2 H2 = 2 L1 = 1 L2 = 2 NB = 5
INVARIANT PoolBound OneHolder ExactLen OwnLen NoGrow
CHECK_DEADLOCK FALSE
