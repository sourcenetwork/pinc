\* Finding witness (path.rs module doc on following the peer): on a direct active path, the highest numbered data
\* packet arriving on a relayed path without WAKE does not move the active path. TLC must violate FollowsPeer. Two
\* slots, ids 1 and 2, the host adds relayed paths.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 0
          OPS = {"add", "data"}
CONSTRAINT Bound
INVARIANT FollowsPeer
