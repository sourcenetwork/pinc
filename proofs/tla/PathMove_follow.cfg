\* FollowsPeer as the path.rs module doc states it after T8: the highest numbered data packet moves the active path
\* to its path, except that a packet on a relayed path without WAKE does not move a direct active path. Before T8 the
\* doc had no exception and TLC found FollowsPeer violated. Two slots, ids 1 and 2, the host adds relayed paths.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2} KINDS = {"r"} SIXES = {FALSE} RTTS = {0} TMAX = 0
          OPS = {"add", "data"}
CONSTRAINT Bound
INVARIANT FollowsPeer
