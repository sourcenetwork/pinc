\* Finding b (endpoint/records.rs 110-113): a relay's answer is neither weighed against nor kept in the known table, so
\* a lookup can answer with a record older than one it answered before, and its answer is not what it believes. TLC
\* must violate LookupNewest.
CONSTANTS
    Nodes = {n1}
    MaxSeq = 2
    SeqCheck = TRUE
    KMAX = 1
    RELAYS = TRUE
SPECIFICATION Spec
INVARIANTS LookupNewest
