\* Validation against the network. Two slots, path ids 1 to 3 (a packet from an address the connection does not hold
\* takes the place of an unvalidated path), direct paths only, up to 2 challenges drawn; answers carrying any challenge
\* that left on any path, or a forged one, arrive on any path, before and after the path's address changes (rebind);
\* a challenge may never leave or never be answered; the host adds and removes paths. Round trips 0, no IPv6.
SPECIFICATION Spec
CONSTANTS NP = 2 CH = 4 GAIN = 5000000 PEN = 1000000000 BONUS = 3000000
          Ids = {1, 2, 3} KINDS = {"d"} SIXES = {FALSE} RTTS = {0} TMAX = 2
          OPS = {"add", "remove", "rebind", "probe", "send", "resp", "chal"}
CONSTRAINT Bound
INVARIANT TypeOK ActiveLive Unique OutstandingKept ReplacedKept AnswerOnPath ValidCause
