\* ConnectFound.cfg: a ring of 2 slots and 3 peers, so the ring wraps and a third peer evicts; sequences 1 and 2, one
\* home; a lifetime of 1 tick and the clock to 1, so an entry is fresh at its own time and before it, and stale one
\* tick after, and an answer of an equal sequence a tick later shows in its time whether it replaced the entry. The
\* rule since 6bd2f4db. ConnectFound_homes.cfg has two homes at one time.
SPECIFICATION Spec
CONSTANTS N = 2 PEERS = {1, 2, 3} SEQS = {1, 2} HOMES = {1} TTL = 1 TMAX = 1 OLD = FALSE
INVARIANT TypeOK OneSlot Newest FreshTTL
PROPERTY LowerKeeps HeldNoEvict EvictAtNext
CHECK_DEADLOCK FALSE
