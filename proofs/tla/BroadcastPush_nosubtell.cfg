\* RED: the code before vinc#505. A subscriber's session ends, the log evicts a message it lacks while it is away,
\* and its SUB is answered with what the log still holds and nothing more: an acknowledged message the subscriber
\* neither has, nor is fetching, nor is told about.
SPECIFICATION Spec
CONSTANTS Subs = {s1, s2} N = 4 LogCap = 2 StreamCap = 1 Swaps = 0 Cursor = TRUE Guard = TRUE Tell = TRUE Resume = TRUE Ends = 1 Owe = TRUE Notice = {"forgot", "get"}
INVARIANTS AckedReachesLive
CHECK_DEADLOCK FALSE
