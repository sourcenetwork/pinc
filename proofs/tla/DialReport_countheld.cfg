\* RED: a held timer counts as a flight. A lookup that holds the dial for four looks ends a dial that sent one
\* flight to a running peer, so ReachLive must fail.
CONSTANTS
    First = 2
    Rtt = 1
    Flights = 4
    Promise = 30
    Limit = 32
    MaxNow = 36
    MaxInc = 2
    Early = TRUE
    FixedBound = 0
    CountHeld = TRUE
    HeardResets = TRUE
    EarlyOnThin = FALSE
    AnswerAtReport = FALSE
    AnswerEvent = TRUE
    AnswerAtKeys = FALSE
    FloorEarly = FALSE
SPECIFICATION Spec
INVARIANTS ReachLive
CHECK_DEADLOCK FALSE
