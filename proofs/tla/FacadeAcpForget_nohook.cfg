\* Witness: a host edits its allowlist without calling admission_changed. p2 dials and the hook refuses it, so the
\* deny is cached; the host then lists p2, and p2's next dial is refused on the cached deny although the hook now admits
\* it. DecideFresh must fail.
CONSTANTS
    Peers = {p1, p2}
    Allowed = {p1}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = FALSE
SPECIFICATION Spec
INVARIANTS DecideFresh
