\* Witness: a host edits its hook without calling admission_changed. A peer the hook refuses everything dials, the deny
\* is cached; the host then allows it a protocol, and its next session on it is refused on the cached deny although the
\* hook now admits it. DecideFresh must fail.
CONSTANTS
    Peers = {p1, p2}
    Listed = {a, b}
    Dialed = {}
    ForgetOnLift = TRUE
    ForgetOnRevoke = TRUE
    RefuseDial = TRUE
    ForgetOnChange = FALSE
    AskEach = TRUE
    AnswerAny = TRUE
SPECIFICATION Spec
INVARIANTS DecideFresh
