\* A finding of the code as it is: a repair packet whose payload has no room for the first frame of a repair a packet
\* can carry (a buffer smaller than the path's datagrams) is sealed with its ACK alone when the ACK is due, and the seal
\* takes the repair, so no packet carries it. TLC must find RepairCarried violated.
SPECIFICATION Spec
CONSTANTS MAXLEN = 2 LIMIT = 16384 MAXPN = 8191 MAXEND = 8191 MAXRANGES = 3 MINIMAL = TRUE
          MINROOM = 24 SBUDGET = 11 REKEYMAX = 51 REFS = 8 CLEAR = TRUE CHECK = TRUE KEEP = TRUE SEAL = TRUE
          MODES = {"repair"}
INVARIANTS RepairCarried
CHECK_DEADLOCK FALSE
