\* A documented finding: the doc of Initial::write promises a length error for a field out of range, and the code
\* writes an ALPN of 0 or 33 to 255 bytes (refused by the parser). TLC finds WriteRefusesBadAlpn violated in the
\* first state. Same domain as MessageCodec.cfg; the property is constant, so the first state decides it.
SPECIFICATION Spec
INVARIANT WriteRefusesBadAlpn
CHECK_DEADLOCK FALSE
