\* The server store (Mode server, NC 0: the client store stays empty, so its invariants are checked by Tickets.cfg and
\* Tickets_n3.cfg; Peers, Alpns and ExpVals feed only those).
SPECIFICATION Spec
CONSTANTS Unit = 1 Attempts = 2 MaxBatch = 2 Mode = "server"
          Peers = {p1, p2, p3} Alpns = {a1, a2} Tids = {t1} Psks = {s1} AeadVals = {1} CreditVals = {0}
          ExpVals = {1, 2} Nows = {1, 2} Ids = {1, 2, 3}
          NC = 0 NS = 2 MaxClock = 3
CONSTANTS TicketSet <- TicketSetDef Batches <- BatchesDef Streams <- StreamsDef
CONSTRAINT Bounded
INVARIANTS TypeOK ServerBound UniqueIds StampsDistinct IssueOrder CollisionFails
CHECK_DEADLOCK FALSE
