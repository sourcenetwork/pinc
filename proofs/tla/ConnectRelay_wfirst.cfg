\* Witness: with the old rule a packet goes down the tunnel ahead of a held message, so HeldFirst is violated at the
\* 6th call (open 2, sleep, close, SPU 1 to 2, heard 2, SPU 1 to 2).
SPECIFICATION Spec
CONSTANTS Times = {0, 16, 31} MaxNs = 2 Depth = 6 WithSleep = TRUE WithReady = FALSE OldHeld = TRUE
INVARIANTS HeldFirst
CONSTRAINT SmallMb
