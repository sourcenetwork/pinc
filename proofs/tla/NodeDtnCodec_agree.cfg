\* A documented finding: check_runs and take_runs do not accept the same runs. A torn last run whose header is
\* whole, within the bundle and not on a slice is refused by the check (the record is dropped) and left out by the
\* read. TLC must report Agree violated. Same cases as NodeDtnCodec_runs.cfg.
CONSTANT Part = "runs"
CONSTANT HEADS <- HeadsDef
CONSTANT TOTAL <- TotalDef
CONSTANT SLICE <- SliceDef
SPECIFICATION Spec
INVARIANT Agree
CHECK_DEADLOCK FALSE
