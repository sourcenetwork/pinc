\* RED (liveness): the rule before for a hub: the set is written in one call that stops at the stream's first refusal and is
\* sent again only at the next local change. With no further change the other hub never holds the set whole: Live fails.
CONSTANTS Hold = 2 Sizes = {2, 3} Rule = "hubtip" Changes = FALSE
SPECIFICATION Spec
PROPERTY Live
CHECK_DEADLOCK FALSE
