[package]
name = "vinc-transport"
description = "VINCER, the VINC transport: packets, frames, streams, datagrams, flow control, loss recovery, congestion control, pacing, path MTU, connection ids and migration"
keywords = ["no_std", "transport", "streams", "congestion", "sans-io"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
alloc = []
# Test-only observation of the key layer for trace validation. Costs nothing when off.
trace = ["alloc", "vinc-security/trace"]
# Test hook: hand the connection the frames of an authenticated packet without sealing them.
inject = []

[dependencies]
vinc-wire = { workspace = true }
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }

[lints]
workspace = true
