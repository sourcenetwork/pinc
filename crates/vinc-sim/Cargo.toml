[package]
name = "vinc-sim"
description = "Deterministic network simulator engine for VINC tests and benches: virtual time, links, NAT, faults, adversaries"
keywords = ["simulation", "network", "deterministic", "testing"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The reference random source: a bit-exact port of CPython's `random` and the reference seed derivation.
reference = ["dep:blake2"]
# The scenario suite: the reference harness's worlds, protocols, gates and metrics run against the real `vinc-core`
# endpoint with real crypto.
suite = [
    "reference",
    "dep:vinc-connect",
    "dep:vinc-core",
    "dep:vinc-crypto",
    "dep:blake3",
    "dep:vinc-dag",
    "dep:vinc-membership",
    "dep:vinc-node",
    "dep:vinc-reconcile",
    "dep:vinc-security",
    "dep:vinc-transport",
    "dep:vinc-values",
]

[dependencies]
blake2 = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
vinc-connect = { workspace = true, optional = true }
vinc-core = { workspace = true, optional = true, features = ["alloc"] }
vinc-crypto = { workspace = true, optional = true, features = ["derive-trace"] }
vinc-dag = { workspace = true, optional = true, features = ["alloc"] }
vinc-membership = { workspace = true, optional = true, features = ["alloc"] }
vinc-node = { workspace = true, optional = true }
vinc-reconcile = { workspace = true, optional = true, features = ["alloc"] }
vinc-security = { workspace = true, optional = true }
vinc-transport = { workspace = true, optional = true, features = ["alloc"] }
vinc-values = { workspace = true, optional = true }

[lints]
workspace = true
