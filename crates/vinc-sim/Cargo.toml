[package]
name = "vinc-sim"
description = "Deterministic network simulator engine for VINC tests and benches: virtual time, links, NAT, faults, adversaries"
keywords = ["simulation", "network", "deterministic", "testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The reference random source: a bit-exact port of CPython's `random` and the reference seed derivation.
reference = ["dep:blake2"]

[dependencies]
blake2 = { workspace = true, optional = true }

[lints]
workspace = true
