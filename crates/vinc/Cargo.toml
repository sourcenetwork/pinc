[package]
name = "vinc"
description = "VINC for applications: one entry point with a builder, connections, streams that implement futures-io, access hooks and a typed protocol registration, all async and driven by the host's runtime"
keywords = ["p2p", "transport", "facade"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vinc-driver = { workspace = true }
vinc-crypto = { workspace = true }
vinc-keystore = { workspace = true }
vinc-nuclei = { workspace = true, optional = true }
futures-io = { workspace = true }

[dev-dependencies]
nuclei = { workspace = true }

[features]
# Lets a TPM key store (`vinc-keystore`) hold the identity: pass it to `Builder::key_store`.
hwenc = ["vinc-keystore/hwenc"]
# `Builder::bind_nuclei` and `vinc::nuclei`: the driver's sockets and timers on the nuclei runtime.
nuclei = ["dep:vinc-nuclei"]

[lints]
workspace = true

[[example]]
name = "echo"
required-features = ["nuclei"]

[[example]]
name = "transfer"
required-features = ["nuclei"]

[[example]]
name = "defradb_backend"
required-features = ["nuclei"]
