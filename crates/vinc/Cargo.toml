[package]
name = "vinc"
description = "VINC for applications: one entry point with a builder, connections, streams, datagrams, access hooks and a typed protocol registration, all async, with the host passing its I/O as three async closures"
keywords = ["p2p", "transport", "facade"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }
vinc-keystore = { workspace = true }
vinc-transport = { workspace = true, features = ["alloc"] }
vinc-core = { workspace = true, features = ["alloc"] }

[dev-dependencies]
nuclei = { workspace = true }

[features]
# Lets a TPM key store (`vinc-keystore`) hold the identity: pass it to `Builder::key_store`.
hwenc = ["vinc-keystore/hwenc"]

[lints]
workspace = true

[[example]]
name = "echo"

[[example]]
name = "transfer"

[[example]]
name = "defradb_backend"
