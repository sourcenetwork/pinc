[package]
name = "pinc-dag"
description = "PINC lite DAG library: CIDs and blocks in DefraDB's format, BLAKE3 verified streaming, verified-range sets; no networking code"
keywords = ["no_std", "dag", "cid", "blake3"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[features]
default = []
alloc = []
std = ["alloc", "blake3/std"]
# Test-only observation of internal state for trace validation. Costs nothing when off.
trace = []

[dependencies]
pinc-wire = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
