[package]
name = "pinc-keystore"
description = "Where PINC's long-term keys live: a software key store and, behind the hwenc feature, a pure-Rust TPM 2.0 backend"
keywords = ["no_std", "crypto", "keystore", "tpm"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The operating system as the source of randomness (`SoftwareStore::new`, `os_random`).
std = ["dep:getrandom"]
# Off by default: without it no TPM code is compiled.
hwenc = ["std", "dep:tpm2-protocol", "dep:p256"]

[dependencies]
pinc-crypto = { workspace = true }
pinc-security = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true, optional = true }
tpm2-protocol = { workspace = true, optional = true }
p256 = { workspace = true, optional = true, features = ["ecdsa"] }

[lints]
workspace = true
