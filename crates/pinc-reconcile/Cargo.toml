[package]
name = "pinc-reconcile"
description = "PINC set reconciliation by range fingerprints: the cost scales with the difference, and the result is exact"
keywords = ["no_std", "reconciliation", "sync", "fingerprint"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The session state machines, the drivers over a channel and the in-memory index. The codec and the traits need none.
alloc = []

[dependencies]
pinc-wire = { workspace = true }
pinc-crypto = { workspace = true }

[lints]
workspace = true
