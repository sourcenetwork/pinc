[package]
name = "pinc-crypto"
description = "PINC primitives behind one static interface: AEADs, X25519, ML-KEM-768, identities, a BLAKE3 KDF and a DRBG"
keywords = ["no_std", "crypto", "aead", "kem", "signature"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["alloc"]
# Boxes the expanded ML-DSA-65 signing key once, at setup. Off on a target without an allocator, where the key stays
# inline in the key pair.
alloc = []
# Test-only record of what every transcript absorbs, for trace validation. Allocates once armed; costs nothing when off.
trace = []
# Lets a simulator observe every key derivation (see `trace`); test and simulation builds only, needs `std`.
derive-trace = []

[dependencies]
pinc-wire = { workspace = true }
blake3 = { workspace = true, features = ["zeroize"] }
sha2 = { workspace = true }
x25519-dalek = { workspace = true, features = ["zeroize"] }
ed25519-dalek = { workspace = true, features = ["zeroize"] }
p256 = { workspace = true, features = ["ecdsa"] }
ml-kem = { workspace = true, features = ["zeroize"] }
ml-dsa = { workspace = true, features = ["zeroize"] }
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
aes-gcm = { workspace = true, features = ["aes", "zeroize"] }
aes = { workspace = true, features = ["zeroize"] }
chacha20 = { workspace = true, features = ["cipher", "zeroize"] }
zeroize = { workspace = true, features = ["derive"] }
subtle = { workspace = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cpufeatures = { workspace = true }

[lints]
workspace = true
