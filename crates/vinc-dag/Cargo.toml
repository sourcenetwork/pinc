[package]
name = "vinc-dag"
description = "The lite VINC DAG library: CIDs and blocks in DefraDB's format, BLAKE3 verified streaming, verified-range sets; no networking code"
keywords = ["no_std", "dag", "cid", "blake3"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
alloc = []
std = ["alloc", "blake3/std"]

[dependencies]
vinc-wire = { path = "../vinc-wire" }
blake3 = { version = "1.8.7", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[lints]
workspace = true
