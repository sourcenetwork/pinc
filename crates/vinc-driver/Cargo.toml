[package]
name = "vinc-driver"
description = "The reference driver: the SANS-IO endpoint as a future over the host's sockets and timers, with a bounded command queue, key requests answered by a key store and typed stream handles for a facade"
keywords = ["driver", "udp", "endpoint"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }
vinc-keystore = { workspace = true }
vinc-transport = { workspace = true, features = ["alloc"] }
vinc-core = { workspace = true }
kovan-channel = { workspace = true }

[lints]
workspace = true
