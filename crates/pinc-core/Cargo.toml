[package]
name = "pinc-core"
description = "The PINC endpoint: a SANS-IO table of connections with demultiplexing, an amplification ledger, a half-open cap, node round trips, access checks, sub-sessions, keepalive schedules and one deadline heap"
keywords = ["no_std", "endpoint", "sans-io", "transport"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Forward `alloc` to the transport (boxed buffer pools for hosts that want them).
alloc = ["pinc-transport/alloc"]
# Record every endpoint decision as a bounded ring of trace records, written as ndjson with `TraceRecord::write_ndjson`.
trace = []
# Fault-injection hooks for tests, such as giving a session a second connection id to force a demultiplexing collision.
inject = []

[dependencies]
pinc-wire = { workspace = true }
pinc-crypto = { workspace = true }
pinc-security = { workspace = true }
pinc-transport = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
