[package]
name = "pinc"
description = "PINC: Next-gen peer-to-peer networking stack"
keywords = ["p2p", "transport", "facade", "no_std"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
pinc-crypto = { workspace = true, features = ["alloc"] }
pinc-security = { workspace = true }
pinc-keystore = { workspace = true }
pinc-transport = { workspace = true, features = ["alloc"] }
pinc-core = { workspace = true, features = ["alloc"] }
pinc-node = { workspace = true }
pinc-connect = { workspace = true, features = ["alloc"] }
pinc-portmap = { workspace = true }
pinc-broadcast = { workspace = true, features = ["alloc"] }
once_cell = { workspace = true, features = ["race", "alloc"] }
hashbrown = { workspace = true, features = ["inline-more"] }
rapidhash = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
nuclei = { workspace = true }

[features]
default = ["std"]
# The standard library: `System` as a `Platform` (`std::time::Instant`, `std::io::Error`, the operating system's
# randomness), `Pinc::builder`, `Identity::from_seed` and `generate`, and one pair of buffer pools and one handshake
# pool per thread instead of per endpoint. Without it the crate is `no_std` plus `alloc`.
std = ["pinc-keystore/std"]
# Lets a TPM key store (`pinc-keystore`) hold the identity: pass it to `Builder::key_store`.
hwenc = ["std", "pinc-keystore/hwenc"]
# A slab of tickets of its own (`StandbyProbe`), driven call by call, for the trace check of the proofs, and the
# node's probes.
trace = ["std", "pinc-node/trace", "pinc-transport/trace"]

[lints]
workspace = true

[[example]]
name = "echo"
required-features = ["std"]

[[example]]
name = "transfer"
required-features = ["std"]

[[example]]
name = "defradb_backend"
required-features = ["std"]

[[example]]
name = "relay"
required-features = ["std"]

[[example]]
name = "platform"
required-features = ["std"]
