[package]
name = "pinc-mcu-firmware"
description = "The PINC endpoint on a NUCLEO-H7S3L8 (STM32H7S3L8, Cortex-M7): an echo acceptor over the board's serial line that measures itself"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "pinc-mcu-firmware"
test = false
bench = false

[features]
default = []
# The core at 320 MHz (`pinc_mcu_link::clock`). The boot stage and the image must be built alike.
fast-clock = ["pinc-mcu-link/fast-clock"]

[dependencies]
pinc-mcu-link = { workspace = true }
pinc-core = { workspace = true }
pinc-crypto = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
stm32-metapac = { workspace = true }

[lints]
workspace = true
