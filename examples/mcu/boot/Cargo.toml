[package]
name = "pinc-mcu-boot"
description = "The boot stage of the NUCLEO-H7S3L8: maps the board's external flash and starts the image in it"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

build = "build.rs"

[[bin]]
name = "pinc-mcu-boot"
test = false
bench = false

[features]
default = []
# The core at 320 MHz (`pinc_mcu_link::clock`). The boot stage and the image must be built alike.
fast-clock = ["pinc-mcu-link/fast-clock"]

[dependencies]
pinc-mcu-link = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
stm32-metapac = { workspace = true }

[lints]
workspace = true
