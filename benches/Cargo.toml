# The micro benchmarks and the loopback comparison with iroh and rust-libp2p: a workspace of its own, outside the
# library's, so the comparators, their runtime (tokio) and their C code (ring, aws-lc-sys) never enter the library's
# dependency graph or lockfile. The PINC crates come in by path; every dependency is declared once, below.
[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Theo M. Bulut <theo@source.network>"]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/pinc"
publish = false

[workspace.dependencies]
pinc-wire = { path = "../crates/pinc-wire", version = "0.1.0" }
pinc-dag = { path = "../crates/pinc-dag", version = "0.1.0" }
pinc-crypto = { path = "../crates/pinc-crypto", version = "0.1.0" }
pinc-security = { path = "../crates/pinc-security", version = "0.1.0" }
pinc-keystore = { path = "../crates/pinc-keystore", version = "0.1.0" }
pinc-transport = { path = "../crates/pinc-transport", version = "0.1.0" }
pinc-sim = { path = "../crates/pinc-sim", version = "0.1.0" }
pinc-connect = { path = "../crates/pinc-connect", version = "0.1.0" }
pinc-reconcile = { path = "../crates/pinc-reconcile", version = "0.1.0" }
pinc-dtn = { path = "../crates/pinc-dtn", version = "0.1.0" }
pinc-values = { path = "../crates/pinc-values", version = "0.1.0" }
pinc-core = { path = "../crates/pinc-core", version = "0.1.0" }
pinc-broadcast = { path = "../crates/pinc-broadcast", version = "0.1.0" }
pinc = { path = "../crates/pinc", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
nuclei = "0.5.8"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }
criterion = "0.7.0"
# The libraries PINC is measured against, and what they need.
iroh = "1.4.1"
libp2p = { version = "0.57.1", default-features = false }
libp2p-stream = "0.5.0-alpha"
# What the comparison reads of the libraries' handshakes: iroh's handshake data (noq's type), and libp2p-tls's configs
# in one handshake in memory. The versions and features are the ones the libraries already use.
noq = { version = "1.4.0", default-features = false, features = ["rustls"] }
libp2p-tls = "0.7.0"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# Segmented UDP sends and coalesced receives for the PINC host, the calls the compared libraries use.
quinn-udp = "0.5.16"
futures = { version = "0.3.34", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[package]
name = "pinc-benches"
description = "Criterion benchmarks of the PINC crates, and the loopback comparison with iroh and rust-libp2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
pinc-wire = { workspace = true }
pinc-dag = { workspace = true, features = ["std"] }
pinc-crypto = { workspace = true }
pinc-security = { workspace = true }
pinc-transport = { workspace = true, features = ["alloc"] }
pinc-sim = { workspace = true }
pinc-reconcile = { workspace = true, features = ["alloc"] }
pinc-dtn = { workspace = true }
pinc-values = { workspace = true }
pinc-core = { workspace = true, features = ["alloc"] }
pinc-connect = { workspace = true }
pinc-broadcast = { workspace = true, features = ["alloc"] }
pinc = { workspace = true }
pinc-keystore = { workspace = true, features = ["std"] }
nuclei = { workspace = true }

iroh = { workspace = true }
libp2p = { workspace = true, features = ["tokio", "quic", "tcp", "noise", "yamux", "macros"] }
libp2p-stream = { workspace = true }
noq = { workspace = true }
libp2p-tls = { workspace = true }
rustls = { workspace = true }
quinn-udp = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
futures = { workspace = true, features = ["std", "async-await"] }

[dev-dependencies]
criterion = { workspace = true }
blake3 = { workspace = true, features = ["std"] }

[lints]
workspace = true

