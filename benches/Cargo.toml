# The micro benchmarks and the loopback comparison with iroh and rust-libp2p: a workspace of its own, outside the
# library's, so the comparators, their runtime (tokio) and their C code (ring, aws-lc-sys) never enter the library's
# dependency graph or lockfile. The VINC crates come in by path; every dependency is declared once, below.
[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Theo M. Bulut <theo@source.network>"]
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/sourcenetwork/vinc"
publish = false

[workspace.dependencies]
vinc-wire = { path = "../crates/vinc-wire", version = "0.1.0" }
vinc-dag = { path = "../crates/vinc-dag", version = "0.1.0" }
vinc-crypto = { path = "../crates/vinc-crypto", version = "0.1.0" }
vinc-security = { path = "../crates/vinc-security", version = "0.1.0" }
vinc-keystore = { path = "../crates/vinc-keystore", version = "0.1.0" }
vinc-transport = { path = "../crates/vinc-transport", version = "0.1.0" }
vinc-sim = { path = "../crates/vinc-sim", version = "0.1.0" }
vinc-connect = { path = "../crates/vinc-connect", version = "0.1.0" }
vinc-reconcile = { path = "../crates/vinc-reconcile", version = "0.1.0" }
vinc-dtn = { path = "../crates/vinc-dtn", version = "0.1.0" }
vinc-values = { path = "../crates/vinc-values", version = "0.1.0" }
vinc-core = { path = "../crates/vinc-core", version = "0.1.0" }
vinc-broadcast = { path = "../crates/vinc-broadcast", version = "0.1.0" }
vinc = { path = "../crates/vinc", version = "0.1.0" }

blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }
nuclei = "0.5.8"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }
criterion = "0.7.0"
# The libraries VINC is measured against, and what they need.
iroh = "1.4.1"
libp2p = { version = "0.57.1", default-features = false }
libp2p-stream = "0.5.0-alpha"
# Segmented UDP sends and coalesced receives for the VINC host, the calls the compared libraries use.
quinn-udp = "0.5.16"
futures = { version = "0.3.34", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[package]
name = "vinc-benches"
description = "Criterion benchmarks of the VINC crates, and the loopback comparison with iroh and rust-libp2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["std"] }
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }
vinc-transport = { workspace = true, features = ["alloc"] }
vinc-sim = { workspace = true }
vinc-reconcile = { workspace = true, features = ["alloc"] }
vinc-dtn = { workspace = true }
vinc-values = { workspace = true }
vinc-core = { workspace = true, features = ["alloc"] }
vinc-connect = { workspace = true }
vinc-broadcast = { workspace = true, features = ["alloc"] }
vinc = { workspace = true }
vinc-keystore = { workspace = true }
nuclei = { workspace = true }

iroh = { workspace = true }
libp2p = { workspace = true, features = ["tokio", "quic", "tcp", "noise", "yamux", "macros"] }
libp2p-stream = { workspace = true }
quinn-udp = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
futures = { workspace = true, features = ["std", "async-await"] }

[dev-dependencies]
criterion = { workspace = true }
blake3 = { workspace = true, features = ["std"] }

[lints]
workspace = true

