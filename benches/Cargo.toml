[package]
name = "vinc-benches"
description = "Criterion benchmarks of the VINC crates, and later the comparisons with iroh and rust-libp2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["std"] }
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }
vinc-transport = { workspace = true, features = ["alloc"] }
vinc-sim = { workspace = true }
vinc-reconcile = { workspace = true, features = ["alloc"] }
vinc-dtn = { workspace = true }
vinc-values = { workspace = true }
vinc-core = { workspace = true, features = ["alloc"] }
vinc-connect = { workspace = true }
vinc-broadcast = { workspace = true, features = ["alloc"] }
vinc = { workspace = true }
nuclei = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
blake3 = { workspace = true, features = ["std"] }

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "dag"
harness = false

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "security"
harness = false

[[bench]]
name = "transport_packet"
harness = false

[[bench]]
name = "transport_stream"
harness = false

[[bench]]
name = "transport_recovery"
harness = false

[[bench]]
name = "transport_conn"
harness = false

[[bench]]
name = "sim_engine"
harness = false

[[bench]]
name = "dtn"
harness = false

[[bench]]
name = "values"
harness = false

[[bench]]
name = "reconcile"
harness = false

[[bench]]
name = "core"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "vinc_loopback"
harness = false

[lints]
workspace = true

[[bench]]
name = "connect"
harness = false
