[workspace]
resolver = "3"

[package]
name = "vinc-benches"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Criterion benchmarks for the VINC crates, in their own workspace so comparison dependencies never enter the main one"

[dependencies]
vinc-wire = { path = "../crates/vinc-wire" }
vinc-dag = { path = "../crates/vinc-dag", features = ["std"] }

[dev-dependencies]
criterion = "0.8.2"
blake3 = { version = "1.8.7", features = ["std"] }

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "dag"
harness = false

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = true
