[package]
name = "vinc-benches"
description = "Criterion benchmarks of the VINC crates, and later the comparisons with iroh and rust-libp2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autobenches = false

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["std"] }
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
blake3 = { workspace = true, features = ["std"] }

[[bench]]
name = "wire"
harness = false

[[bench]]
name = "dag"
harness = false

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "security"
harness = false

[lints]
workspace = true
