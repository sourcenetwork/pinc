[package]
name = "vinc-tests"
description = "Every test of the VINC workspace: integration, property, scenario and trace tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autobenches = false

[lib]
path = "support/lib.rs"

[features]
# Compiles the TPM backend and its tests (they need `swtpm` installed).
hwenc = ["vinc-keystore/hwenc"]

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["alloc"] }
vinc-crypto = { workspace = true }
vinc-security = { workspace = true }
vinc-keystore = { workspace = true }
vinc-transport = { workspace = true, features = ["alloc"] }
vinc-membership = { workspace = true, features = ["alloc"] }
vinc-sim = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }

[[test]]
name = "wire"
path = "wire.rs"

[[test]]
name = "dag_tree"
path = "dag_tree.rs"

[[test]]
name = "dag_cid"
path = "dag_cid.rs"

[[test]]
name = "dag_block"
path = "dag_block.rs"

[[test]]
name = "dag_car"
path = "dag_car.rs"

[[test]]
