[package]
name = "vinc-tests"
description = "Every test of the VINC workspace: integration, property, scenario and trace tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autobenches = false

[lib]
path = "support/lib.rs"

[features]
# Compiles the TPM backend and its tests (they need `swtpm` installed).
hwenc = ["vinc-keystore/hwenc"]

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["alloc"] }
vinc-crypto = { workspace = true, features = ["trace"] }
vinc-security = { workspace = true }
vinc-keystore = { workspace = true, features = ["std"] }
vinc-transport = { workspace = true, features = ["alloc", "trace", "inject"] }
vinc-membership = { workspace = true, features = ["alloc"] }
vinc-sim = { workspace = true, features = ["reference", "suite"] }
vinc-connect = { workspace = true }
vinc-portmap = { workspace = true }
vinc-reconcile = { workspace = true, features = ["alloc"] }
vinc-dtn = { workspace = true }
vinc-values = { workspace = true }
vinc-core = { workspace = true, features = ["alloc", "trace", "inject"] }
vinc-broadcast = { workspace = true, features = ["alloc"] }
vinc = { workspace = true, features = ["trace"] }
nuclei = { workspace = true }
tokio = { workspace = true }
smol = { workspace = true }
vinc-node = { workspace = true, features = ["trace"] }

[dev-dependencies]
proptest = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
x25519-dalek = { workspace = true }
chacha20 = { workspace = true, features = ["cipher"] }
aes = { workspace = true }
tpm2-protocol = { workspace = true }

