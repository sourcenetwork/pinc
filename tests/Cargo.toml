[package]
name = "vinc-tests"
description = "Every test of the VINC workspace: integration, property, scenario and trace tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autobenches = false

[lib]
path = "support/lib.rs"

[dependencies]
vinc-wire = { path = "../crates/vinc-wire" }
vinc-dag = { path = "../crates/vinc-dag", features = ["alloc"] }

[dev-dependencies]
proptest = "1"
blake3 = "1.8.7"
allocation-counter = "0.8"

[[test]]
name = "wire"
path = "wire.rs"

[[test]]
name = "dag_tree"
path = "dag_tree.rs"

[[test]]
name = "dag_cid"
path = "dag_cid.rs"

[[test]]
name = "dag_block"
path = "dag_block.rs"

[[test]]
name = "dag_car"
path = "dag_car.rs"

[lints]
workspace = true
