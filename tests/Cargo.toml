[package]
name = "vinc-tests"
description = "Every test of the VINC workspace: integration, property, scenario and trace tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
autotests = false
autobenches = false

[lib]
path = "support/lib.rs"

[dependencies]
vinc-wire = { workspace = true }
vinc-dag = { workspace = true, features = ["alloc"] }
vinc-crypto = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
ml-kem = { workspace = true }
ml-dsa = { workspace = true }

[[test]]
name = "wire"
path = "wire.rs"

[[test]]
name = "dag_tree"
path = "dag_tree.rs"

[[test]]
name = "dag_cid"
path = "dag_cid.rs"

[[test]]
name = "dag_block"
path = "dag_block.rs"

[[test]]
name = "dag_car"
path = "dag_car.rs"

[[test]]
name = "trace_ranges"
path = "trace_ranges.rs"

[[test]]
name = "trace_verifier"
path = "trace_verifier.rs"

[[test]]
name = "crypto_kat"
path = "crypto_kat.rs"

[[test]]
name = "crypto_kem"
path = "crypto_kem.rs"

[[test]]
name = "crypto_sig"
path = "crypto_sig.rs"

[[test]]
name = "crypto_misc"
path = "crypto_misc.rs"

[lints]
workspace = true
